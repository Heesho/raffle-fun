enum RaffleStatus {
  AWAITING_PRIZE
  ACTIVE
  DRAWING
  NFT_WON
  CASH_WON
  REFUNDING
  CLOSED
}

type Protocol @entity(immutable: false) {
  id: Bytes!
  raffleCount: BigInt!
  activeCount: BigInt!
  drawingCount: BigInt!
  nftWonCount: BigInt!
  cashWonCount: BigInt!
  refundingCount: BigInt!
  closedCount: BigInt!
  totalTickets: BigInt!
  raffles: [Raffle!]! @derivedFrom(field: "protocol")
  quoteTokens: [QuoteTokenStats!]! @derivedFrom(field: "protocol")
}

type QuoteTokenStats @entity(immutable: false) {
  id: String!
  protocol: Protocol!
  token: Bytes!
  raffleCount: BigInt!
  grossVolume: BigInt!
  settledVolume: BigInt!
  protocolFees: BigInt!
  quoteClaimed: BigInt!
  refundedVolume: BigInt!
  winnerCashRedeemed: BigInt!
  raffles: [Raffle!]! @derivedFrom(field: "quoteTokenStats")
  accounts: [AccountTokenStats!]! @derivedFrom(field: "quoteToken")
}

type Raffle @entity(immutable: false) {
  id: Bytes!
  protocol: Protocol!
  factoryId: BigInt!
  sponsor: Account!
  sponsorPrizeRecoveryRecipient: Account!
  protocolTreasury: Account!
  quoteToken: Bytes!
  quoteTokenStats: QuoteTokenStats!
  prizeToken: Bytes!
  prizeTokenId: BigInt!
  metadataURI: String!
  ticketPrice: BigInt!
  minimumTickets: BigInt!
  startTime: BigInt!
  endTime: BigInt!
  requestGraceDeadline: BigInt!
  drawRequestedAt: BigInt
  callbackDeadline: BigInt
  status: RaffleStatus!
  totalTickets: BigInt!
  grossSales: BigInt!
  unsettledPot: BigInt!
  remainingRefundLiability: BigInt!
  winnerCashLiability: BigInt!
  totalClaimableQuote: BigInt!
  totalRefundRedeemed: BigInt!
  totalProtocolFees: BigInt!
  quoteClaimed: BigInt!
  entropySequenceNumber: BigInt
  winningTicketId: BigInt
  winningTicketRedeemed: Boolean!
  prizeClaimed: Boolean!
  prizeDestination: Bytes
  createdTxHash: Bytes!
  createdBlock: BigInt!
  createdTimestamp: BigInt!
  requestedTxHash: Bytes
  requestedBlock: BigInt
  requestedTimestamp: BigInt
  resolvedTxHash: Bytes
  resolvedBlock: BigInt
  resolvedTimestamp: BigInt
  prizeClaimedTxHash: Bytes
  refundEnable: RefundEnable @derivedFrom(field: "raffle")
  refundRedemptions: [RefundRedemption!]! @derivedFrom(field: "raffle")
  winningRedemptions: [WinningRedemption!]! @derivedFrom(field: "raffle")
  tickets: [Ticket!]! @derivedFrom(field: "raffle")
  purchases: [Purchase!]! @derivedFrom(field: "raffle")
  participants: [RaffleAccount!]! @derivedFrom(field: "raffle")
}

type Account @entity(immutable: false) {
  id: Bytes!
  ticketsBought: BigInt!
  ticketsCurrentlyOwned: BigInt!
  rafflesSponsored: BigInt!
  participations: [RaffleAccount!]! @derivedFrom(field: "account")
  tokenStats: [AccountTokenStats!]! @derivedFrom(field: "account")
}

type AccountTokenStats @entity(immutable: false) {
  id: String!
  account: Account!
  quoteToken: QuoteTokenStats!
  grossSpent: BigInt!
  quoteClaimed: BigInt!
  refundsRedeemed: BigInt!
  winnerCashRedeemed: BigInt!
}

type RaffleAccount @entity(immutable: false) {
  id: String!
  raffle: Raffle!
  account: Account!
  ticketsBought: BigInt!
  ticketsCurrentlyOwned: BigInt!
  grossSpent: BigInt!
  quoteClaimed: BigInt!
  refundsRedeemed: BigInt!
  winnerCashRedeemed: BigInt!
}

type Ticket @entity(immutable: false) {
  id: String!
  raffle: Raffle!
  ticketId: BigInt!
  currentOwner: Account
  originalRecipient: Account!
  purchase: Purchase
  winning: Boolean!
  burned: Boolean!
}

type Purchase @entity(immutable: true) {
  id: String!
  raffle: Raffle!
  buyer: Account!
  recipient: Account!
  quantity: BigInt!
  firstTicketId: BigInt!
  lastTicketId: BigInt!
  grossAmount: BigInt!
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  logIndex: BigInt!
}

type DrawRequest @entity(immutable: true) {
  id: String!
  raffle: Raffle!
  sequenceNumber: BigInt!
  requester: Account!
  fee: BigInt!
  excessReturned: BigInt!
  drawRequestedAt: BigInt!
  callbackDeadline: BigInt!
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  logIndex: BigInt!
}

type Resolution @entity(immutable: true) {
  id: String!
  raffle: Raffle!
  sequenceNumber: BigInt!
  winningTicketId: BigInt!
  result: RaffleStatus!
  protocolFee: BigInt!
  winnerCashAmount: BigInt!
  sponsorCashAmount: BigInt!
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  logIndex: BigInt!
}

type RefundEnable @entity(immutable: true) {
  id: String!
  raffle: Raffle!
  finalizer: Account!
  requestWasAccepted: Boolean!
  remainingRefundLiability: BigInt!
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  logIndex: BigInt!
}

type RefundRedemption @entity(immutable: true) {
  id: String!
  raffle: Raffle!
  owner: Account!
  destination: Bytes!
  quantity: BigInt!
  amount: BigInt!
  remainingRefundLiability: BigInt!
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  logIndex: BigInt!
}

type WinningRedemption @entity(immutable: true) {
  id: String!
  raffle: Raffle!
  ticketId: BigInt!
  owner: Account!
  destination: Bytes!
  result: RaffleStatus!
  cashAmount: BigInt!
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  logIndex: BigInt!
}

type QuoteClaim @entity(immutable: true) {
  id: String!
  raffle: Raffle!
  account: Account!
  destination: Bytes!
  amount: BigInt!
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  logIndex: BigInt!
}

type SponsorPrizeClaim @entity(immutable: true) {
  id: String!
  raffle: Raffle!
  recipient: Account!
  destination: Bytes!
  prizeToken: Bytes!
  prizeTokenId: BigInt!
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  logIndex: BigInt!
}

type RaffleTransfer @entity(immutable: true) {
  id: String!
  raffle: Raffle!
  ticket: Ticket!
  from: Account
  to: Account
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  logIndex: BigInt!
}

type ProtocolDayData @entity(immutable: false) {
  id: String!
  protocol: Protocol!
  quoteToken: QuoteTokenStats!
  dayStart: BigInt!
  tickets: BigInt!
  grossVolume: BigInt!
  settledVolume: BigInt!
  protocolFees: BigInt!
  resolutions: BigInt!
}

type RaffleDayData @entity(immutable: false) {
  id: String!
  raffle: Raffle!
  dayStart: BigInt!
  tickets: BigInt!
  grossVolume: BigInt!
}
