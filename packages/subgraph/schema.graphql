enum RaffleStatus {
  AWAITING_PRIZE
  ACTIVE
  DRAWING
  NFT_WON
  CASH_WON
  REFUNDING
}

type Protocol @entity(immutable: false) {
  id: Bytes!
  raffleCount: BigInt!
  activeCount: BigInt!
  drawingCount: BigInt!
  nftWonCount: BigInt!
  cashWonCount: BigInt!
  refundingCount: BigInt!
  totalEntries: BigInt!
  raffles: [Raffle!]! @derivedFrom(field: "protocol")
  quoteTokens: [QuoteTokenStats!]! @derivedFrom(field: "protocol")
}

type QuoteTokenStats @entity(immutable: false) {
  id: String!
  protocol: Protocol!
  token: Bytes!
  raffleCount: BigInt!
  grossVolume: BigInt!
  settledVolume: BigInt!
  protocolFees: BigInt!
  quoteClaimed: BigInt!
  refundedVolume: BigInt!
  winnerCashRedeemed: BigInt!
  raffles: [Raffle!]! @derivedFrom(field: "quoteTokenStats")
  accounts: [AccountTokenStats!]! @derivedFrom(field: "quoteToken")
}

type Raffle @entity(immutable: false) {
  id: Bytes!
  protocol: Protocol!
  factoryId: BigInt!
  sponsor: Account!
  sponsorRecipient: Account!
  protocolTreasury: Account!
  quoteToken: Bytes!
  quoteTokenStats: QuoteTokenStats!
  prizeToken: Bytes!
  prizeTokenId: BigInt!
  entryPrice: BigInt!
  reserveEntries: BigInt!
  endTime: BigInt!
  drawRequestDeadline: BigInt!
  drawRequestedAt: BigInt
  callbackDeadline: BigInt
  status: RaffleStatus!
  totalEntries: BigInt!
  ticketCount: BigInt!
  grossSales: BigInt!
  unsettledPot: BigInt!
  remainingRefundLiability: BigInt!
  winnerRecipient: Account
  winnerProceeds: BigInt!
  sponsorProceeds: BigInt!
  protocolFees: BigInt!
  totalRefundRedeemed: BigInt!
  totalProtocolFees: BigInt!
  quoteClaimed: BigInt!
  ignoredVrfCallbackCount: BigInt!
  vrfRequestId: BigInt
  winningEntry: BigInt
  winningTicketId: BigInt
  winningTicketSettled: Boolean!
  winnerRedeemed: Boolean!
  prizeClaimed: Boolean!
  prizeDestination: Bytes
  createdTxHash: Bytes!
  createdBlock: BigInt!
  createdTimestamp: BigInt!
  requestedTxHash: Bytes
  requestedBlock: BigInt
  requestedTimestamp: BigInt
  resolvedTxHash: Bytes
  resolvedBlock: BigInt
  resolvedTimestamp: BigInt
  prizeClaimedTxHash: Bytes
  refundEnable: RefundEnable @derivedFrom(field: "raffle")
  refundRedemptions: [RefundRedemption!]! @derivedFrom(field: "raffle")
  winningSettlements: [WinningSettlement!]! @derivedFrom(field: "raffle")
  winningRedemptions: [WinningRedemption!]! @derivedFrom(field: "raffle")
  proceedsReleases: [ProceedsRelease!]! @derivedFrom(field: "raffle")
  tickets: [Ticket!]! @derivedFrom(field: "raffle")
  purchases: [Purchase!]! @derivedFrom(field: "raffle")
  participants: [RaffleAccount!]! @derivedFrom(field: "raffle")
  ignoredVrfCallbacks: [IgnoredVrfCallback!]! @derivedFrom(field: "raffle")
}

type Account @entity(immutable: false) {
  id: Bytes!
  entriesBought: BigInt!
  ticketsCurrentlyOwned: BigInt!
  rafflesSponsored: BigInt!
  participations: [RaffleAccount!]! @derivedFrom(field: "account")
  tokenStats: [AccountTokenStats!]! @derivedFrom(field: "account")
}

type AccountTokenStats @entity(immutable: false) {
  id: String!
  account: Account!
  quoteToken: QuoteTokenStats!
  grossSpent: BigInt!
  quoteClaimed: BigInt!
  refundsRedeemed: BigInt!
  winnerCashRedeemed: BigInt!
}

type RaffleAccount @entity(immutable: false) {
  id: String!
  raffle: Raffle!
  account: Account!
  entriesBought: BigInt!
  ticketsCurrentlyOwned: BigInt!
  grossSpent: BigInt!
  quoteClaimed: BigInt!
  refundsRedeemed: BigInt!
  winnerCashRedeemed: BigInt!
}

type Ticket @entity(immutable: false) {
  id: String!
  raffle: Raffle!
  ticketId: BigInt!
  firstEntry: BigInt
  lastEntry: BigInt
  entryCount: BigInt
  currentOwner: Account
  originalRecipient: Account!
  purchase: Purchase
  winning: Boolean!
  burned: Boolean!
}

type Purchase @entity(immutable: true) {
  id: String!
  raffle: Raffle!
  ticket: Ticket!
  buyer: Account!
  recipient: Account!
  entryCount: BigInt!
  firstEntry: BigInt!
  lastEntry: BigInt!
  grossAmount: BigInt!
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  logIndex: BigInt!
}

type DrawRequest @entity(immutable: true) {
  id: String!
  raffle: Raffle!
  requestId: BigInt!
  requester: Account!
  fee: BigInt!
  excessReturned: BigInt!
  drawRequestedAt: BigInt!
  callbackDeadline: BigInt!
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  logIndex: BigInt!
}

type IgnoredVrfCallback @entity(immutable: true) {
  id: String!
  raffle: Raffle!
  receivedRequestId: BigInt!
  expectedRequestId: BigInt!
  status: RaffleStatus!
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  logIndex: BigInt!
}

type Resolution @entity(immutable: true) {
  id: String!
  raffle: Raffle!
  requestId: BigInt!
  winningEntry: BigInt!
  result: RaffleStatus!
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  logIndex: BigInt!
}

type RefundEnable @entity(immutable: true) {
  id: String!
  raffle: Raffle!
  finalizer: Account!
  remainingRefundLiability: BigInt!
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  logIndex: BigInt!
}

type RefundRedemption @entity(immutable: true) {
  id: String!
  raffle: Raffle!
  owner: Account!
  ticketQuantity: BigInt!
  entryQuantity: BigInt!
  amount: BigInt!
  remainingRefundLiability: BigInt!
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  logIndex: BigInt!
}

type WinningSettlement @entity(immutable: true) {
  id: String!
  raffle: Raffle!
  ticketId: BigInt!
  settler: Account!
  result: RaffleStatus!
  cashAmount: BigInt!
  protocolFee: BigInt!
  sponsorAmount: BigInt!
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  logIndex: BigInt!
}

type WinningRedemption @entity(immutable: true) {
  id: String!
  raffle: Raffle!
  ticketId: BigInt!
  winner: Account!
  result: RaffleStatus!
  cashAmount: BigInt!
  prizeToken: Bytes!
  prizeTokenId: BigInt!
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  logIndex: BigInt!
}

enum ProceedsKind {
  SPONSOR
  PROTOCOL
}

type ProceedsRelease @entity(immutable: true) {
  id: String!
  raffle: Raffle!
  caller: Account!
  recipient: Account!
  kind: ProceedsKind!
  amount: BigInt!
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  logIndex: BigInt!
}

type SponsorPrizeRelease @entity(immutable: true) {
  id: String!
  raffle: Raffle!
  caller: Account!
  recipient: Account!
  prizeToken: Bytes!
  prizeTokenId: BigInt!
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  logIndex: BigInt!
}

type RaffleTransfer @entity(immutable: true) {
  id: String!
  raffle: Raffle!
  ticket: Ticket!
  from: Account
  to: Account
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  logIndex: BigInt!
}

type ProtocolDayData @entity(immutable: false) {
  id: String!
  protocol: Protocol!
  quoteToken: QuoteTokenStats!
  dayStart: BigInt!
  entries: BigInt!
  grossVolume: BigInt!
  settledVolume: BigInt!
  protocolFees: BigInt!
  resolutions: BigInt!
}

type RaffleDayData @entity(immutable: false) {
  id: String!
  raffle: Raffle!
  dayStart: BigInt!
  entries: BigInt!
  grossVolume: BigInt!
}
