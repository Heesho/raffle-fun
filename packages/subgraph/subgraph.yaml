specVersion: 1.3.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: RaffleFactory
    network: sepolia
    source:
      abi: RaffleFactory
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Protocol
        - QuoteTokenStats
        - Raffle
        - Account
      abis:
        - name: RaffleFactory
          file: ./abis/RaffleFactory.json
      eventHandlers:
        - event: RaffleCreated(indexed uint256,indexed address,indexed address,address,address,uint256,address,address,uint128,uint64)
          handler: handleRaffleCreated
      file: ./src/factory.ts
templates:
  - kind: ethereum/contract
    name: Raffle
    network: sepolia
    source:
      abi: Raffle
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Raffle
        - Account
        - RaffleAccount
        - Ticket
        - Purchase
        - DrawRequest
        - IgnoredVrfCallback
        - Resolution
        - RefundEnable
        - RefundRedemption
        - WinningSettlement
        - WinningRedemption
        - ProceedsRelease
        - SponsorPrizeRelease
        - RaffleTransfer
        - ProtocolDayData
        - RaffleDayData
      abis:
        - name: Raffle
          file: ./abis/Raffle.json
      eventHandlers:
        - event: TicketPurchased(indexed address,indexed address,indexed uint256,uint128,uint128,uint128,uint256)
          handler: handleTicketPurchased
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
        - event: DrawRequested(indexed uint256,indexed address,uint256,uint256,uint256,uint256)
          handler: handleDrawRequested
        - event: VrfCallbackIgnored(indexed uint256,indexed uint256,uint8)
          handler: handleVrfCallbackIgnored
        - event: RaffleResolved(indexed uint256,indexed uint128,indexed uint8)
          handler: handleRaffleResolved
        - event: RefundsEnabled(indexed address,uint256)
          handler: handleRefundsEnabled
        - event: TicketsRefunded(indexed address,uint256,uint256,uint256,uint256)
          handler: handleTicketsRefunded
        - event: WinningTicketSettled(indexed uint256,indexed address,indexed uint8,uint256,uint256,uint256)
          handler: handleWinningTicketSettled
        - event: WinningTicketRedeemed(indexed uint256,indexed address,indexed uint8,uint256,address,uint256)
          handler: handleWinningTicketRedeemed
        - event: SponsorProceedsReleased(indexed address,indexed address,uint256)
          handler: handleSponsorProceedsReleased
        - event: ProtocolFeesReleased(indexed address,indexed address,uint256)
          handler: handleProtocolFeesReleased
        - event: SponsorPrizeReleased(indexed address,indexed address,indexed address,uint256)
          handler: handleSponsorPrizeReleased
      file: ./src/raffle.ts
