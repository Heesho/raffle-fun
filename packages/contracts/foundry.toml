[profile.default]
src = "src"
test = "test/foundry"
script = "script"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1_000
via_ir = false
fuzz = { runs = 1_000, seed = "0x524146464c45" }
invariant = { runs = 256, depth = 64, fail_on_revert = false }
gas_reports = ["Raffle", "RaffleFactory", "RaffleLens"]

[profile.ci]
fuzz = { runs = 10_000 }
invariant = { runs = 1_000, depth = 256, fail_on_revert = false }

[profile.coverage]
via_ir = false
optimizer = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
sort_imports = true
