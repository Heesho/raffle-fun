name: Subgraph

on:
  push:
    paths:
      - "packages/subgraph/**"
      - "packages/sdk/scripts/sync-artifacts.ts"
      - "packages/contracts/src/**"
      - ".github/workflows/subgraph.yml"
  pull_request:
    paths:
      - "packages/subgraph/**"
      - "packages/sdk/scripts/sync-artifacts.ts"
      - "packages/contracts/src/**"
      - ".github/workflows/subgraph.yml"

permissions:
  contents: read

jobs:
  subgraph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @raffle-fun/contracts compile
      - run: pnpm --filter @raffle-fun/sdk sync:check
      - run: pnpm subgraph:codegen
      - run: pnpm subgraph:build
      - run: pnpm subgraph:test
