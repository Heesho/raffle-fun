name: Hardhat SDK and repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @raffle-fun/contracts compile
      - run: pnpm contracts:test:hardhat
      - run: pnpm --filter @raffle-fun/sdk test
      - run: pnpm --filter @raffle-fun/sdk sync:check
      - run: pnpm typecheck
      - run: pnpm format:check
