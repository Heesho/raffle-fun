<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" width="780" height="280" role="img" aria-label="Worked example: eighty entries sold against a hundred-entry reserve pays sixty-four, twelve and four USDC">
  <text x="60" y="24" font-family="Nunito var, Inter var, sans-serif" font-size="15" font-weight="800" fill="#16229b">A worked example: 80 entries sold, reserve was 100</text>
  <text x="60" y="44" font-family="Inter var, system-ui, sans-serif" font-size="12" fill="#676c94">The reserve was missed, so this is the cash result. Nothing is rounded away — the three shares add back to 80.</text>

  <!-- pot -->
  <rect x="60" y="82" width="150" height="120" rx="10" fill="#f7f5ff" stroke="#16229b" stroke-width="1.4"/>
  <text x="135" y="120" font-family="Nunito var, Inter var, sans-serif" font-size="26" font-weight="900" fill="#16229b" text-anchor="middle">80</text>
  <text x="135" y="140" font-family="Inter var, system-ui, sans-serif" font-size="12" fill="#454b78" text-anchor="middle">USDC in the pot</text>
  <text x="135" y="166" font-family="Inter var, system-ui, sans-serif" font-size="10.5" fill="#676c94" text-anchor="middle">80 numbers sold</text>
  <text x="135" y="180" font-family="Inter var, system-ui, sans-serif" font-size="10.5" fill="#676c94" text-anchor="middle">at 1 USDC each</text>

  <!-- arrows -->
  <path d="M 210 108 C 250 108 250 92 292 92" fill="none" stroke="#f033bb" stroke-width="1.6"/>
  <path d="M 298 92 l -9 -4.5 l 0 9 Z" fill="#f033bb"/>
  <path d="M 210 142 C 250 142 250 152 292 152" fill="none" stroke="#1e2a9b" stroke-width="1.6"/>
  <path d="M 298 152 l -9 -4.5 l 0 9 Z" fill="#1e2a9b"/>
  <path d="M 210 176 C 250 176 250 212 292 212" fill="none" stroke="#7b3fe4" stroke-width="1.6"/>
  <path d="M 298 212 l -9 -4.5 l 0 9 Z" fill="#7b3fe4"/>

  <!-- recipients -->
  <rect x="300" y="70" width="420" height="44" rx="7" fill="#fdf0f9" stroke="#c01a92" stroke-width="1.2"/>
  <text x="318" y="97" font-family="Nunito var, Inter var, sans-serif" font-size="17" font-weight="900" fill="#c01a92">64</text>
  <text x="352" y="90" font-family="Inter var, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#c01a92">USDC to whoever holds the winning ticket</text>
  <text x="352" y="105" font-family="Inter var, system-ui, sans-serif" font-size="10.5" fill="#454b78">80% of gross — they burn the ticket to collect it</text>

  <rect x="300" y="130" width="420" height="44" rx="7" fill="#e9f0fd" stroke="#1e2a9b" stroke-width="1.2"/>
  <text x="318" y="157" font-family="Nunito var, Inter var, sans-serif" font-size="17" font-weight="900" fill="#1e2a9b">12</text>
  <text x="352" y="150" font-family="Inter var, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1e2a9b">USDC to the sponsor — plus the NFT back</text>
  <text x="352" y="165" font-family="Inter var, system-ui, sans-serif" font-size="10.5" fill="#454b78">15% of gross, and they keep the asset they put up</text>

  <rect x="300" y="190" width="420" height="44" rx="7" fill="#eee9ff" stroke="#5b3fd4" stroke-width="1.2"/>
  <text x="318" y="217" font-family="Nunito var, Inter var, sans-serif" font-size="17" font-weight="900" fill="#5b3fd4">4</text>
  <text x="352" y="210" font-family="Inter var, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#5b3fd4">USDC to the protocol treasury</text>
  <text x="352" y="225" font-family="Inter var, system-ui, sans-serif" font-size="10.5" fill="#454b78">5% of gross — the only fee the protocol ever takes</text>

  <text x="390" y="262" font-family="Inter var, system-ui, sans-serif" font-size="11" fill="#676c94" text-anchor="middle">64 + 12 + 4 = 80 · had the reserve been met instead, the ticket would have won the NFT and the sponsor 76 USDC</text>
</svg>
