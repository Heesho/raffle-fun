<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 286" width="780" height="286" role="img" aria-label="Timeline from raffle creation through the sale, the two draw windows, and the two possible endings">
  <text x="60" y="26" font-family="Nunito var, Inter var, sans-serif" font-size="15" font-weight="800" fill="#16229b">Every raffle ends within a bounded window</text>
  <text x="60" y="46" font-family="Inter var, system-ui, sans-serif" font-size="12" fill="#676c94">Nothing can hang forever. Each stage has a deadline, and missing one opens full refunds.</text>

  <!-- bands -->
  <rect x="60" y="78" width="280" height="40" rx="6" fill="#e9f0fd" stroke="#1e2a9b" stroke-width="1.1"/>
  <text x="200" y="103" font-family="Inter var, system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e2a9b" text-anchor="middle">Selling — up to 30 days</text>

  <rect x="340" y="78" width="160" height="40" rx="6" fill="#eee9ff" stroke="#5b3fd4" stroke-width="1.1"/>
  <text x="420" y="97" font-family="Inter var, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#5b3fd4" text-anchor="middle">2 days to start</text>
  <text x="420" y="111" font-family="Inter var, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#5b3fd4" text-anchor="middle">the draw</text>

  <rect x="500" y="78" width="160" height="40" rx="6" fill="#fdf0f9" stroke="#c01a92" stroke-width="1.1"/>
  <text x="580" y="97" font-family="Inter var, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#c01a92" text-anchor="middle">2 days for Chainlink</text>
  <text x="580" y="111" font-family="Inter var, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#c01a92" text-anchor="middle">to answer</text>

  <!-- axis + markers -->
  <line x1="60" y1="132" x2="660" y2="132" stroke="#c3c5dd" stroke-width="1"/>
  <g stroke="#c3c5dd" stroke-width="1">
    <line x1="60" y1="128" x2="60" y2="138"/>
    <line x1="340" y1="128" x2="340" y2="138"/>
    <line x1="500" y1="128" x2="500" y2="138"/>
    <line x1="660" y1="128" x2="660" y2="138"/>
  </g>
  <g font-family="Inter var, system-ui, sans-serif" font-size="10" fill="#676c94" text-anchor="middle">
    <text x="60" y="152">raffle created,</text>
    <text x="60" y="164">NFT locked in</text>
    <text x="340" y="152">deadline —</text>
    <text x="340" y="164">selling stops</text>
    <text x="500" y="152">draw must have</text>
    <text x="500" y="164">started by here</text>
    <text x="660" y="152">answer must have</text>
    <text x="660" y="164">arrived by here</text>
  </g>

  <!-- the two deadlines that open refunds -->
  <circle cx="500" cy="132" r="3.4" fill="#676c94"/>
  <circle cx="660" cy="132" r="3.4" fill="#676c94"/>
  <path d="M 500 178 C 500 200 400 196 300 216" fill="none" stroke="#676c94" stroke-width="1.3" stroke-dasharray="4 3"/>
  <path d="M 294 218 l 10 -4 l -2 9 Z" fill="#676c94"/>
  <path d="M 660 178 C 660 206 470 200 302 222" fill="none" stroke="#676c94" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="512" y="180" font-family="Inter var, system-ui, sans-serif" font-size="9.5" fill="#676c94">either deadline passes</text>

  <!-- the success path -->
  <path d="M 580 124 L 580 218" fill="none" stroke="#c01a92" stroke-width="1.5"/>
  <path d="M 580 226 l -5 -9 l 10 0 Z" fill="#c01a92"/>

  <!-- outcome boxes -->
  <rect x="60" y="226" width="240" height="46" rx="7" fill="#f4f4fb" stroke="#c3c5dd" stroke-width="1.1"/>
  <text x="180" y="245" font-family="Inter var, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#454b78" text-anchor="middle">Nobody starts it, or no answer</text>
  <text x="180" y="261" font-family="Inter var, system-ui, sans-serif" font-size="11" fill="#454b78" text-anchor="middle">anyone opens full refunds — no fee taken</text>

  <rect x="330" y="226" width="330" height="46" rx="7" fill="#fdf0f9" stroke="#c01a92" stroke-width="1.2"/>
  <text x="495" y="245" font-family="Inter var, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#c01a92" text-anchor="middle">The answer arrives in time</text>
  <text x="495" y="261" font-family="Inter var, system-ui, sans-serif" font-size="11" fill="#454b78" text-anchor="middle">NFT result or cash result — and that result is final</text>
</svg>
