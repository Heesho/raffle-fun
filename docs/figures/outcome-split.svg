<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 306" width="780" height="306" role="img" aria-label="How gross sales split in the NFT result and the cash result">
  <text x="60" y="26" font-family="Nunito var, Inter var, sans-serif" font-size="15" font-weight="800" fill="#16229b">Where every dollar of gross sales goes</text>
  <text x="60" y="46" font-family="Inter var, system-ui, sans-serif" font-size="12" fill="#676c94">Both branches split the same pot. Only the reserve decides which one runs, and who keeps the NFT.</text>

  <!-- row A: NFT result -->
  <text x="60" y="88" font-family="Inter var, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#16229b">Reserve met</text>
  <text x="60" y="105" font-family="Inter var, system-ui, sans-serif" font-size="11" fill="#454b78">NFT result</text>
  <text x="60" y="121" font-family="Inter var, system-ui, sans-serif" font-size="10.5" fill="#c01a92">NFT → winning ticket</text>
  <rect x="200" y="80" width="494" height="46" rx="5" fill="#1e2a9b"/>
  <rect x="694" y="80" width="26" height="46" rx="5" fill="#7b3fe4"/>
  <rect x="694" y="80" width="10" height="46" fill="#7b3fe4"/>
  <text x="447" y="109" font-family="Inter var, system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">95%</text>
  <text x="707" y="107" font-family="Inter var, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">5%</text>

  <!-- row B: cash result -->
  <text x="60" y="188" font-family="Inter var, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#16229b">Reserve missed</text>
  <text x="60" y="205" font-family="Inter var, system-ui, sans-serif" font-size="11" fill="#454b78">cash result</text>
  <text x="60" y="221" font-family="Inter var, system-ui, sans-serif" font-size="10.5" fill="#c01a92">NFT → back to sponsor</text>
  <rect x="200" y="180" width="416" height="46" rx="5" fill="#f033bb"/>
  <rect x="616" y="180" width="78" height="46" fill="#1e2a9b"/>
  <rect x="694" y="180" width="26" height="46" rx="5" fill="#7b3fe4"/>
  <rect x="694" y="180" width="10" height="46" fill="#7b3fe4"/>
  <text x="408" y="209" font-family="Inter var, system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">80%</text>
  <text x="655" y="209" font-family="Inter var, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">15%</text>
  <text x="707" y="207" font-family="Inter var, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">5%</text>

  <!-- scale rule -->
  <line x1="200" y1="244" x2="720" y2="244" stroke="#c3c5dd" stroke-width="1"/>
  <line x1="200" y1="240" x2="200" y2="248" stroke="#c3c5dd" stroke-width="1"/>
  <line x1="720" y1="240" x2="720" y2="248" stroke="#c3c5dd" stroke-width="1"/>
  <text x="460" y="260" font-family="Inter var, system-ui, sans-serif" font-size="10" fill="#676c94" text-anchor="middle">100% of gross sales</text>

  <!-- legend -->
  <rect x="200" y="278" width="11" height="11" rx="2.5" fill="#f033bb"/>
  <text x="217" y="288" font-family="Inter var, system-ui, sans-serif" font-size="11" fill="#454b78">winning ticket</text>
  <rect x="316" y="278" width="11" height="11" rx="2.5" fill="#1e2a9b"/>
  <text x="333" y="288" font-family="Inter var, system-ui, sans-serif" font-size="11" fill="#454b78">sponsor</text>
  <rect x="404" y="278" width="11" height="11" rx="2.5" fill="#7b3fe4"/>
  <text x="421" y="288" font-family="Inter var, system-ui, sans-serif" font-size="11" fill="#454b78">protocol treasury</text>
  <text x="560" y="288" font-family="Inter var, system-ui, sans-serif" font-size="10.5" fill="#676c94">Refunds pay 100% back and charge nothing.</text>
</svg>
