<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f13-title f13-desc" viewBox="0 0 720 360" font-family="Inter,'Helvetica Neue',Arial,sans-serif">
  <title id="f13-title">Callback versus timeout race</title>
  <desc id="f13-desc">At the callback deadline the oracle callback and the refund finalization can race; block inclusion decides which terminal transition executes and the other is safely rejected.</desc>
  <defs><marker id="f13m7b3fe4" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#7b3fe4"/></marker><marker id="f13mc8213f" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#c8213f"/></marker><marker id="f13m22b573" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#22b573"/></marker></defs>
  <rect x="0.75" y="0.75" width="718.5" height="358.5" rx="17" fill="#fcfcff" stroke="#dcdded" stroke-width="1.5"/>
  <g transform="translate(26 34) scale(0.833)" stroke="#7a4f00" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#7a4f00"><circle cx="12" cy="12" r="8.3"/><path d="M12 7.4V12l3.1 2.1"/></g>
  <text x="54" y="49" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="750" fill="#10143a">the exact moment drawRequestedAt + 2 days arrives</text>
  <text x="54" y="66" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="550" fill="#676c94">two different transactions are simultaneously valid in the mempool</text>
  <rect x="26" y="96" width="216" height="84" rx="12" fill="#f1eafc" stroke="#7b3fe4" stroke-width="1.6"/><g transform="translate(123 106) scale(0.917)" stroke="#7b3fe4" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#7b3fe4"><path d="M13.4 3.4 5.8 13.6h4.8l-1.4 7 7.6-10.2H12Z"/></g><text x="134" y="145.84" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="750" fill="#10143a"><tspan x="134" dy="0">entropyCallback</tspan></text><text x="134" y="159.84" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="500" fill="#676c94"><tspan x="134" dy="0">Pyth delivers the random value</tspan></text>
  <rect x="26" y="208" width="216" height="84" rx="12" fill="#fdeaee" stroke="#c8213f" stroke-width="1.6"/><g transform="translate(123 218) scale(0.917)" stroke="#c8213f" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#c8213f"><path d="M6.6 5.4v4.4H11"/><path d="M6.9 9.6a6.9 6.9 0 1 1-1 4.9"/></g><text x="134" y="257.84" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="750" fill="#10143a"><tspan x="134" dy="0">enableRefunds</tspan></text><text x="134" y="271.84" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="500" fill="#676c94"><tspan x="134" dy="0">anyone finalizes the timeout</tspan></text>
  <rect x="322" y="148" width="156" height="92" rx="14" fill="#f4f4fb" stroke="#1e2a9b" stroke-width="1.7"/>
  <g transform="translate(390 160) scale(0.833)" stroke="#1e2a9b" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#1e2a9b"><path d="M12 3.2 19.8 7.6v8.8L12 20.8 4.2 16.4V7.6Z"/><path d="M4.2 7.6 12 12l7.8-4.4M12 12v8.8"/></g>
  <text x="400" y="200" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="780" fill="#10143a">Base block</text>
  <text x="400" y="216" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="600" fill="#676c94">first included wins</text>
  <path d="M 245 138 C 281.5 138 281.5 176 318 176" fill="none" stroke="#7b3fe4" stroke-width="2.2" stroke-linecap="round" marker-end="url(#f13m7b3fe4)"/>
  <path d="M 245 250 C 281.5 250 281.5 212 318 212" fill="none" stroke="#c8213f" stroke-width="2.2" stroke-linecap="round" marker-end="url(#f13mc8213f)"/>
  <rect x="540" y="92" width="154" height="92" rx="12" fill="#e3f7ee" stroke="#22b573" stroke-width="1.6"/><g transform="translate(606 100) scale(0.917)" stroke="#22b573" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#22b573"><path d="M8.2 4.2h7.6v4.4a3.8 3.8 0 0 1-7.6 0z"/><path d="M8.2 5.2H5.9a2.55 2.55 0 0 0 2.5 3.3M15.8 5.2h2.3a2.55 2.55 0 0 1-2.5 3.3M12 12.4v3.4M9.2 19.4h5.6M12 15.8c-1.7 0-2.6 1.1-2.8 3.6M12 15.8c1.7 0 2.6 1.1 2.8 3.6"/></g><text x="617" y="139.43" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="750" fill="#10143a"><tspan x="617" dy="0">Draw settles</tspan></text><text x="617" y="152.98000000000002" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="500" fill="#676c94"><tspan x="617" dy="0">NftWon or CashWon; late</tspan><tspan x="617" dy="13">timeout reverts</tspan></text>
  <rect x="540" y="204" width="154" height="92" rx="12" fill="#fdeaee" stroke="#c8213f" stroke-width="1.6"/><g transform="translate(606 212) scale(0.917)" stroke="#c8213f" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#c8213f"><path d="M12 3.4c.9 4.6 4.6 6 4.6 9.8a4.6 4.6 0 0 1-9.2 0c0-4 4-5.4 4.6-9.8Z"/><path d="M12 12.9c-1.1.75-1.7 1.6-1.7 2.55a1.7 1.7 0 0 0 3.4 0c0-.95-.6-1.8-1.7-2.55Z"/></g><text x="617" y="251.43" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="750" fill="#10143a"><tspan x="617" dy="0">Refunding</tspan></text><text x="617" y="264.98" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="500" fill="#676c94"><tspan x="617" dy="0">late callback emits</tspan><tspan x="617" dy="13">CallbackIgnored</tspan></text>
  <path d="M 481 176 C 508 176 508 138 535 138" fill="none" stroke="#22b573" stroke-width="2.2" stroke-linecap="round" marker-end="url(#f13m22b573)"/>
  <path d="M 481 212 C 508 212 508 250 535 250" fill="none" stroke="#c8213f" stroke-width="2.2" stroke-linecap="round" marker-end="url(#f13mc8213f)"/>
  <text x="26" y="320" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.3" font-weight="550" fill="#676c94">Both orderings are safe: each terminal transition is valid when executed, and the loser is rejected by status checks.</text>
  <text x="26" y="335" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.3" font-weight="550" fill="#676c94">Ticket holders keep exactly one right either way: the winning award or the exact refund.</text>
</svg>
