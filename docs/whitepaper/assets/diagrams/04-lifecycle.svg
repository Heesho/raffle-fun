  <text x="621" y="292" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.3" font-weight="550" fill="#676c94">NFT winner</text>
  <text x="26" y="342" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="550" fill="#676c94">Terminal states are absorbing: redemptions and claims change balances, never the status.</text>
  <line x1="26" y1="395.5" x2="46" y2="395.5" stroke="#9aa0c0" stroke-width="2" stroke-linecap="round" stroke-dasharray="4.5 3.5"/><text x="52" y="399" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="550" fill="#676c94">transient (never observable between transactions)</text><rect x="314.6066688000002" y="390" width="11" height="11" rx="3" fill="#e3f7ee"/><text x="331.6066688000002" y="399" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="550" fill="#676c94">double border = terminal</text>
