<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f04-title f04-desc" viewBox="0 0 720 420" font-family="Inter,'Helvetica Neue',Arial,sans-serif">
  <title id="f04-title">Complete raffle lifecycle</title>
  <desc id="f04-desc">The seven status values and every allowed forward transition, from AwaitingPrize through Active and Drawing to the four terminal outcomes.</desc>
