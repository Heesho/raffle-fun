<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 620">
  <title id="title">Complete raffle lifecycle</title>
  <desc id="desc">The seven status values and their allowed forward transitions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e2a9b"/></marker>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e2a9b"/><stop offset="0.55" stop-color="#d31d8b"/><stop offset="1" stop-color="#ffd84d"/></linearGradient>
  </defs>
  <rect width="720" height="620" rx="22" fill="#fbfaff"/>
  <text x="24" y="36" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#10143a"><tspan x="24" dy="0">Complete raffle lifecycle</tspan></text><g><rect x="24" y="70" width="327" height="112.5" rx="16" fill="#fff8e7" stroke="#ffd84d" stroke-width="2"/><rect x="24" y="70" width="8" height="112.5" rx="4" fill="#ffd84d"/><text x="187.5" y="100" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="187.5" dy="0">AwaitingPrize</tspan></text><text x="187.5" y="125" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="187.5" dy="0">Constructor exists inside atomic</tspan><tspan x="187.5" dy="16">creation</tspan></text></g><g><rect x="369" y="70" width="327" height="112.5" rx="16" fill="#e9eefc" stroke="#5aa9ff" stroke-width="2"/><rect x="369" y="70" width="8" height="112.5" rx="4" fill="#5aa9ff"/><text x="532.5" y="100" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="532.5" dy="0">Active</tspan></text><text x="532.5" y="125" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="532.5" dy="0">Sale window and request grace</tspan></text></g><g><rect x="24" y="200.5" width="327" height="112.5" rx="16" fill="#fce9f5" stroke="#7b3fe4" stroke-width="2"/><rect x="24" y="200.5" width="8" height="112.5" rx="4" fill="#7b3fe4"/><text x="187.5" y="230.5" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="187.5" dy="0">Drawing</tspan></text><text x="187.5" y="255.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="187.5" dy="0">One Entropy sequence pending</tspan></text></g><g><rect x="369" y="200.5" width="327" height="112.5" rx="16" fill="#ffffff" stroke="#22b573" stroke-width="2"/><rect x="369" y="200.5" width="8" height="112.5" rx="4" fill="#22b573"/><text x="532.5" y="230.5" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="532.5" dy="0">NftWon</tspan></text><text x="532.5" y="255.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="532.5" dy="0">Winning bearer burns for prize</tspan></text></g><g><rect x="24" y="331" width="327" height="112.5" rx="16" fill="#ffffff" stroke="#d31d8b" stroke-width="2"/><rect x="24" y="331" width="8" height="112.5" rx="4" fill="#d31d8b"/><text x="187.5" y="361" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="187.5" dy="0">CashWon</tspan></text><text x="187.5" y="386" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="187.5" dy="0">Winning bearer burns for cash</tspan></text></g><g><rect x="369" y="331" width="327" height="112.5" rx="16" fill="#ffffff" stroke="#1e2a9b" stroke-width="2"/><rect x="369" y="331" width="8" height="112.5" rx="4" fill="#1e2a9b"/><text x="532.5" y="361" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="532.5" dy="0">Refunding</tspan></text><text x="532.5" y="386" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="532.5" dy="0">Each bearer burns for ticket price</tspan></text></g><g><rect x="24" y="461.5" width="327" height="112.5" rx="16" fill="#ffffff" stroke="#676c94" stroke-width="2"/><rect x="24" y="461.5" width="8" height="112.5" rx="4" fill="#676c94"/><text x="187.5" y="491.5" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="187.5" dy="0">Closed</tspan></text><text x="187.5" y="516.5" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="187.5" dy="0">Zero sales; recovery recipient</tspan><tspan x="187.5" dy="16">claims prize</tspan></text></g>
  <text x="24" y="604" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#676c94">Solid arrows: calls or asset movement. Dashed arrows: reads, conditions, or external dependencies.</text>
</svg>
