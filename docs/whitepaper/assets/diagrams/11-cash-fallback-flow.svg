  <path d="M 352 225.60000000000002 C 402 225.60000000000002 402 212 452 212 L 452 250 C 402 250 402 256 352 256 Z" fill="#f2c94c" opacity="0.42"/>
  <path d="M 126 268 C 289 268 289 292 452 292 L 452 326 C 289 326 289 302 126 302 Z" fill="#d31d8b" opacity="0.3"/>
