  <rect x="96" y="64" width="30" height="160" rx="7" fill="#5aa9ff" opacity="0.9"/>
  <text x="86" y="82" text-anchor="end" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.2" font-weight="650" fill="#454b78"><tspan x="86" dy="0">Gross sales</tspan><tspan x="86" dy="15">800.00</tspan><tspan x="86" dy="15">80 tickets</tspan><tspan x="86" dy="15">x 10.00</tspan></text>
  <rect x="96" y="268" width="30" height="34" rx="7" fill="#d31d8b" opacity="0.9"/>
