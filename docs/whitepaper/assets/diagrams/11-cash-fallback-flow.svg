  <text x="388" y="136" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.8" font-weight="700" fill="#0d6b45">winner 608.00</text>
  <text x="388" y="232" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.8" font-weight="700" fill="#7a4f00">sponsor 152.00</text>
  <text x="240" y="300" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.8" font-weight="700" fill="#d31d8b">prize leaves the raffle</text>
  <text x="26" y="394" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="550" fill="#676c94">80% applies to the post-fee pot of 760.00 USDC, not to gross sales. No general refunds exist in this branch.</text>
