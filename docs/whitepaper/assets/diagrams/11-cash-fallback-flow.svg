  <text x="682" y="67" text-anchor="end" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="800" fill="#10143a">40.00</text>
  <text x="466" y="85" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.3" font-weight="550" fill="#676c94"><tspan x="466" dy="0">5% fee · pull claim</tspan></text>
  <rect x="452" y="118" width="242" height="62" rx="12" fill="#ffffff" stroke="#dcdded" stroke-width="1.2"/>
