  <rect x="322" y="104" width="30" height="152" rx="7" fill="#1f6fd0" opacity="0.85"/>
  <text x="316" y="274" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.8" font-weight="700" fill="#1f6fd0"><tspan x="316" dy="0">post-fee pot 760.00</tspan></text>
  <rect x="452" y="40" width="242" height="58" rx="12" fill="#ffffff" stroke="#dcdded" stroke-width="1.2"/>
  <rect x="452" y="40" width="4.5" height="58" rx="2.25" fill="#1e2a9b"/>
