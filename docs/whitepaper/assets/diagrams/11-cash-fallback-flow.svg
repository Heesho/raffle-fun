<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f11-title f11-desc" viewBox="0 0 720 420" font-family="Inter,'Helvetica Neue',Arial,sans-serif">
  <title id="f11-title">Cash-fallback money flow</title>
  <desc id="f11-desc">With 80 tickets sold, successful randomness yields a cash winner: the fee comes off gross, the winner takes 80% of the post-fee pot, and the recovery recipient claims the NFT.</desc>
  <defs></defs>
