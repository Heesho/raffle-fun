  <text x="500" y="289" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.7" font-weight="600" fill="#454b78">forced-in unrelated NFTs</text>
  <rect x="470" y="305" width="224" height="28" rx="9" fill="#fdeaee" stroke="#c8213f" stroke-width="1" opacity="0.9"/>
  <g transform="translate(479 311.5) scale(0.583)" stroke="#c8213f" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#c8213f"><path d="m6.6 6.6 10.8 10.8M17.4 6.6 6.6 17.4"/></g>
  <text x="500" y="323.5" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.7" font-weight="600" fill="#454b78">direct USDC donations</text>
  <rect x="470" y="339.5" width="224" height="28" rx="9" fill="#fdeaee" stroke="#c8213f" stroke-width="1" opacity="0.9"/>
  <g transform="translate(479 346) scale(0.583)" stroke="#c8213f" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#c8213f"><path d="m6.6 6.6 10.8 10.8M17.4 6.6 6.6 17.4"/></g>
