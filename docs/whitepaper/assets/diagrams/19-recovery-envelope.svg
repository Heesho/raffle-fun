<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f19-title f19-desc" viewBox="0 0 720 412" font-family="Inter,'Helvetica Neue',Arial,sans-serif">
  <title id="f19-title">Supported recovery envelope</title>
  <desc id="f19-desc">Inside the envelope every asset has a bounded exit path under honest token and chain assumptions; issuer actions, malicious code, lost keys, and censorship remain outside.</desc>
  <defs></defs>
  <rect x="0.75" y="0.75" width="718.5" height="410.5" rx="17" fill="#fcfcff" stroke="#dcdded" stroke-width="1.5"/>
  <rect x="26" y="40" width="420" height="290" rx="18" fill="#e3f7ee" stroke="#0d6b45" stroke-width="1.8" stroke-dasharray="9 6"/>
  <g transform="translate(42 54) scale(0.833)" stroke="#0d6b45" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#0d6b45"><path d="M12 3.2 18.8 6v5.1c0 4.3-2.8 7.2-6.8 8.7-4-1.5-6.8-4.4-6.8-8.7V6Z"/><path d="m9.1 11.7 2.1 2.1 3.9-4"/></g>
  <text x="70" y="69" text-anchor="start" font-family="Nunito,Inter,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="800" fill="#0d6b45">Inside the supported envelope</text>
  <text x="42" y="92" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.8" font-weight="600" fill="#454b78">every asset has exactly one bounded exit path</text>
  <text x="42" y="120" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="750" letter-spacing="1.4" fill="#0d6b45">ASSUMPTIONS</text>
  <g><rect x="42.0" y="132" width="235.0" height="23" rx="11.5" fill="#ffffff" stroke="#22b573" stroke-width="1.3"/><text x="159.5142016000001" y="146.956" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="650" fill="#0d6b45">honest ERC-721 ownership + safe transfer</text></g>
  <g><rect x="42.0" y="161" width="198.4" height="23" rx="11.5" fill="#ffffff" stroke="#22b573" stroke-width="1.3"/><text x="141.209536" y="175.956" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="650" fill="#0d6b45">exact-transfer, non-rebasing USDC</text></g>
  <g><rect x="42.0" y="190" width="153.2" height="23" rx="11.5" fill="#ffffff" stroke="#22b573" stroke-width="1.3"/><text x="118.58579200000001" y="204.956" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="650" fill="#0d6b45">Base includes transactions</text></g>
  <text x="42" y="237" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="750" letter-spacing="1.4" fill="#0d6b45">BOUNDED EXIT PATHS</text>
  <rect x="42" y="249" width="103.03670464" height="26" rx="8" fill="#ffffff" stroke="#dcdded" stroke-width="1.1"/>
  <g transform="translate(50 253) scale(0.625)" stroke="#0d6b45" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#0d6b45"><path d="M8.2 4.2h7.6v4.4a3.8 3.8 0 0 1-7.6 0z"/><path d="M8.2 5.2H5.9a2.55 2.55 0 0 0 2.5 3.3M15.8 5.2h2.3a2.55 2.55 0 0 1-2.5 3.3M12 12.4v3.4M9.2 19.4h5.6M12 15.8c-1.7 0-2.6 1.1-2.8 3.6M12 15.8c1.7 0 2.6 1.1 2.8 3.6"/></g>
  <text x="70" y="266.5" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.8" font-weight="700" fill="#454b78">winner burn</text>
