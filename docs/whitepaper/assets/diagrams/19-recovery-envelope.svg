  <g transform="translate(275.97401343999996 253) scale(0.625)" stroke="#0d6b45" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#0d6b45"><circle cx="12" cy="12" r="8.2"/><path d="M14.6 9.3c-.55-.95-1.5-1.35-2.5-1.35-1.3 0-2.35.7-2.35 1.85 0 2.5 4.9 1.35 4.9 3.9 0 1.25-1.15 1.95-2.55 1.95-1.1 0-2.1-.5-2.65-1.45M12 6.3v11.4"/></g>
