  <g transform="translate(162.03670463999998 253) scale(0.625)" stroke="#0d6b45" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#0d6b45"><path d="M12 3.4c.9 4.6 4.6 6 4.6 9.8a4.6 4.6 0 0 1-9.2 0c0-4 4-5.4 4.6-9.8Z"/><path d="M12 12.9c-1.1.75-1.7 1.6-1.7 2.55a1.7 1.7 0 0 0 3.4 0c0-.95-.6-1.8-1.7-2.55Z"/></g>
