  <text x="221.63262463999996" y="300.5" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.8" font-weight="700" fill="#454b78">expired-claim sweep</text>
  <g transform="translate(472 48) scale(0.750)" stroke="#c8213f" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#c8213f"><path d="m6.6 6.6 10.8 10.8M17.4 6.6 6.6 17.4"/></g>
  <text x="498" y="62" text-anchor="start" font-family="Nunito,Inter,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="800" fill="#c8213f">Outside: no rescue path</text>
  <text x="470" y="82" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.8" font-weight="600" fill="#676c94">the contract cannot repair these</text>
