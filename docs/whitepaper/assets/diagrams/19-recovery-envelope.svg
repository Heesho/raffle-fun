  <text x="26" y="386" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="550" fill="#676c94">Trapped value stays visible onchain but has no protocol exit: prevention lives in asset review before creation.</text>
</svg>
