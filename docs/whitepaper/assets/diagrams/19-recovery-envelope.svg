<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 450">
  <title id="title">Supported recovery envelope</title>
  <desc id="desc">The internal recovery claim is conditional on honest, available token and chain behavior.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e2a9b"/></marker>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e2a9b"/><stop offset="0.55" stop-color="#d31d8b"/><stop offset="1" stop-color="#ffd84d"/></linearGradient>
  </defs>
  <rect width="720" height="450" rx="22" fill="#fbfaff"/>
  <text x="24" y="36" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#10143a"><tspan x="24" dy="0">Supported recovery envelope</tspan></text><g><rect x="24" y="70" width="327" height="158" rx="16" fill="#e3f7ee" stroke="#22b573" stroke-width="2"/><rect x="24" y="70" width="8" height="158" rx="4" fill="#22b573"/><text x="187.5" y="100" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="187.5" dy="0">Inside the envelope</tspan></text><text x="187.5" y="125" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="187.5" dy="0">Honest ERC-721 ownership and safe</tspan><tspan x="187.5" dy="16">transfer; exact non-rebasing USDC;</tspan><tspan x="187.5" dy="16">functioning Base inclusion</tspan></text></g><g><rect x="369" y="70" width="327" height="158" rx="16" fill="#e9eefc" stroke="#1e2a9b" stroke-width="2"/><rect x="369" y="70" width="8" height="158" rx="4" fill="#1e2a9b"/><text x="532.5" y="100" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="532.5" dy="0">Bounded protocol paths</tspan></text><text x="532.5" y="125" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="532.5" dy="0">Winner burn, refund burns, quote</tspan><tspan x="532.5" dy="16">pulls, sponsor prize claim,</tspan><tspan x="532.5" dy="16">protocol-owned claim helper</tspan></text></g><g><rect x="24" y="246" width="327" height="158" rx="16" fill="#fdeaee" stroke="#c8213f" stroke-width="2"/><rect x="24" y="246" width="8" height="158" rx="4" fill="#c8213f"/><text x="187.5" y="276" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="187.5" dy="0">Outside the envelope</tspan></text><text x="187.5" y="301" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="187.5" dy="0">Issuer freeze or blacklist,</tspan><tspan x="187.5" dy="16">malicious upgrade, dishonest reads,</tspan><tspan x="187.5" dy="16">burned prize, lost keys, universal</tspan><tspan x="187.5" dy="16">censorship</tspan></text></g><g><rect x="369" y="246" width="327" height="158" rx="16" fill="#fce9f5" stroke="#d31d8b" stroke-width="2"/><rect x="369" y="246" width="8" height="158" rx="4" fill="#d31d8b"/><text x="532.5" y="276" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="532.5" dy="0">No rescue</tspan></text><text x="532.5" y="301" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="532.5" dy="0">Forced unrelated NFTs, direct</tspan><tspan x="532.5" dy="16">surplus donations, or maliciously</tspan><tspan x="532.5" dy="16">trapped assets cannot be swept</tspan></text></g>
  <text x="24" y="434" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#676c94">Solid arrows: calls or asset movement. Dashed arrows: reads, conditions, or external dependencies.</text>
</svg>
