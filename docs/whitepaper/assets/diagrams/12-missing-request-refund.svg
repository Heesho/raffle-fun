<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f12-title f12-desc" viewBox="0 0 720 356" font-family="Inter,'Helvetica Neue',Arial,sans-serif">
  <title id="f12-title">Missing-request refund flow</title>
  <desc id="f12-desc">If no draw request is accepted before the grace deadline, anyone enables refunds, the pot becomes refund liability, and each owner burns tickets for the exact price.</desc>
  <defs><marker id="f12m676c94" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#676c94"/></marker><marker id="f12mc8213f" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#c8213f"/></marker></defs>
  <rect x="0.75" y="0.75" width="718.5" height="354.5" rx="17" fill="#fcfcff" stroke="#dcdded" stroke-width="1.5"/>
  <rect x="26" y="50" width="250" height="32" rx="9" fill="#e8f2ff"/>
  <text x="151" y="70" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.8" font-weight="700" fill="#1f6fd0">sale ended · 80 tickets · 800.00 USDC</text>
  <rect x="284" y="50" width="230" height="32" rx="9" fill="#f1eafc"/>
  <text x="399" y="70" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.8" font-weight="700" fill="#7b3fe4">request grace · 3 days · nobody requests</text>
  <line x1="522" y1="44" x2="522" y2="88" stroke="#c8213f" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="534" y="64" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.8" font-weight="750" fill="#c8213f">deadline passes:</text>
  <text x="534" y="77" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.4" font-weight="550" fill="#676c94">no draw can ever start</text>
  <rect x="26" y="130" width="200" height="96" rx="12" fill="#ffffff" stroke="#1e2a9b" stroke-width="1.6"/><g transform="translate(115 146) scale(0.917)" stroke="#1e2a9b" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#1e2a9b"><path d="M6.4 17h11.2c-1.4-1.2-1.9-2.7-1.9-4.6 0-3.2-1.5-5.5-3.7-5.5s-3.7 2.3-3.7 5.5c0 1.9-.5 3.4-1.9 4.6Z"/><path d="M10.4 19.4a1.7 1.7 0 0 0 3.2 0"/></g><text x="126" y="185.84" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="750" fill="#10143a"><tspan x="126" dy="0">enableRefunds</tspan></text><text x="126" y="199.84" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="500" fill="#676c94"><tspan x="126" dy="0">anyone calls; no admin needed</tspan></text>
  <line x1="228" y1="178" x2="257" y2="178" stroke="#676c94" stroke-width="2.2" stroke-linecap="round" marker-end="url(#f12m676c94)"/>
  <rect x="260" y="130" width="200" height="96" rx="12" fill="#ffffff" stroke="#1f6fd0" stroke-width="1.6"/><g transform="translate(349 146) scale(0.917)" stroke="#1f6fd0" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#1f6fd0"><circle cx="12" cy="12" r="8.2"/><path d="M14.6 9.3c-.55-.95-1.5-1.35-2.5-1.35-1.3 0-2.35.7-2.35 1.85 0 2.5 4.9 1.35 4.9 3.9 0 1.25-1.15 1.95-2.55 1.95-1.1 0-2.1-.5-2.65-1.45M12 6.3v11.4"/></g><text x="360" y="185.84" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="750" fill="#10143a"><tspan x="360" dy="0">Pot becomes liability</tspan></text><text x="360" y="199.84" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="500" fill="#676c94"><tspan x="360" dy="0">800.00 reserved for refunds</tspan></text>
  <line x1="462" y1="178" x2="491" y2="178" stroke="#676c94" stroke-width="2.2" stroke-linecap="round" marker-end="url(#f12m676c94)"/>
  <rect x="494" y="130" width="200" height="96" rx="12" fill="#ffffff" stroke="#22b573" stroke-width="1.6"/><g transform="translate(583 146) scale(0.917)" stroke="#22b573" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#22b573"><path d="M12 3.4c.9 4.6 4.6 6 4.6 9.8a4.6 4.6 0 0 1-9.2 0c0-4 4-5.4 4.6-9.8Z"/><path d="M12 12.9c-1.1.75-1.7 1.6-1.7 2.55a1.7 1.7 0 0 0 3.4 0c0-.95-.6-1.8-1.7-2.55Z"/></g><text x="594" y="185.84" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="750" fill="#10143a"><tspan x="594" dy="0">Owners burn tickets</tspan></text><text x="594" y="199.84" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="500" fill="#676c94"><tspan x="594" dy="0">exactly 10.00 per ticket</tspan></text>
  <path d="M 522 88 L 522 101 Q 522 108 515 108 L 133 108 Q 126 108 126 115 L 126 127" fill="none" stroke="#c8213f" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#f12mc8213f)"/>
  <rect x="26" y="258" width="668" height="46" rx="11" fill="#fce9f5" stroke="#d31d8b" stroke-width="1.2"/>
  <g transform="translate(42 271) scale(0.792)" stroke="#d31d8b" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#d31d8b"><path d="M12 3.4 18.8 9 12 20.6 5.2 9 Z"/><path d="M5.2 9h13.6M12 3.4 9.6 9l2.4 11.6M12 3.4 14.4 9"/></g>
  <text x="70" y="286" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.3" font-weight="600" fill="#454b78">The prize NFT was never won: the fixed recovery recipient claims it. No fee, no sponsor proceeds, no winner.</text>
  <text x="26" y="330" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="550" fill="#676c94">Refunds are bearer rights: whoever owns a ticket when refunds are enabled can burn it, whenever they choose.</text>
</svg>
