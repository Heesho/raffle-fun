<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f02-title f02-desc" viewBox="0 0 720 434" font-family="Inter,'Helvetica Neue',Arial,sans-serif">
  <title id="f02-title">Participant role map</title>
  <desc id="f02-desc">Eight separate roles surround one raffle contract. One address may hold several roles, but each permission is defined separately.</desc>
  <defs></defs>
