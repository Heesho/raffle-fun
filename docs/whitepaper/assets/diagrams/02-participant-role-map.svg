  <g transform="translate(349 180) scale(0.917)" stroke="#ffffff" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#ffffff"><path d="M12 3.2 19.8 7.6v8.8L12 20.8 4.2 16.4V7.6Z"/><path d="M4.2 7.6 12 12l7.8-4.4M12 12v8.8"/></g>
  <text x="360" y="222" text-anchor="middle" font-family="Nunito,Inter,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="800" fill="#ffffff">Raffle contract</text>
  <text x="360" y="240" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="550" fill="#c9d1ff">fixed rules · no owner · no operator</text>
  <rect x="26" y="32" width="210" height="82" rx="12" fill="#ffffff" stroke="#dcdded" stroke-width="1.2"/><rect x="26" y="32" width="4.5" height="82" rx="2.25" fill="#d31d8b"/><g transform="translate(40 39) scale(0.792)" stroke="#d31d8b" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#d31d8b"><path d="M12 3.4 18.8 9 12 20.6 5.2 9 Z"/><path d="M5.2 9h13.6M12 3.4 9.6 9l2.4 11.6M12 3.4 14.4 9"/></g><text x="67" y="54" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="760" fill="#10143a">Sponsor</text><text x="40" y="70.5" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.3" font-weight="500" fill="#676c94"><tspan x="40" dy="0">Deposits the prize; fixes price,</tspan><tspan x="40" dy="13.9">threshold, dates, recovery</tspan><tspan x="40" dy="13.9">recipient</tspan></text>
  <rect x="255" y="32" width="210" height="82" rx="12" fill="#ffffff" stroke="#dcdded" stroke-width="1.2"/><rect x="255" y="32" width="4.5" height="82" rx="2.25" fill="#1f6fd0"/><g transform="translate(269 39) scale(0.792)" stroke="#1f6fd0" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#1f6fd0"><path d="M3.5 7.5h17v3.1a1.9 1.9 0 0 0 0 2.8v3.1h-17v-3.1a1.9 1.9 0 0 0 0-2.8z"/><line x1="14.6" y1="8.8" x2="14.6" y2="15.2" stroke-dasharray="1.8 2"/></g><text x="296" y="54" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="760" fill="#10143a">Buyer / ticket holder</text><text x="269" y="70.5" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.3" font-weight="500" fill="#676c94"><tspan x="269" dy="0">Pays USDC; owns a transferable</tspan><tspan x="269" dy="13.9">bearer claim until it burns</tspan></text>
  <rect x="484" y="32" width="210" height="82" rx="12" fill="#ffffff" stroke="#dcdded" stroke-width="1.2"/><rect x="484" y="32" width="4.5" height="82" rx="2.25" fill="#7b3fe4"/><g transform="translate(498 39) scale(0.792)" stroke="#7b3fe4" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#7b3fe4"><rect x="4" y="4" width="16" height="16" rx="3.4"/><circle cx="9" cy="9" r="1.35" fill="currentColor" stroke="none"/><circle cx="15" cy="9" r="1.35" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.35" fill="currentColor" stroke="none"/><circle cx="9" cy="15" r="1.35" fill="currentColor" stroke="none"/><circle cx="15" cy="15" r="1.35" fill="currentColor" stroke="none"/></g><text x="525" y="54" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="760" fill="#10143a">Draw requester</text><text x="498" y="70.5" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.3" font-weight="500" fill="#676c94"><tspan x="498" dy="0">Anyone; pays the current Pyth fee</tspan><tspan x="498" dy="13.9">to start the draw</tspan></text>
  <rect x="26" y="172" width="210" height="82" rx="12" fill="#ffffff" stroke="#dcdded" stroke-width="1.2"/><rect x="26" y="172" width="4.5" height="82" rx="2.25" fill="#1e2a9b"/><g transform="translate(40 179) scale(0.792)" stroke="#1e2a9b" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#1e2a9b"><circle cx="8" cy="12" r="3.2"/><path d="M11.2 12h8m-3.4 0v3.1m3.4-3.1v2.3"/></g><text x="67" y="194" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="760" fill="#10143a">Factory owner</text><text x="40" y="210.5" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.3" font-weight="500" fill="#676c94"><tspan x="40" dy="0">Future creation pause and future</tspan><tspan x="40" dy="13.9">treasury only</tspan></text>
  <rect x="484" y="172" width="210" height="82" rx="12" fill="#ffffff" stroke="#dcdded" stroke-width="1.2"/><rect x="484" y="172" width="4.5" height="82" rx="2.25" fill="#7b3fe4"/><g transform="translate(498 179) scale(0.792)" stroke="#7b3fe4" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#7b3fe4"><path d="M13.4 3.4 5.8 13.6h4.8l-1.4 7 7.6-10.2H12Z"/></g><text x="525" y="194" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="760" fill="#10143a">Pyth Entropy</text><text x="498" y="210.5" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.3" font-weight="500" fill="#676c94"><tspan x="498" dy="0">External randomness; delivers the</tspan><tspan x="498" dy="13.9">authenticated callback</tspan></text>
  <rect x="26" y="312" width="210" height="82" rx="12" fill="#ffffff" stroke="#dcdded" stroke-width="1.2"/><rect x="26" y="312" width="4.5" height="82" rx="2.25" fill="#eab308"/><g transform="translate(40 319) scale(0.792)" stroke="#eab308" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#eab308"><rect x="3.6" y="6.4" width="16.8" height="12" rx="2.6"/><path d="M15.6 12.4h4.8"/><circle cx="16.3" cy="12.4" r="0.9" fill="currentColor" stroke="none"/></g><text x="67" y="334" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="760" fill="#10143a">Recovery recipient</text><text x="40" y="350.5" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.3" font-weight="500" fill="#676c94"><tspan x="40" dy="0">Fixed at creation; claims the NFT</tspan><tspan x="40" dy="13.9">in cash, refund, or empty</tspan><tspan x="40" dy="13.9">outcomes</tspan></text>
  <rect x="255" y="312" width="210" height="82" rx="12" fill="#ffffff" stroke="#dcdded" stroke-width="1.2"/><rect x="255" y="312" width="4.5" height="82" rx="2.25" fill="#22b573"/><g transform="translate(269 319) scale(0.792)" stroke="#22b573" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#22b573"><circle cx="12" cy="12" r="8.2"/><path d="M14.6 9.3c-.55-.95-1.5-1.35-2.5-1.35-1.3 0-2.35.7-2.35 1.85 0 2.5 4.9 1.35 4.9 3.9 0 1.25-1.15 1.95-2.55 1.95-1.1 0-2.1-.5-2.65-1.45M12 6.3v11.4"/></g><text x="296" y="334" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="760" fill="#10143a">Protocol treasury</text><text x="269" y="350.5" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.3" font-weight="500" fill="#676c94"><tspan x="269" dy="0">Receives the fee as a pull claim on</tspan><tspan x="269" dy="13.9">successful settlement</tspan></text>
  <rect x="484" y="312" width="210" height="82" rx="12" fill="#ffffff" stroke="#dcdded" stroke-width="1.2"/><rect x="484" y="312" width="4.5" height="82" rx="2.25" fill="#676c94"/><g transform="translate(498 319) scale(0.792)" stroke="#676c94" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#676c94"><path d="M2.9 12C5.1 7.8 8.4 5.6 12 5.6s6.9 2.2 9.1 6.4c-2.2 4.2-5.5 6.4-9.1 6.4S5.1 16.2 2.9 12Z"/><circle cx="12" cy="12" r="2.6"/></g><text x="525" y="334" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="760" fill="#10143a">Read layer</text><text x="498" y="350.5" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.3" font-weight="500" fill="#676c94"><tspan x="498" dy="0">Lens, SDK, subgraph, frontend;</tspan><tspan x="498" dy="13.9">helpful but never authoritative</tspan></text>
  <line x1="26" y1="409.5" x2="46" y2="409.5" stroke="#c3c5dd" stroke-width="2" stroke-linecap="round"/><text x="52" y="413" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="550" fill="#676c94">holds a contract permission</text><line x1="205.47910480000002" y1="409.5" x2="225.47910480000002" y2="409.5" stroke="#c3c5dd" stroke-width="2" stroke-linecap="round" stroke-dasharray="4.5 3.5"/><text x="231.47910480000002" y="413" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="550" fill="#676c94">external service or read-only</text>
