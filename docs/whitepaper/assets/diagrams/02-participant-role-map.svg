<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 500">
  <title id="title">Participant role map</title>
  <desc id="desc">The sponsor, ticket holders, requester, recovery recipient, treasury, factory owner, Pyth, and read layers have separate powers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e2a9b"/></marker>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e2a9b"/><stop offset="0.55" stop-color="#d31d8b"/><stop offset="1" stop-color="#ffd84d"/></linearGradient>
  </defs>
  <rect width="720" height="500" rx="22" fill="#fbfaff"/>
  <text x="24" y="36" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#10143a"><tspan x="24" dy="0">Participant role map</tspan></text><g><rect x="24" y="70" width="327" height="116" rx="16" fill="#fce9f5" stroke="#d31d8b" stroke-width="2"/><rect x="24" y="70" width="8" height="116" rx="4" fill="#d31d8b"/><text x="187.5" y="100" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="187.5" dy="0">Sponsor</tspan></text><text x="187.5" y="125" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="187.5" dy="0">Deposits prize; sets price,</tspan><tspan x="187.5" dy="16">threshold, dates, recovery recipient</tspan></text></g><g><rect x="369" y="70" width="327" height="116" rx="16" fill="#e9eefc" stroke="#5aa9ff" stroke-width="2"/><rect x="369" y="70" width="8" height="116" rx="4" fill="#5aa9ff"/><text x="532.5" y="100" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="532.5" dy="0">Ticket holder</tspan></text><text x="532.5" y="125" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="532.5" dy="0">Owns transferable bearer claim; may</tspan><tspan x="532.5" dy="16">redeem winner or refund</tspan></text></g><g><rect x="24" y="204" width="327" height="116" rx="16" fill="#ffffff" stroke="#7b3fe4" stroke-width="2"/><rect x="24" y="204" width="8" height="116" rx="4" fill="#7b3fe4"/><text x="187.5" y="234" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="187.5" dy="0">Draw requester</tspan></text><text x="187.5" y="259" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="187.5" dy="0">Anyone; pays current Entropy fee</tspan></text></g><g><rect x="369" y="204" width="327" height="116" rx="16" fill="#fff8e7" stroke="#ffd84d" stroke-width="2"/><rect x="369" y="204" width="8" height="116" rx="4" fill="#ffd84d"/><text x="532.5" y="234" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="532.5" dy="0">Recovery recipient</tspan></text><text x="532.5" y="259" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="532.5" dy="0">Claims NFT after cash, refund, or</tspan><tspan x="532.5" dy="16">empty result</tspan></text></g><g><rect x="24" y="338" width="327" height="116" rx="16" fill="#ffffff" stroke="#1e2a9b" stroke-width="2"/><rect x="24" y="338" width="8" height="116" rx="4" fill="#1e2a9b"/><text x="187.5" y="368" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="187.5" dy="0">Factory owner</tspan></text><text x="187.5" y="393" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="187.5" dy="0">Future pause and treasury only</tspan></text></g><g><rect x="369" y="338" width="327" height="116" rx="16" fill="#ffffff" stroke="#22b573" stroke-width="2"/><rect x="369" y="338" width="8" height="116" rx="4" fill="#22b573"/><text x="532.5" y="368" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="532.5" dy="0">Pyth and read layers</tspan></text><text x="532.5" y="393" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="532.5" dy="0">Pyth calls back; Lens, SDK,</tspan><tspan x="532.5" dy="16">subgraph, frontend help users</tspan></text></g>
  <text x="24" y="484" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#676c94">Solid arrows: calls or asset movement. Dashed arrows: reads, conditions, or external dependencies.</text>
</svg>
