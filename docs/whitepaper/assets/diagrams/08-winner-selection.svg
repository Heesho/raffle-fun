<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f08-title f08-desc" viewBox="0 0 720 312" font-family="Inter,'Helvetica Neue',Arial,sans-serif">
  <title id="f08-title">Winner selection</title>
  <desc id="f08-desc">The authenticated 256-bit random value is reduced modulo the sold ticket count and shifted by one, selecting a winning ID in the complete range.</desc>
  <defs><marker id="f08m676c94" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#676c94"/></marker></defs>
  <rect x="0.75" y="0.75" width="718.5" height="310.5" rx="17" fill="#fcfcff" stroke="#dcdded" stroke-width="1.5"/>
  <rect x="26" y="56" width="172" height="64" rx="12" fill="#f1eafc" stroke="#7b3fe4" stroke-width="1.6"/>
  <text x="112" y="84" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="760" fill="#10143a">randomNumber</text>
  <text x="112" y="102" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.3" font-weight="550" fill="#676c94">authenticated uint256</text>
  <rect x="240" y="56" width="160" height="64" rx="12" fill="#ffffff" stroke="#1e2a9b" stroke-width="1.6"/>
  <text x="320" y="84" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="760" fill="#10143a">mod totalTickets</text>
  <text x="320" y="102" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.3" font-weight="550" fill="#676c94">uniform 0 .. N-1</text>
  <rect x="442" y="56" width="64" height="64" rx="12" fill="#ffffff" stroke="#1e2a9b" stroke-width="1.6"/>
  <text x="474" y="94" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="760" fill="#10143a">+ 1</text>
  <rect x="548" y="56" width="146" height="64" rx="12" fill="#e3f7ee" stroke="#22b573" stroke-width="1.6"/>
  <text x="621" y="84" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="760" fill="#10143a">winning ID</text>
  <text x="621" y="102" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.3" font-weight="550" fill="#676c94">1 .. N inclusive</text>
  <line x1="200" y1="88" x2="236" y2="88" stroke="#676c94" stroke-width="2.2" stroke-linecap="round" marker-end="url(#f08m676c94)"/>
  <line x1="402" y1="88" x2="438" y2="88" stroke="#676c94" stroke-width="2.2" stroke-linecap="round" marker-end="url(#f08m676c94)"/>
  <line x1="508" y1="88" x2="544" y2="88" stroke="#676c94" stroke-width="2.2" stroke-linecap="round" marker-end="url(#f08m676c94)"/>
  <text x="44" y="164" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="650" fill="#676c94">every sold ticket 1 .. totalTickets · nothing excluded, nothing weighted</text>
  <rect x="44" y="178" width="52" height="50" rx="9" fill="#ffffff" stroke="#dcdded" stroke-width="1.2"/>
  <text x="70" y="208" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="650" fill="#454b78">1</text>
