<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 300">
  <title id="title">Winner selection</title>
  <desc id="desc">The 256-bit random value is mapped into the complete sold ticket range.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e2a9b"/></marker>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e2a9b"/><stop offset="0.55" stop-color="#d31d8b"/><stop offset="1" stop-color="#ffd84d"/></linearGradient>
  </defs>
  <rect width="720" height="300" rx="22" fill="#fbfaff"/>
  <text x="24" y="38" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#10143a"><tspan x="24" dy="0">Winner selection</tspan></text><g><rect x="22" y="82" width="155.5" height="132" rx="16" fill="#ffffff" stroke="#7b3fe4" stroke-width="2"/><rect x="22" y="82" width="8" height="132" rx="4" fill="#7b3fe4"/><text x="99.75" y="112" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="99.75" dy="0">randomNumber</tspan></text><text x="99.75" y="137" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="99.75" dy="0">Authenticated</tspan><tspan x="99.75" dy="16">bytes32 value</tspan></text></g><line x1="177.5" y1="148" x2="193.5" y2="148" stroke="#1e2a9b" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="195.5" y="82" width="155.5" height="132" rx="16" fill="#ffffff" stroke="#d31d8b" stroke-width="2"/><rect x="195.5" y="82" width="8" height="132" rx="4" fill="#d31d8b"/><text x="273.25" y="112" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="273.25" dy="0">Modulo</tspan></text><text x="273.25" y="137" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="273.25" dy="0">randomNumber %</tspan><tspan x="273.25" dy="16">totalTickets</tspan></text></g><line x1="351" y1="148" x2="367" y2="148" stroke="#1e2a9b" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="369" y="82" width="155.5" height="132" rx="16" fill="#ffffff" stroke="#ffd84d" stroke-width="2"/><rect x="369" y="82" width="8" height="132" rx="4" fill="#ffd84d"/><text x="446.75" y="112" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="446.75" dy="0">+ 1</tspan></text><text x="446.75" y="137" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="446.75" dy="0">Shift zero-based</tspan><tspan x="446.75" dy="16">result</tspan></text></g><line x1="524.5" y1="148" x2="540.5" y2="148" stroke="#1e2a9b" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="542.5" y="82" width="155.5" height="132" rx="16" fill="#ffffff" stroke="#22b573" stroke-width="2"/><rect x="542.5" y="82" width="8" height="132" rx="4" fill="#22b573"/><text x="620.25" y="112" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="620.25" dy="0">Ticket ID</tspan></text><text x="620.25" y="137" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="620.25" dy="0">1 through</tspan><tspan x="620.25" dy="16">totalTickets</tspan><tspan x="620.25" dy="16">inclusive</tspan></text></g><text x="360" y="256" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#676c94"><tspan x="360" dy="0">One ticket always selects #1. The final sold ticket is reachable. Modulo bias is</tspan><tspan x="360" dy="17">mathematically nonzero for most ticket counts.</tspan></text>
  <text x="24" y="284" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#676c94">Solid arrows: calls or asset movement. Dashed arrows: reads, conditions, or external dependencies.</text>
</svg>
