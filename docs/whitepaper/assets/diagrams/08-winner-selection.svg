  <rect x="566" y="178" width="52" height="50" rx="9" fill="#ffffff" stroke="#dcdded" stroke-width="1.2"/>
  <text x="592" y="208" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="650" fill="#454b78">119</text>
  <rect x="624" y="178" width="52" height="50" rx="9" fill="#ffffff" stroke="#dcdded" stroke-width="1.2"/>
  <text x="650" y="208" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="650" fill="#454b78">120</text>
  <text x="26" y="280" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.8" font-weight="550" fill="#676c94">One sold ticket always selects #1; the final ticket is reachable. Residual modulo bias is astronomically small</text>
  <text x="26" y="294" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.8" font-weight="550" fill="#676c94">for realistic ticket counts against a 256-bit value, but it is not exactly zero.</text>
