  <text x="40" y="204" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.2" font-weight="600" fill="#454b78"><tspan x="40" dy="0">ticket price 10.00 USDC</tspan><tspan x="40" dy="17">threshold 100 tickets</tspan><tspan x="40" dy="17">recovery wallet fixed</tspan><tspan x="40" dy="17">sale runs seven days</tspan></text>
  <text x="40" y="282" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.2" font-weight="550" fill="#676c94">one deposit, four possible futures</text>
