<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f21-title f21-desc" viewBox="0 0 720 478" font-family="Inter,'Helvetica Neue',Arial,sans-serif">
  <title id="f21-title">Pixel Passport #42: all branches</title>
  <desc id="f21-desc">One raffle configuration and its four possible futures, with the exact amounts the contracts would record in each terminal outcome.</desc>
