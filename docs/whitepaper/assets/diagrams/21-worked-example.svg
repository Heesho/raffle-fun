  <g transform="translate(42 356) scale(0.542)" stroke="#0d6b45" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#0d6b45"><path d="m5.4 12.6 4.3 4.3 8.9-9.6"/></g>
  <text x="62" y="366" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="600" fill="#454b78">the NFT has exactly one claimant</text>
  <g transform="translate(42 378) scale(0.542)" stroke="#0d6b45" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#0d6b45"><path d="m5.4 12.6 4.3 4.3 8.9-9.6"/></g>
  <text x="62" y="388" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="600" fill="#454b78">no fee unless randomness settled</text>
  <g transform="translate(42 400) scale(0.542)" stroke="#0d6b45" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#0d6b45"><path d="m5.4 12.6 4.3 4.3 8.9-9.6"/></g>
  <text x="62" y="410" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="600" fill="#454b78">every ticket carries one right</text>
  <text x="26" y="458" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.8" font-weight="550" fill="#676c94">Illustrative names and assets; every amount is computed from compiled constants in six-decimal raw units.</text>
