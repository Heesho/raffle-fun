  <text x="254" y="59" text-anchor="start" font-family="Nunito,Inter,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="800" fill="#ffffff">RaffleFactory</text>
  <text x="226" y="80" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.4" font-weight="550" fill="#c9d1ff">immutable: USDC · Entropy · callback gas limit</text>
  <text x="226" y="94" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.4" font-weight="550" fill="#c9d1ff">registry · owner sets future policy only</text>
  <rect x="40" y="168" width="176" height="104" rx="13" fill="#ffffff" stroke="#d31d8b" stroke-width="1.3"/>
  <g transform="translate(52 178) scale(0.708)" stroke="#d31d8b" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#d31d8b"><path d="M12 3.2 19.8 7.6v8.8L12 20.8 4.2 16.4V7.6Z"/><path d="M4.2 7.6 12 12l7.8-4.4M12 12v8.8"/></g>
  <text x="74" y="192" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="780" fill="#10143a">Raffle #1</text>
  <text x="53" y="214" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="550" fill="#676c94"><tspan x="53" dy="0">independent instance;</tspan><tspan x="53" dy="15">one compromised raffle</tspan><tspan x="53" dy="15">cannot touch another</tspan></text>
  <line x1="270" y1="110" x2="128" y2="164" stroke="#1e2a9b" stroke-width="1.9" stroke-linecap="round" marker-end="url(#f16m1e2a9b)"/>
