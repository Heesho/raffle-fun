  <g transform="translate(274 178) scale(0.708)" stroke="#d31d8b" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#d31d8b"><path d="M12 3.2 19.8 7.6v8.8L12 20.8 4.2 16.4V7.6Z"/><path d="M4.2 7.6 12 12l7.8-4.4M12 12v8.8"/></g>
  <text x="296" y="192" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="780" fill="#10143a">Raffle #2</text>
  <text x="275" y="214" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="550" fill="#454b78"><tspan x="275" dy="0">own storage and prize escrow</tspan><tspan x="275" dy="15">own deadlines and liabilities</tspan><tspan x="275" dy="15">no owner · no upgrade path</tspan></text>
  <line x1="360" y1="110" x2="360" y2="164" stroke="#1e2a9b" stroke-width="1.9" stroke-linecap="round" marker-end="url(#f16m1e2a9b)"/>
