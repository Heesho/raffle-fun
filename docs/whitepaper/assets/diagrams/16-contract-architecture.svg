  <text x="42" y="368" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.3" font-weight="550" fill="#676c94"><tspan x="42" dy="0">dynamic fee · sequence numbers</tspan><tspan x="42" dy="13.5">authenticated callbacks</tspan></text>
  <rect x="260" y="322" width="200" height="74" rx="12" fill="#ffffff" stroke="#1f6fd0" stroke-width="1.5"/>
  <g transform="translate(274 334) scale(0.750)" stroke="#1f6fd0" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#1f6fd0"><path d="M2.9 12C5.1 7.8 8.4 5.6 12 5.6s6.9 2.2 9.1 6.4c-2.2 4.2-5.5 6.4-9.1 6.4S5.1 16.2 2.9 12Z"/><circle cx="12" cy="12" r="2.6"/></g>
  <text x="300" y="348" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="780" fill="#10143a">RaffleLens</text>
  <text x="274" y="368" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.3" font-weight="550" fill="#676c94"><tspan x="274" dy="0">read-only · batches up to 64</tspan><tspan x="274" dy="13.5">authenticates registered raffles</tspan></text>
  <rect x="492" y="322" width="200" height="74" rx="12" fill="#ffffff" stroke="#eab308" stroke-width="1.5" stroke-dasharray="6 4"/>
  <g transform="translate(506 334) scale(0.750)" stroke="#eab308" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#eab308"><circle cx="12" cy="12" r="8.2"/><path d="M14.6 9.3c-.55-.95-1.5-1.35-2.5-1.35-1.3 0-2.35.7-2.35 1.85 0 2.5 4.9 1.35 4.9 3.9 0 1.25-1.15 1.95-2.55 1.95-1.1 0-2.1-.5-2.65-1.45M12 6.3v11.4"/></g>
  <text x="532" y="348" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="780" fill="#10143a">USDC + prize NFTs</text>
  <text x="506" y="368" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.3" font-weight="550" fill="#676c94"><tspan x="506" dy="0">external token contracts;</tspan><tspan x="506" dy="13.5">issuer behavior stays a dependency</tspan></text>
