  <text x="538" y="192" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="780" fill="#10143a">Raffle #3</text>
  <text x="517" y="214" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="550" fill="#676c94"><tspan x="517" dy="0">independent instance;</tspan><tspan x="517" dy="15">one compromised raffle</tspan><tspan x="517" dy="15">cannot touch another</tspan></text>
  <line x1="450" y1="110" x2="592" y2="164" stroke="#1e2a9b" stroke-width="1.9" stroke-linecap="round" marker-end="url(#f16m1e2a9b)"/>
  <rect x="230" y="128" width="260" height="17" rx="8" fill="#fcfcff" opacity="0.94"/>
  <text x="360" y="140" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="700" fill="#1e2a9b">constructor CREATE · no proxies, no clones</text>
