<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 500">
  <title id="title">Contract architecture</title>
  <desc id="desc">One factory constructor-deploys independent raffles; one read-only lens aggregates authenticated state.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e2a9b"/></marker>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e2a9b"/><stop offset="0.55" stop-color="#d31d8b"/><stop offset="1" stop-color="#ffd84d"/></linearGradient>
  </defs>
  <rect width="720" height="500" rx="22" fill="#fbfaff"/>
  <text x="24" y="36" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#10143a"><tspan x="24" dy="0">Contract architecture</tspan></text><g><rect x="24" y="70" width="327" height="116" rx="16" fill="#e9eefc" stroke="#1e2a9b" stroke-width="2"/><rect x="24" y="70" width="8" height="116" rx="4" fill="#1e2a9b"/><text x="187.5" y="100" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="187.5" dy="0">RaffleFactory</tspan></text><text x="187.5" y="125" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="187.5" dy="0">Immutable USDC, Entropy, callback</tspan><tspan x="187.5" dy="16">gas; registry; future policy</tspan></text></g><g><rect x="369" y="70" width="327" height="116" rx="16" fill="#fce9f5" stroke="#d31d8b" stroke-width="2"/><rect x="369" y="70" width="8" height="116" rx="4" fill="#d31d8b"/><text x="532.5" y="100" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="532.5" dy="0">Independent Raffle</tspan></text><text x="532.5" y="125" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="532.5" dy="0">Own storage, prize, tickets,</tspan><tspan x="532.5" dy="16">deadlines, liabilities; no owner</tspan></text></g><g><rect x="24" y="204" width="327" height="116" rx="16" fill="#ffffff" stroke="#5aa9ff" stroke-width="2"/><rect x="24" y="204" width="8" height="116" rx="4" fill="#5aa9ff"/><text x="187.5" y="234" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="187.5" dy="0">RaffleLens</tspan></text><text x="187.5" y="259" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="187.5" dy="0">Read-only, factory-authenticated,</tspan><tspan x="187.5" dy="16">batch limit 64</tspan></text></g><g><rect x="369" y="204" width="327" height="116" rx="16" fill="#ffffff" stroke="#7b3fe4" stroke-width="2"/><rect x="369" y="204" width="8" height="116" rx="4" fill="#7b3fe4"/><text x="532.5" y="234" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="532.5" dy="0">Pyth Entropy v2</tspan></text><text x="532.5" y="259" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="532.5" dy="0">Dynamic fee, sequence, authenticated</tspan><tspan x="532.5" dy="16">callback</tspan></text></g><g><rect x="24" y="338" width="327" height="116" rx="16" fill="#fff8e7" stroke="#ffd84d" stroke-width="2"/><rect x="24" y="338" width="8" height="116" rx="4" fill="#ffd84d"/><text x="187.5" y="368" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="187.5" dy="0">USDC and prize</tspan></text><text x="187.5" y="393" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="187.5" dy="0">External token contracts remain</tspan><tspan x="187.5" dy="16">dependencies</tspan></text></g><g><rect x="369" y="338" width="327" height="116" rx="16" fill="#ffffff" stroke="#22b573" stroke-width="2"/><rect x="369" y="338" width="8" height="116" rx="4" fill="#22b573"/><text x="532.5" y="368" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="532.5" dy="0">SDK, subgraph, web</tspan></text><text x="532.5" y="393" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="532.5" dy="0">Convenience and indexing; never</tspan><tspan x="532.5" dy="16">settlement authority</tspan></text></g>
  <text x="24" y="484" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#676c94">Solid arrows: calls or asset movement. Dashed arrows: reads, conditions, or external dependencies.</text>
</svg>
