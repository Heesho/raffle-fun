<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f16-title f16-desc" viewBox="0 0 720 500" font-family="Inter,'Helvetica Neue',Arial,sans-serif">
  <title id="f16-title">Contract architecture</title>
  <desc id="f16-desc">One factory constructor-deploys independent raffles; the Lens reads, Pyth and token contracts remain external, and offchain layers have no settlement authority.</desc>
  <defs><marker id="f16m1e2a9b" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#1e2a9b"/></marker><marker id="f16m7b3fe4" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#7b3fe4"/></marker><marker id="f16m1f6fd0" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#1f6fd0"/></marker><marker id="f16meab308" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#eab308"/></marker></defs>
  <rect x="0.75" y="0.75" width="718.5" height="498.5" rx="17" fill="#fcfcff" stroke="#dcdded" stroke-width="1.5"/>
