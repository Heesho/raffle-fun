<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f06-title f06-desc" viewBox="0 0 720 300" font-family="Inter,'Helvetica Neue',Arial,sans-serif">
  <title id="f06-title">Bearer ticket ownership through time</title>
  <desc id="f06-desc">Ticket 12 passes from Maya to Leo to Noor across the sale, drawing, and terminal phases; whoever holds the unburned ticket at redemption collects.</desc>
  <defs><marker id="f06m676c94" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#676c94"/></marker><marker id="f06m7b3fe4" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#7b3fe4"/></marker><marker id="f06m22b573" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#22b573"/></marker></defs>
  <rect x="0.75" y="0.75" width="718.5" height="298.5" rx="17" fill="#fcfcff" stroke="#dcdded" stroke-width="1.5"/>
  <rect x="26" y="76" width="304" height="170" rx="14" fill="#e8f2ff"/>
  <text x="40" y="98" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="750" letter-spacing="1.4" fill="#1f6fd0">ACTIVE</text>
  <rect x="338" y="76" width="162" height="170" rx="14" fill="#f1eafc"/>
  <text x="352" y="98" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="750" letter-spacing="1.4" fill="#7b3fe4">DRAWING</text>
  <rect x="508" y="76" width="186" height="170" rx="14" fill="#e3f7ee"/>
  <text x="522" y="98" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="750" letter-spacing="1.4" fill="#0d6b45">TERMINAL</text>
  <line x1="104" y1="60" x2="601" y2="60" stroke="#9aa0c0" stroke-width="1.4" stroke-dasharray="4 4"/>
  <g><rect x="270.6" y="26" width="178.9" height="22" rx="11" fill="#fcfcff" stroke="#c3c5dd" stroke-width="1.3"/><text x="360" y="40.456" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="700" fill="#454b78">one ticket #12, one bearer right</text></g>
  <circle cx="104" cy="60" r="4" fill="#fcfcff" stroke="#9aa0c0" stroke-width="1.4"/>
  <line x1="104" y1="64" x2="104" y2="149" stroke="#9aa0c0" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="250" cy="60" r="4" fill="#fcfcff" stroke="#9aa0c0" stroke-width="1.4"/>
  <line x1="250" y1="64" x2="250" y2="149" stroke="#9aa0c0" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="419" cy="60" r="4" fill="#fcfcff" stroke="#9aa0c0" stroke-width="1.4"/>
  <line x1="419" y1="64" x2="419" y2="149" stroke="#9aa0c0" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="601" cy="60" r="4" fill="#fcfcff" stroke="#9aa0c0" stroke-width="1.4"/>
  <line x1="601" y1="64" x2="601" y2="149" stroke="#9aa0c0" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="104" cy="172" r="20" fill="#ffffff" stroke="#1f6fd0" stroke-width="1.9"/>
  <g transform="translate(94 162) scale(0.833)" stroke="#1f6fd0" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#1f6fd0"><circle cx="12" cy="8.1" r="3.4"/><path d="M5.4 19.6a6.8 5.9 0 0 1 13.2 0"/></g>
  <text x="104" y="208" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="780" fill="#10143a">Maya</text>
  <text x="104" y="222" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="550" fill="#676c94">buys ticket #12</text>
  <line x1="128" y1="172" x2="224" y2="172" stroke="#676c94" stroke-width="2" stroke-linecap="round" marker-end="url(#f06m676c94)"/><text x="176" y="164" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.3" font-weight="700" fill="#676c94">transfer</text>
  <circle cx="250" cy="172" r="20" fill="#ffffff" stroke="#1e2a9b" stroke-width="1.9"/>
  <g transform="translate(240 162) scale(0.833)" stroke="#1e2a9b" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#1e2a9b"><circle cx="12" cy="8.1" r="3.4"/><path d="M5.4 19.6a6.8 5.9 0 0 1 13.2 0"/></g>
  <text x="250" y="208" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="780" fill="#10143a">Leo</text>
  <text x="250" y="222" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="550" fill="#676c94">receives it before the draw</text>
  <line x1="274" y1="172" x2="393" y2="172" stroke="#7b3fe4" stroke-width="2" stroke-linecap="round" marker-end="url(#f06m7b3fe4)"/><text x="333.5" y="164" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.3" font-weight="700" fill="#7b3fe4">ownership frozen at request</text>
  <circle cx="419" cy="172" r="20" fill="#ffffff" stroke="#7b3fe4" stroke-width="1.9"/>
  <g transform="translate(409 162) scale(0.833)" stroke="#7b3fe4" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#7b3fe4"><circle cx="12" cy="8.1" r="3.4"/><path d="M5.4 19.6a6.8 5.9 0 0 1 13.2 0"/></g>
  <text x="419" y="208" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="780" fill="#10143a">Leo</text>
  <text x="419" y="222" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="550" fill="#676c94">same owner, transfers locked</text>
  <line x1="443" y1="172" x2="575" y2="172" stroke="#22b573" stroke-width="2.3" stroke-linecap="round" marker-end="url(#f06m22b573)"/><text x="509" y="164" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.3" font-weight="700" fill="#0d6b45">burns to redeem</text>
  <circle cx="601" cy="172" r="22" fill="#ffffff" stroke="#22b573" stroke-width="2.1"/>
  <g transform="translate(591 161) scale(0.875)" stroke="#22b573" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#22b573"><path d="M12 3.4c.9 4.6 4.6 6 4.6 9.8a4.6 4.6 0 0 1-9.2 0c0-4 4-5.4 4.6-9.8Z"/><path d="M12 12.9c-1.1.75-1.7 1.6-1.7 2.55a1.7 1.7 0 0 0 3.4 0c0-.95-.6-1.8-1.7-2.55Z"/></g>
  <text x="601" y="208" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="780" fill="#0d6b45">current owner</text>
  <text x="601" y="222" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="550" fill="#676c94">collects, ticket ceases to exist</text>
  <text x="26" y="266" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.3" font-weight="550" fill="#676c94">Transfers stay open during the sale, then lock completely in Drawing; the selected winning ticket stays locked. Whoever holds the</text>
  <text x="26" y="280" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.3" font-weight="550" fill="#676c94">unburned ticket when the draw is requested collects; approvals allow transfers, never redemptions.</text>
</svg>
