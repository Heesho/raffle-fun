<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f06-title f06-desc" viewBox="0 0 720 350" font-family="Inter,'Helvetica Neue',Arial,sans-serif">
  <title id="f06-title">Bearer ticket ownership through time</title>
  <desc id="f06-desc">Ticket 12 moves from Maya to Leo to Noor across sale, drawing, and terminal phases; the current owner at burn time collects the award or refund.</desc>
  <defs><marker id="f06m676c94" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#676c94"/></marker><marker id="f06m22b573" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#22b573"/></marker></defs>
  <rect x="0.75" y="0.75" width="718.5" height="348.5" rx="17" fill="#fcfcff" stroke="#dcdded" stroke-width="1.5"/>
  <rect x="26" y="40" width="274" height="216" rx="14" fill="#e8f2ff"/>
  <text x="40" y="62" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="750" letter-spacing="1.4" fill="#1f6fd0">ACTIVE</text>
  <rect x="308" y="40" width="178" height="216" rx="14" fill="#f1eafc"/>
  <text x="322" y="62" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="750" letter-spacing="1.4" fill="#7b3fe4">DRAWING</text>
  <rect x="494" y="40" width="200" height="216" rx="14" fill="#e3f7ee"/>
  <text x="508" y="62" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="750" letter-spacing="1.4" fill="#0d6b45">TERMINAL STATUS</text>
  <circle cx="96" cy="130" r="21" fill="#ffffff" stroke="#1f6fd0" stroke-width="1.8"/>
  <g transform="translate(86 120) scale(0.833)" stroke="#1f6fd0" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#1f6fd0"><circle cx="12" cy="8.1" r="3.4"/><path d="M5.4 19.6a6.8 5.9 0 0 1 13.2 0"/></g>
  <text x="96" y="166" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="750" fill="#10143a">Maya</text>
  <text x="96" y="180" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="550" fill="#676c94">buys ticket #12</text>
  <circle cx="240" cy="190" r="21" fill="#ffffff" stroke="#1e2a9b" stroke-width="1.8"/>
  <g transform="translate(230 180) scale(0.833)" stroke="#1e2a9b" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#1e2a9b"><circle cx="12" cy="8.1" r="3.4"/><path d="M5.4 19.6a6.8 5.9 0 0 1 13.2 0"/></g>
  <text x="240" y="226" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="750" fill="#10143a">Leo</text>
  <text x="240" y="240" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="550" fill="#676c94">receives it</text>
  <circle cx="400" cy="130" r="21" fill="#ffffff" stroke="#7b3fe4" stroke-width="1.8"/>
  <g transform="translate(390 120) scale(0.833)" stroke="#7b3fe4" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#7b3fe4"><circle cx="12" cy="8.1" r="3.4"/><path d="M5.4 19.6a6.8 5.9 0 0 1 13.2 0"/></g>
  <text x="400" y="166" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="750" fill="#10143a">Noor</text>
  <text x="400" y="180" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="550" fill="#676c94">receives it mid-draw</text>
  <circle cx="590" cy="150" r="23" fill="#ffffff" stroke="#22b573" stroke-width="2"/>
  <g transform="translate(580 139) scale(0.875)" stroke="#22b573" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#22b573"><path d="M12 3.4c.9 4.6 4.6 6 4.6 9.8a4.6 4.6 0 0 1-9.2 0c0-4 4-5.4 4.6-9.8Z"/><path d="M12 12.9c-1.1.75-1.7 1.6-1.7 2.55a1.7 1.7 0 0 0 3.4 0c0-.95-.6-1.8-1.7-2.55Z"/></g>
