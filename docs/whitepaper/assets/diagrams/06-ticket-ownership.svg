  <text x="590" y="202" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="550" fill="#676c94">collects award or refund</text>
  <line x1="121" y1="140" x2="214" y2="182" stroke="#676c94" stroke-width="2" stroke-linecap="round" marker-end="url(#f06m676c94)"/><text x="163.5" y="153" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.3" font-weight="700" fill="#676c94">transfer</text>
  <line x1="265" y1="182" x2="374" y2="140" stroke="#676c94" stroke-width="2" stroke-linecap="round" marker-end="url(#f06m676c94)"/><text x="319.5" y="183" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.3" font-weight="700" fill="#676c94">transfer</text>
  <line x1="426" y1="136" x2="563" y2="148" stroke="#22b573" stroke-width="2.2" stroke-linecap="round" marker-end="url(#f06m22b573)"/><text x="494.5" y="134" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.3" font-weight="700" fill="#22b573">burn to redeem</text>
  <g><rect x="62.0" y="74" width="140.3" height="22" rx="11" fill="#ffffff" stroke="#1f6fd0" stroke-width="1.3"/><text x="132.13462" y="88.42" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="700" fill="#1f6fd0">ticket #12 · bearer right</text></g>
  <text x="26" y="296" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.3" font-weight="550" fill="#676c94">Tickets never freeze: transfers stay open in every status until the moment a ticket burns. Whoever owns the</text>
  <text x="26" y="310" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.3" font-weight="550" fill="#676c94">unburned ticket at redemption time collects; approvals allow transfers, never redemptions.</text>
</svg>
