<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f05-title f05-desc" viewBox="0 0 720 292" font-family="Inter,'Helvetica Neue',Arial,sans-serif">
  <title id="f05-title">Sale and deadline timeline</title>
  <desc id="f05-desc">The inclusive sale start and exclusive sale end are followed by a strict request window and an exact callback timeout measured from the accepted request.</desc>
  <defs><marker id="f05m9aa0c0" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#9aa0c0"/></marker></defs>
  <rect x="0.75" y="0.75" width="718.5" height="290.5" rx="17" fill="#fcfcff" stroke="#dcdded" stroke-width="1.5"/>
  <rect x="58" y="78" width="122" height="60" rx="10" fill="#eeeef8"/>
  <text x="119" y="100" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="750" fill="#676c94">pre-sale wait</text>
  <text x="119" y="118" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.3" font-weight="550" fill="#676c94">up to 7 days</text>
  <rect x="180" y="78" width="248" height="60" rx="10" fill="#e8f2ff"/>
  <text x="304" y="100" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="750" fill="#1f6fd0">ticket sale</text>
  <text x="304" y="118" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.3" font-weight="550" fill="#676c94">at most 30 days</text>
  <rect x="428" y="78" width="160" height="60" rx="10" fill="#f1eafc"/>
  <text x="508" y="100" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="750" fill="#7b3fe4">request window</text>
  <text x="508" y="118" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.3" font-weight="550" fill="#676c94">3 days · deadline excluded</text>
  <line x1="38" y1="152" x2="688" y2="152" stroke="#9aa0c0" stroke-width="1.6" stroke-linecap="round" marker-end="url(#f05m9aa0c0)"/>
  <text x="686" y="168" text-anchor="end" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="600" fill="#9aa0c0">time</text>
  <line x1="58" y1="66" x2="58" y2="152" stroke="#676c94" stroke-width="1.6"/>
  <circle cx="58" cy="152" r="3.4" fill="#676c94"/>
  <text x="58" y="58" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="750" fill="#676c94">creation</text>
  <line x1="180" y1="66" x2="180" y2="152" stroke="#1f6fd0" stroke-width="1.6"/>
  <circle cx="180" cy="152" r="3.4" fill="#1f6fd0"/>
  <text x="180" y="58" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="750" fill="#1f6fd0">startTime</text>
  <text x="180" y="170" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="8.8" font-weight="550" fill="#676c94">inclusive: buying opens exactly here</text>
  <line x1="428" y1="66" x2="428" y2="152" stroke="#7b3fe4" stroke-width="1.6"/>
  <circle cx="428" cy="152" r="3.4" fill="#7b3fe4"/>
  <text x="428" y="58" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="750" fill="#7b3fe4">endTime</text>
  <text x="428" y="170" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="8.8" font-weight="550" fill="#676c94">exclusive: no purchase here</text>
  <line x1="588" y1="66" x2="588" y2="152" stroke="#c8213f" stroke-width="1.6" stroke-dasharray="4 3"/>
  <circle cx="588" cy="152" r="3.4" fill="#c8213f"/>
  <text x="588" y="58" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="750" fill="#c8213f">endTime + 3d</text>
  <text x="588" y="170" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="8.8" font-weight="550" fill="#676c94">request-grace deadline</text>
  <line x1="470" y1="174" x2="470" y2="196" stroke="#7b3fe4" stroke-width="1.4" stroke-dasharray="3.5 3"/>
  <circle cx="470" cy="152" r="3.4" fill="#7b3fe4"/>
  <rect x="470" y="196" width="150" height="26" rx="9" fill="#fff5d6" stroke="#eab308" stroke-width="1.2"/>
  <text x="545" y="213" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="700" fill="#7a4f00">callback wait · 2 days</text>
  <text x="462" y="213" text-anchor="end" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.3" font-weight="650" fill="#7b3fe4">requestDraw accepted</text>
  <line x1="620" y1="190" x2="620" y2="228" stroke="#c8213f" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="694" y="240" text-anchor="end" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.3" font-weight="700" fill="#c8213f">at timeout, refunds become enabled</text>
  <text x="26" y="260" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.8" font-weight="550" fill="#676c94">At either red deadline, enableRefunds becomes valid for anyone. At the exact callback boundary, the callback and the</text>
  <text x="26" y="274" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.8" font-weight="550" fill="#676c94">timeout transaction may race; the first one included in a block wins.</text>
</svg>
