  <text x="120" y="58" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="550" fill="#676c94">anyone</text>
  <line x1="360" y1="68" x2="360" y2="412" stroke="#c3c5dd" stroke-width="1.4" stroke-dasharray="3.5 3.5"/>
  <rect x="282" y="24" width="156" height="44" rx="11" fill="#ffffff" stroke="#1e2a9b" stroke-width="1.6"/>
  <text x="360" y="43" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="780" fill="#10143a">Raffle</text>
  <text x="360" y="58" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="550" fill="#676c94">contract</text>
  <line x1="600" y1="68" x2="600" y2="412" stroke="#c3c5dd" stroke-width="1.4" stroke-dasharray="3.5 3.5"/>
  <rect x="522" y="24" width="156" height="44" rx="11" fill="#ffffff" stroke="#7b3fe4" stroke-width="1.6"/>
  <text x="600" y="43" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="780" fill="#10143a">Pyth Entropy v2</text>
  <text x="600" y="58" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="550" fill="#676c94">external</text>
  <rect x="115" y="96" width="10" height="24" rx="4" fill="#1f6fd0" opacity="0.16" stroke="#1f6fd0" stroke-width="1.1"/>
  <rect x="355" y="96" width="10" height="172" rx="4" fill="#1e2a9b" opacity="0.16" stroke="#1e2a9b" stroke-width="1.1"/>
  <rect x="595" y="176" width="10" height="56" rx="4" fill="#7b3fe4" opacity="0.16" stroke="#7b3fe4" stroke-width="1.1"/>
  <rect x="595" y="330" width="10" height="26" rx="4" fill="#7b3fe4" opacity="0.16" stroke="#7b3fe4" stroke-width="1.1"/>
  <rect x="355" y="330" width="10" height="76" rx="4" fill="#1e2a9b" opacity="0.16" stroke="#1e2a9b" stroke-width="1.1"/>
  <line x1="126" y1="104" x2="352" y2="104" stroke="#1f6fd0" stroke-width="2" stroke-linecap="round" marker-end="url(#f07m1f6fd0)"/>
  <text x="240" y="96" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#1f6fd0">requestDraw() + native Pyth fee</text>
  <rect x="374" y="118" width="210" height="51.8" rx="8" fill="#f4f4fb" stroke="#dcdded" stroke-width="1"/>
  <text x="383" y="132.5" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.3" font-weight="550" fill="#454b78"><tspan x="383" dy="0">checks: Active · tickets sold · sale ended</tspan><tspan x="383" dy="12.6">· inside request grace · sets in-flight</tspan><tspan x="383" dy="12.6">guard</tspan></text>
  <line x1="366" y1="184" x2="592" y2="184" stroke="#1e2a9b" stroke-width="2" stroke-linecap="round" marker-end="url(#f07m1e2a9b)"/>
