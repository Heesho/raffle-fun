<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f07-title f07-desc" viewBox="0 0 720 470" font-family="Inter,'Helvetica Neue',Arial,sans-serif">
  <title id="f07-title">Randomness request and callback sequence</title>
  <desc id="f07-desc">A requester pays Pyth through the raffle, the raffle stores one sequence number, and a later authenticated callback settles the raffle in a separate transaction.</desc>
  <defs><marker id="f07m1f6fd0" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#1f6fd0"/></marker><marker id="f07m1e2a9b" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#1e2a9b"/></marker><marker id="f07m7b3fe4" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#7b3fe4"/></marker></defs>
  <rect x="0.75" y="0.75" width="718.5" height="468.5" rx="17" fill="#fcfcff" stroke="#dcdded" stroke-width="1.5"/>
