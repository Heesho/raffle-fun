  <line x1="594" y1="222" x2="368" y2="222" stroke="#7b3fe4" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#f07m7b3fe4)"/>
  <text x="480" y="214" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#7b3fe4">sequenceNumber</text>
  <rect x="374" y="236" width="196" height="39.2" rx="8" fill="#f4f4fb" stroke="#dcdded" stroke-width="1"/>
  <text x="383" y="250.5" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.3" font-weight="550" fill="#454b78"><tspan x="383" dy="0">stores the sequence · status =</tspan><tspan x="383" dy="12.6">Drawing · clears guard</tspan></text>
  <line x1="30" y1="296" x2="690" y2="296" stroke="#9aa0c0" stroke-width="1.2" stroke-dasharray="7 5"/>
  <g><rect x="277.9" y="285" width="164.2" height="22" rx="11" fill="#fcfcff" stroke="#9aa0c0" stroke-width="1.3"/><text x="360" y="299.42" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="700" fill="#676c94">later · a separate transaction</text></g>
  <line x1="594" y1="338" x2="368" y2="338" stroke="#7b3fe4" stroke-width="2" stroke-linecap="round" marker-end="url(#f07m7b3fe4)"/>
  <text x="480" y="330" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#7b3fe4">entropyCallback(sequence, randomNumber)</text>
  <rect x="374" y="352" width="254" height="51.8" rx="8" fill="#f4f4fb" stroke="#dcdded" stroke-width="1"/>
  <text x="383" y="366.5" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.3" font-weight="550" fill="#454b78"><tspan x="383" dy="0">authenticates wrapper + stored sequence,</tspan><tspan x="383" dy="12.6">selects the winner, records fee and liabilities,</tspan><tspan x="383" dy="12.6">sets terminal status</tspan></text>
  <text x="26" y="436" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="550" fill="#676c94">Wrong-sequence, duplicate, stale, in-flight, or post-refund callbacks emit CallbackIgnored and change nothing.</text>
  <line x1="26" y1="445.5" x2="46" y2="445.5" stroke="#454b78" stroke-width="2" stroke-linecap="round"/><text x="52" y="449" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="550" fill="#676c94">call</text><line x1="88.104112" y1="445.5" x2="108.104112" y2="445.5" stroke="#7b3fe4" stroke-width="2" stroke-linecap="round" stroke-dasharray="4.5 3.5"/><text x="114.104112" y="449" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="550" fill="#676c94">return value</text><rect x="191.94826" y="440" width="11" height="11" rx="3" fill="#eeeef8"/><text x="208.94826" y="449" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="550" fill="#676c94">contract-internal step</text>
</svg>
