<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 300">
  <title id="title">NFT-awarded money flow</title>
  <desc id="desc">With 120 tickets at 10.00 USDC, the NFT winner receives the prize and quote proceeds split between sponsor and treasury.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e2a9b"/></marker>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e2a9b"/><stop offset="0.55" stop-color="#d31d8b"/><stop offset="1" stop-color="#ffd84d"/></linearGradient>
  </defs>
  <rect width="720" height="300" rx="22" fill="#fbfaff"/>
  <text x="24" y="38" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#10143a"><tspan x="24" dy="0">NFT-awarded money flow</tspan></text><g><rect x="22" y="82" width="155.5" height="132" rx="16" fill="#ffffff" stroke="#5aa9ff" stroke-width="2"/><rect x="22" y="82" width="8" height="132" rx="4" fill="#5aa9ff"/><text x="99.75" y="112" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="99.75" dy="0">Gross sales</tspan></text><text x="99.75" y="137" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="99.75" dy="0">1,200.00 USDC</tspan></text></g><line x1="177.5" y1="148" x2="193.5" y2="148" stroke="#1e2a9b" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="195.5" y="82" width="155.5" height="132" rx="16" fill="#ffffff" stroke="#d31d8b" stroke-width="2"/><rect x="195.5" y="82" width="8" height="132" rx="4" fill="#d31d8b"/><text x="273.25" y="112" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="273.25" dy="0">Treasury</tspan></text><text x="273.25" y="137" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="273.25" dy="0">60.00 USDC fee</tspan></text></g><line x1="351" y1="148" x2="367" y2="148" stroke="#1e2a9b" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="369" y="82" width="155.5" height="132" rx="16" fill="#ffffff" stroke="#ffd84d" stroke-width="2"/><rect x="369" y="82" width="8" height="132" rx="4" fill="#ffd84d"/><text x="446.75" y="112" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="446.75" dy="0">Sponsor</tspan></text><text x="446.75" y="137" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="446.75" dy="0">1,140.00 USDC</tspan></text></g><line x1="524.5" y1="148" x2="540.5" y2="148" stroke="#1e2a9b" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="542.5" y="82" width="155.5" height="132" rx="16" fill="#ffffff" stroke="#22b573" stroke-width="2"/><rect x="542.5" y="82" width="8" height="132" rx="4" fill="#22b573"/><text x="620.25" y="112" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="620.25" dy="0">Winning bearer</tspan></text><text x="620.25" y="137" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="620.25" dy="0">Burns ticket for</tspan><tspan x="620.25" dy="16">Pixel Passport #42</tspan></text></g><text x="360" y="256" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#676c94"><tspan x="360" dy="0">All values are generated from compiled fee constants using six-decimal raw units.</tspan></text>
  <text x="24" y="284" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#676c94">Solid arrows: calls or asset movement. Dashed arrows: reads, conditions, or external dependencies.</text>
</svg>
