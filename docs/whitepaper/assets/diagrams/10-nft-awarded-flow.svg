<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f10-title f10-desc" viewBox="0 0 720 356" font-family="Inter,'Helvetica Neue',Arial,sans-serif">
  <title id="f10-title">NFT-awarded money flow</title>
  <desc id="f10-desc">With 120 tickets sold at 10.00 USDC, the treasury records the fee, the sponsor records post-fee proceeds, and the winning bearer burns the ticket for the NFT.</desc>
  <defs></defs>
  <rect x="0.75" y="0.75" width="718.5" height="354.5" rx="17" fill="#fcfcff" stroke="#dcdded" stroke-width="1.5"/>
  <rect x="96" y="62" width="30" height="150" rx="7" fill="#5aa9ff" opacity="0.9"/>
  <text x="26" y="46" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9" font-weight="750" letter-spacing="1.4" fill="#676c94">SOURCES</text>
  <text x="86" y="80" text-anchor="end" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.2" font-weight="650" fill="#454b78"><tspan x="86" dy="0">Gross sales</tspan><tspan x="86" dy="15">1,200.00</tspan><tspan x="86" dy="15">120 tickets</tspan><tspan x="86" dy="15">x 10.00</tspan></text>
  <rect x="96" y="246" width="30" height="34" rx="7" fill="#d31d8b" opacity="0.9"/>
  <text x="86" y="258" text-anchor="end" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.2" font-weight="650" fill="#454b78"><tspan x="86" dy="0">Escrowed</tspan><tspan x="86" dy="13">prize NFT</tspan></text>
  <rect x="452" y="46" width="242" height="62" rx="12" fill="#ffffff" stroke="#dcdded" stroke-width="1.2"/>
  <rect x="452" y="46" width="4.5" height="62" rx="2.25" fill="#1e2a9b"/>
  <g transform="translate(466 58) scale(0.750)" stroke="#1e2a9b" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#1e2a9b"><path d="M4.2 19.8V9.4l4.4 2.9V9.4l4.4 2.9V5.2h6.8v14.6Z"/><path d="M16.4 9h2m-2 3.4h2m-2 3.4h2"/></g>
  <text x="492" y="72" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="760" fill="#10143a">Protocol treasury</text>
  <text x="682" y="73" text-anchor="end" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="800" fill="#10143a">60.00</text>
  <text x="466" y="91" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.3" font-weight="550" fill="#676c94"><tspan x="466" dy="0">5% fee · recorded as a pull claim</tspan></text>
  <rect x="452" y="128" width="242" height="62" rx="12" fill="#ffffff" stroke="#dcdded" stroke-width="1.2"/>
  <rect x="452" y="128" width="4.5" height="62" rx="2.25" fill="#eab308"/>
  <g transform="translate(466 140) scale(0.750)" stroke="#eab308" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#eab308"><rect x="3.6" y="6.4" width="16.8" height="12" rx="2.6"/><path d="M15.6 12.4h4.8"/><circle cx="16.3" cy="12.4" r="0.9" fill="currentColor" stroke="none"/></g>
  <text x="492" y="154" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="760" fill="#10143a">Sponsor</text>
  <text x="682" y="155" text-anchor="end" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="800" fill="#10143a">1,140.00</text>
  <text x="466" y="173" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.3" font-weight="550" fill="#676c94"><tspan x="466" dy="0">post-fee proceeds · pull claim</tspan></text>
  <rect x="452" y="232" width="242" height="62" rx="12" fill="#ffffff" stroke="#dcdded" stroke-width="1.2"/>
  <rect x="452" y="232" width="4.5" height="62" rx="2.25" fill="#22b573"/>
  <g transform="translate(466 244) scale(0.750)" stroke="#22b573" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#22b573"><path d="M8.2 4.2h7.6v4.4a3.8 3.8 0 0 1-7.6 0z"/><path d="M8.2 5.2H5.9a2.55 2.55 0 0 0 2.5 3.3M15.8 5.2h2.3a2.55 2.55 0 0 1-2.5 3.3M12 12.4v3.4M9.2 19.4h5.6M12 15.8c-1.7 0-2.6 1.1-2.8 3.6M12 15.8c1.7 0 2.6 1.1 2.8 3.6"/></g>
  <text x="492" y="258" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="760" fill="#10143a">Winning bearer</text>
  <text x="682" y="259" text-anchor="end" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="800" fill="#10143a">the NFT</text>
  <text x="466" y="277" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.3" font-weight="550" fill="#676c94"><tspan x="466" dy="0">burns the winning ticket to collect</tspan></text>
  <path d="M 126 62 C 289 62 289 62 452 62 L 452 76 C 289 76 289 74 126 74 Z" fill="#1e2a9b" opacity="0.3"/>
  <path d="M 126 74 C 289 74 289 138 452 138 L 452 182 C 289 182 289 212 126 212 Z" fill="#f2c94c" opacity="0.42"/>
  <path d="M 126 246 C 289 246 289 246 452 246 L 452 280 C 289 280 289 280 126 280 Z" fill="#d31d8b" opacity="0.32"/>
  <text x="280" y="100" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.8" font-weight="700" fill="#1e2a9b">fee 60.00</text>
  <text x="280" y="176" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.8" font-weight="700" fill="#7a4f00">sponsor 1,140.00</text>
  <text x="280" y="258" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.8" font-weight="700" fill="#d31d8b">prize to the winner</text>
  <text x="26" y="330" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="550" fill="#676c94">Band heights are proportional to USDC amounts. Every USDC payout is a pull claim; nothing is pushed automatically.</text>
</svg>
