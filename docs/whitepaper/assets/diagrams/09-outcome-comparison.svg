<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 430">
  <title id="title">Outcome comparison</title>
  <desc id="desc">The protocol distinguishes successful randomness, failed randomness, and zero-sales closure.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e2a9b"/></marker>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e2a9b"/><stop offset="0.55" stop-color="#d31d8b"/><stop offset="1" stop-color="#ffd84d"/></linearGradient>
  </defs>
  <rect width="720" height="430" rx="22" fill="#fbfaff"/>
  <text x="24" y="36" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#10143a"><tspan x="24" dy="0">Outcome comparison</tspan></text><g><rect x="24" y="70" width="327" height="148" rx="16" fill="#ffffff" stroke="#22b573" stroke-width="2"/><rect x="24" y="70" width="8" height="148" rx="4" fill="#22b573"/><text x="187.5" y="100" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="187.5" dy="0">NftWon</tspan></text><text x="187.5" y="125" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="187.5" dy="0">Threshold met; 5% fee; winner burns</tspan><tspan x="187.5" dy="16">for NFT; sponsor gets post-fee USDC</tspan></text></g><g><rect x="369" y="70" width="327" height="148" rx="16" fill="#ffffff" stroke="#d31d8b" stroke-width="2"/><rect x="369" y="70" width="8" height="148" rx="4" fill="#d31d8b"/><text x="532.5" y="100" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="532.5" dy="0">CashWon</tspan></text><text x="532.5" y="125" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="532.5" dy="0">Threshold missed; 5% fee; winner</tspan><tspan x="532.5" dy="16">burns for 80% of post-fee pot;</tspan><tspan x="532.5" dy="16">recovery recipient gets NFT</tspan></text></g><g><rect x="24" y="236" width="327" height="148" rx="16" fill="#ffffff" stroke="#1e2a9b" stroke-width="2"/><rect x="24" y="236" width="8" height="148" rx="4" fill="#1e2a9b"/><text x="187.5" y="266" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="187.5" dy="0">Refunding</tspan></text><text x="187.5" y="291" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="187.5" dy="0">No fee; no winner; each current</tspan><tspan x="187.5" dy="16">holder burns tickets for exact</tspan><tspan x="187.5" dy="16">price; recovery recipient gets NFT</tspan></text></g><g><rect x="369" y="236" width="327" height="148" rx="16" fill="#ffffff" stroke="#676c94" stroke-width="2"/><rect x="369" y="236" width="8" height="148" rx="4" fill="#676c94"/><text x="532.5" y="266" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="532.5" dy="0">Closed</tspan></text><text x="532.5" y="291" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="532.5" dy="0">Zero sales; no request and no quote</tspan><tspan x="532.5" dy="16">liability; recovery recipient gets</tspan><tspan x="532.5" dy="16">NFT</tspan></text></g>
  <text x="24" y="414" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#676c94">Solid arrows: calls or asset movement. Dashed arrows: reads, conditions, or external dependencies.</text>
</svg>
