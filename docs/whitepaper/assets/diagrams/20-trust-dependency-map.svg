  <rect x="484" y="200" width="210" height="86" rx="12" fill="#ffffff" stroke="#dcdded" stroke-width="1.2"/><rect x="484" y="200" width="4.5" height="86" rx="2.25" fill="#d31d8b"/><g transform="translate(498 207) scale(0.792)" stroke="#d31d8b" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#d31d8b"><path d="M12 3.4 18.8 9 12 20.6 5.2 9 Z"/><path d="M5.2 9h13.6M12 3.4 9.6 9l2.4 11.6M12 3.4 14.4 9"/></g><text x="525" y="222" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="760" fill="#10143a">Prize contract</text><text x="498" y="238.5" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.3" font-weight="500" fill="#676c94"><tspan x="498" dy="0">honest ownerOf, safe transfers,</tspan><tspan x="498" dy="13.9">metadata provenance</tspan></text>
  <rect x="26" y="360" width="210" height="86" rx="12" fill="#ffffff" stroke="#dcdded" stroke-width="1.2"/><rect x="26" y="360" width="4.5" height="86" rx="2.25" fill="#eab308"/><g transform="translate(40 367) scale(0.792)" stroke="#eab308" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#eab308"><circle cx="8" cy="12" r="3.2"/><path d="M11.2 12h8m-3.4 0v3.1m3.4-3.1v2.3"/></g><text x="67" y="382" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="760" fill="#10143a">User stack</text><text x="40" y="398.5" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.3" font-weight="500" fill="#676c94"><tspan x="40" dy="0">wallet keys, RPC honesty, frontend</tspan><tspan x="40" dy="13.9">authenticity, tx review</tspan></text>
  <rect x="484" y="360" width="210" height="86" rx="12" fill="#ffffff" stroke="#dcdded" stroke-width="1.2"/><rect x="484" y="360" width="4.5" height="86" rx="2.25" fill="#22b573"/><g transform="translate(498 367) scale(0.792)" stroke="#22b573" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#22b573"><path d="M12 4.2v15M8.4 19.2h7.2M12 6.4 6.2 8.1m5.8-1.7 5.8 1.7"/><path d="M3.6 12.8h5.2L6.2 8.4Zm11.6 0h5.2l-2.6-4.4Z"/></g><text x="525" y="382" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="760" fill="#10143a">Operations and law</text><text x="498" y="398.5" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.3" font-weight="500" fill="#676c94"><tspan x="498" dy="0">owner Safe custody, monitoring,</tspan><tspan x="498" dy="13.9">jurisdictional compliance</tspan></text>
  <text x="26" y="462" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="550" fill="#676c94">Each arrow is an independent failure surface: contract correctness alone cannot compensate for a failed dependency.</text>
