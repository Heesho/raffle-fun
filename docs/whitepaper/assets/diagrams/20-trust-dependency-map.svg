  <text x="360" y="248" text-anchor="middle" font-family="Nunito,Inter,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff">raffle.fun settlement</text>
  <text x="360" y="266" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.3" font-weight="550" fill="#c9d1ff">correct only if its dependencies hold</text>
  <rect x="26" y="40" width="210" height="86" rx="12" fill="#ffffff" stroke="#dcdded" stroke-width="1.2"/><rect x="26" y="40" width="4.5" height="86" rx="2.25" fill="#1e2a9b"/><g transform="translate(40 47) scale(0.792)" stroke="#1e2a9b" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#1e2a9b"><path d="M12 3.2 19.8 7.6v8.8L12 20.8 4.2 16.4V7.6Z"/><path d="M4.2 7.6 12 12l7.8-4.4M12 12v8.8"/></g><text x="67" y="62" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="760" fill="#10143a">Base network</text><text x="40" y="78.5" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.3" font-weight="500" fill="#676c94"><tspan x="40" dy="0">execution, ordering, inclusion,</tspan><tspan x="40" dy="13.9">reorg and sequencer behavior</tspan></text>
  <rect x="484" y="40" width="210" height="86" rx="12" fill="#ffffff" stroke="#dcdded" stroke-width="1.2"/><rect x="484" y="40" width="4.5" height="86" rx="2.25" fill="#7b3fe4"/><g transform="translate(498 47) scale(0.792)" stroke="#7b3fe4" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#7b3fe4"><path d="M13.4 3.4 5.8 13.6h4.8l-1.4 7 7.6-10.2H12Z"/></g><text x="525" y="62" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="760" fill="#10143a">Pyth Entropy</text><text x="498" y="78.5" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.3" font-weight="500" fill="#676c94"><tspan x="498" dy="0">randomness correctness, provider</tspan><tspan x="498" dy="13.9">and keeper liveness, fee policy</tspan></text>
