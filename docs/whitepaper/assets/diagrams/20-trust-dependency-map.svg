<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f20-title f20-desc" viewBox="0 0 720 486" font-family="Inter,'Helvetica Neue',Arial,sans-serif">
  <title id="f20-title">Trust and dependency map</title>
  <desc id="f20-desc">Raffle settlement depends on Base, Pyth Entropy, the USDC issuer, the prize contract, user key hygiene, and legal-operational controls; each is an independent failure surface.</desc>
