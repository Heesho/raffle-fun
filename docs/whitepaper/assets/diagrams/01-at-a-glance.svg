  <title id="f01-title">raffle.fun at a glance</title>
  <desc id="f01-desc">A sponsor escrows one NFT, buyers receive bearer tickets, one Pyth Entropy request resolves the raffle, and claimants redeem assets. Liveness failure leads to exact bearer refunds.</desc>
