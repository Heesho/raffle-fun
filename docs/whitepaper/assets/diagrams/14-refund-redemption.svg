<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 320">
  <title id="title">Refund redemption sequence</title>
  <desc id="desc">Refunds are bounded bearer burns, not batch credits to a frozen ownership snapshot.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e2a9b"/></marker>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e2a9b"/><stop offset="0.55" stop-color="#d31d8b"/><stop offset="1" stop-color="#ffd84d"/></linearGradient>
  </defs>
  <rect width="720" height="320" rx="22" fill="#fbfaff"/>
  <text x="24" y="38" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#10143a"><tspan x="24" dy="0">Refund redemption sequence</tspan></text><g><rect x="22" y="82" width="120.8" height="132" rx="16" fill="#ffffff" stroke="#5aa9ff" stroke-width="2"/><rect x="22" y="82" width="8" height="132" rx="4" fill="#5aa9ff"/><text x="82.4" y="112" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="82.4" dy="0">Current owner</tspan></text><text x="82.4" y="137" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="82.4" dy="0">Chooses 1 to 100</tspan><tspan x="82.4" dy="16">owned IDs</tspan></text></g><line x1="142.8" y1="148" x2="158.8" y2="148" stroke="#1e2a9b" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="160.8" y="82" width="120.8" height="132" rx="16" fill="#ffffff" stroke="#1e2a9b" stroke-width="2"/><rect x="160.8" y="82" width="8" height="132" rx="4" fill="#1e2a9b"/><text x="221.20000000000002" y="112" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="221.20000000000002" dy="0">Validate</tspan></text><text x="221.20000000000002" y="137" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="221.20000000000002" dy="0">Refunding, owner,</tspan><tspan x="221.20000000000002" dy="16">unique existing</tspan><tspan x="221.20000000000002" dy="16">tickets</tspan></text></g><line x1="281.6" y1="148" x2="297.6" y2="148" stroke="#1e2a9b" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="299.6" y="82" width="120.8" height="132" rx="16" fill="#ffffff" stroke="#d31d8b" stroke-width="2"/><rect x="299.6" y="82" width="8" height="132" rx="4" fill="#d31d8b"/><text x="360" y="112" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="360" dy="0">Burn tickets</tspan></text><text x="360" y="137" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="360" dy="0">Bearer rights are</tspan><tspan x="360" dy="16">consumed</tspan></text></g><line x1="420.40000000000003" y1="148" x2="436.40000000000003" y2="148" stroke="#1e2a9b" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="438.40000000000003" y="82" width="120.8" height="132" rx="16" fill="#ffffff" stroke="#ffd84d" stroke-width="2"/><rect x="438.40000000000003" y="82" width="8" height="132" rx="4" fill="#ffd84d"/><text x="498.8" y="112" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="498.8" dy="0">Reduce liability</tspan></text><text x="498.8" y="137" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="498.8" dy="0">ticketPrice x</tspan><tspan x="498.8" dy="16">quantity</tspan></text></g><line x1="559.2" y1="148" x2="575.2" y2="148" stroke="#1e2a9b" stroke-width="2.5"  marker-end="url(#arrow)"/><g><rect x="577.2" y="82" width="120.8" height="132" rx="16" fill="#ffffff" stroke="#22b573" stroke-width="2"/><rect x="577.2" y="82" width="8" height="132" rx="4" fill="#22b573"/><text x="637.6" y="112" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="637.6" dy="0">Exact transfer</tspan></text><text x="637.6" y="137" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="637.6" dy="0">USDC to chosen</tspan><tspan x="637.6" dy="16">destination</tspan></text></g><text x="360" y="256" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#676c94"><tspan x="360" dy="0">Any bad ID or failed outgoing token transfer reverts the entire batch, restoring burns and</tspan><tspan x="360" dy="17">liability.</tspan></text>
  <text x="24" y="304" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#676c94">Solid arrows: calls or asset movement. Dashed arrows: reads, conditions, or external dependencies.</text>
</svg>
