<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f14-title f14-desc" viewBox="0 0 720 344" font-family="Inter,'Helvetica Neue',Arial,sans-serif">
  <title id="f14-title">Refund redemption sequence</title>
  <desc id="f14-desc">A current owner chooses up to 100 tickets, the contract validates and burns them, reduces the refund liability, and transfers exact USDC; any failure reverts the whole batch.</desc>
  <defs><marker id="f14m676c94" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#676c94"/></marker><marker id="f14mc8213f" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#c8213f"/></marker></defs>
  <rect x="0.75" y="0.75" width="718.5" height="342.5" rx="17" fill="#fcfcff" stroke="#dcdded" stroke-width="1.5"/>
  <rect x="26" y="44" width="124" height="126" rx="12" fill="#ffffff" stroke="#1f6fd0" stroke-width="1.6"/><g transform="translate(77 75.3) scale(0.917)" stroke="#1f6fd0" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#1f6fd0"><path d="M3.5 7.5h17v3.1a1.9 1.9 0 0 0 0 2.8v3.1h-17v-3.1a1.9 1.9 0 0 0 0-2.8z"/><line x1="14.6" y1="8.8" x2="14.6" y2="15.2" stroke-dasharray="1.8 2"/></g><text x="88" y="114.976" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.8" font-weight="750" fill="#10143a"><tspan x="88" dy="0">Choose tickets</tspan></text><text x="88" y="128.61599999999999" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="500" fill="#676c94"><tspan x="88" dy="0">1 to 100 owned IDs</tspan></text><circle cx="27" cy="45" r="11" fill="#1f6fd0"/><text x="27" y="49" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffffff">1</text>
  <line x1="152" y1="107" x2="159" y2="107" stroke="#676c94" stroke-width="2.2" stroke-linecap="round" marker-end="url(#f14m676c94)"/>
  <rect x="162" y="44" width="124" height="126" rx="12" fill="#ffffff" stroke="#1e2a9b" stroke-width="1.6"/><g transform="translate(213 62.2) scale(0.917)" stroke="#1e2a9b" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#1e2a9b"><path d="M12 3.2 18.8 6v5.1c0 4.3-2.8 7.2-6.8 8.7-4-1.5-6.8-4.4-6.8-8.7V6Z"/><path d="m9.1 11.7 2.1 2.1 3.9-4"/></g><text x="224" y="101.876" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.8" font-weight="750" fill="#10143a"><tspan x="224" dy="0">Validate</tspan></text><text x="224" y="115.516" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="500" fill="#676c94"><tspan x="224" dy="0">Refunding status;</tspan><tspan x="224" dy="13.1">caller owns every</tspan><tspan x="224" dy="13.1">unique ID</tspan></text><circle cx="163" cy="45" r="11" fill="#1e2a9b"/><text x="163" y="49" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffffff">2</text>
  <line x1="288" y1="107" x2="295" y2="107" stroke="#676c94" stroke-width="2.2" stroke-linecap="round" marker-end="url(#f14m676c94)"/>
  <rect x="298" y="44" width="124" height="126" rx="12" fill="#ffffff" stroke="#d31d8b" stroke-width="1.6"/><g transform="translate(349 68.75) scale(0.917)" stroke="#d31d8b" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#d31d8b"><path d="M12 3.4c.9 4.6 4.6 6 4.6 9.8a4.6 4.6 0 0 1-9.2 0c0-4 4-5.4 4.6-9.8Z"/><path d="M12 12.9c-1.1.75-1.7 1.6-1.7 2.55a1.7 1.7 0 0 0 3.4 0c0-.95-.6-1.8-1.7-2.55Z"/></g><text x="360" y="108.426" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.8" font-weight="750" fill="#10143a"><tspan x="360" dy="0">Burn</tspan></text><text x="360" y="122.066" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="500" fill="#676c94"><tspan x="360" dy="0">bearer rights are</tspan><tspan x="360" dy="13.1">consumed</tspan></text><circle cx="299" cy="45" r="11" fill="#d31d8b"/><text x="299" y="49" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffffff">3</text>
  <line x1="424" y1="107" x2="431" y2="107" stroke="#676c94" stroke-width="2.2" stroke-linecap="round" marker-end="url(#f14m676c94)"/>
  <rect x="434" y="44" width="124" height="126" rx="12" fill="#ffffff" stroke="#eab308" stroke-width="1.6"/><g transform="translate(485 68.75) scale(0.917)" stroke="#eab308" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#eab308"><path d="M7 3.4h7.2l3.8 3.8v13.4H7Z"/><path d="M14.2 3.4v3.8H18M9.7 12h4.6M9.7 15.2h4.6"/></g><text x="496" y="108.426" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.8" font-weight="750" fill="#10143a"><tspan x="496" dy="0">Reduce liability</tspan></text><text x="496" y="122.066" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="500" fill="#676c94"><tspan x="496" dy="0">price x quantity</tspan><tspan x="496" dy="13.1">comes off the books</tspan></text><circle cx="435" cy="45" r="11" fill="#eab308"/><text x="435" y="49" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffffff">4</text>
  <line x1="560" y1="107" x2="567" y2="107" stroke="#676c94" stroke-width="2.2" stroke-linecap="round" marker-end="url(#f14m676c94)"/>
  <rect x="570" y="44" width="124" height="126" rx="12" fill="#ffffff" stroke="#22b573" stroke-width="1.6"/><g transform="translate(621 68.75) scale(0.917)" stroke="#22b573" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#22b573"><circle cx="12" cy="12" r="8.2"/><path d="M14.6 9.3c-.55-.95-1.5-1.35-2.5-1.35-1.3 0-2.35.7-2.35 1.85 0 2.5 4.9 1.35 4.9 3.9 0 1.25-1.15 1.95-2.55 1.95-1.1 0-2.1-.5-2.65-1.45M12 6.3v11.4"/></g><text x="632" y="108.426" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.8" font-weight="750" fill="#10143a"><tspan x="632" dy="0">Exact transfer</tspan></text><text x="632" y="122.066" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="500" fill="#676c94"><tspan x="632" dy="0">USDC to any chosen</tspan><tspan x="632" dy="13.1">destination</tspan></text><circle cx="571" cy="45" r="11" fill="#22b573"/><text x="571" y="49" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="800" fill="#ffffff">5</text>
  <path d="M 632 172 L 632 231 Q 632 238 625 238 L 107 238 Q 100 238 100 231 L 100 176" fill="none" stroke="#c8213f" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#f14mc8213f)"/>
  <rect x="196" y="214" width="330" height="48" rx="11" fill="#fdeaee" stroke="#c8213f" stroke-width="1.2"/>
  <g transform="translate(210 228) scale(0.750)" stroke="#c8213f" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#c8213f"><path d="M6.6 5.4v4.4H11"/><path d="M6.9 9.6a6.9 6.9 0 1 1-1 4.9"/></g>
  <text x="236" y="235" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.3" font-weight="750" fill="#c8213f">any invalid ID or failed USDC transfer</text>
  <text x="236" y="250" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.8" font-weight="550" fill="#454b78">reverts the whole batch: burns and liability restored</text>
  <text x="26" y="300" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.3" font-weight="550" fill="#676c94">Refunds are bounded bearer burns, not a batch payout to a frozen snapshot: each owner redeems on their own</text>
  <text x="26" y="314" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.3" font-weight="550" fill="#676c94">schedule, and an unredeemed ticket simply remains a live claim.</text>
</svg>
