<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 420">
  <title id="title">Onchain versus offchain</title>
  <desc id="desc">Settlement state is onchain while access, presentation, indexing, metadata, and legal interpretation remain external.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e2a9b"/></marker>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e2a9b"/><stop offset="0.55" stop-color="#d31d8b"/><stop offset="1" stop-color="#ffd84d"/></linearGradient>
  </defs>
  <rect width="720" height="420" rx="22" fill="#fbfaff"/>
  <text x="24" y="36" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#10143a"><tspan x="24" dy="0">Onchain versus offchain</tspan></text><g><rect x="24" y="70" width="327" height="143" rx="16" fill="#e9eefc" stroke="#1e2a9b" stroke-width="2"/><rect x="24" y="70" width="8" height="143" rx="4" fill="#1e2a9b"/><text x="187.5" y="100" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="187.5" dy="0">Onchain authority</tspan></text><text x="187.5" y="125" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="187.5" dy="0">Configuration, escrow owner, ticket</tspan><tspan x="187.5" dy="16">owner, deadlines, status, winner,</tspan><tspan x="187.5" dy="16">liabilities, claims</tspan></text></g><g><rect x="369" y="70" width="327" height="143" rx="16" fill="#ffffff" stroke="#5aa9ff" stroke-width="2"/><rect x="369" y="70" width="8" height="143" rx="4" fill="#5aa9ff"/><text x="532.5" y="100" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="532.5" dy="0">Offchain access</tspan></text><text x="532.5" y="125" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="532.5" dy="0">Frontend, RPC, wallet, SDK,</tspan><tspan x="532.5" dy="16">subgraph, notifications</tspan></text></g><g><rect x="24" y="231" width="327" height="143" rx="16" fill="#ffffff" stroke="#7b3fe4" stroke-width="2"/><rect x="24" y="231" width="8" height="143" rx="4" fill="#7b3fe4"/><text x="187.5" y="261" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="187.5" dy="0">External services</tspan></text><text x="187.5" y="286" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="187.5" dy="0">Pyth provider and keeper, Base</tspan><tspan x="187.5" dy="16">sequencer and validators, token</tspan><tspan x="187.5" dy="16">issuers</tspan></text></g><g><rect x="369" y="231" width="327" height="143" rx="16" fill="#fce9f5" stroke="#d31d8b" stroke-width="2"/><rect x="369" y="231" width="8" height="143" rx="4" fill="#d31d8b"/><text x="532.5" y="261" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="532.5" dy="0">External meaning</tspan></text><text x="532.5" y="286" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="532.5" dy="0">Metadata, intellectual property,</tspan><tspan x="532.5" dy="16">tax, gaming, sanctions, age and</tspan><tspan x="532.5" dy="16">consumer law</tspan></text></g>
  <text x="24" y="404" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#676c94">Solid arrows: calls or asset movement. Dashed arrows: reads, conditions, or external dependencies.</text>
</svg>
