<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f17-title f17-desc" viewBox="0 0 720 452" font-family="Inter,'Helvetica Neue',Arial,sans-serif">
  <title id="f17-title">Onchain versus offchain</title>
  <desc id="f17-desc">Settlement state lives in the contracts; access layers, external services, and legal meaning sit below the authority boundary and cannot settle assets.</desc>
  <defs></defs>
  <rect x="0.75" y="0.75" width="718.5" height="450.5" rx="17" fill="#fcfcff" stroke="#dcdded" stroke-width="1.5"/>
  <rect x="26" y="34" width="668" height="76" rx="13" fill="#e8f2ff" stroke="#1e2a9b" stroke-width="1.8"/>
  <text x="44" y="60" text-anchor="start" font-family="Nunito,Inter,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="800" fill="#1e2a9b">Onchain authority</text>
  <text x="44" y="76" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.3" font-weight="550" fill="#676c94">the raffle contracts decide</text>
  <g><rect x="232.0" y="44.5" width="53.8" height="24" rx="12" fill="#ffffff" stroke="#1e2a9b" stroke-width="1.3"/><text x="258.911104" y="59.956" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="650" fill="#454b78">status</text></g>
  <g><rect x="293.8" y="44.5" width="91.0" height="24" rx="12" fill="#ffffff" stroke="#1e2a9b" stroke-width="1.3"/><text x="339.34648319999997" y="59.956" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="650" fill="#454b78">prize escrow</text></g>
  <g><rect x="392.9" y="44.5" width="92.6" height="24" rx="12" fill="#ffffff" stroke="#1e2a9b" stroke-width="1.3"/><text x="439.1662976" y="59.956" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="650" fill="#454b78">ticket owners</text></g>
  <g><rect x="493.5" y="44.5" width="70.8" height="24" rx="12" fill="#ffffff" stroke="#1e2a9b" stroke-width="1.3"/><text x="528.8568448" y="59.956" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="650" fill="#454b78">deadlines</text></g>
  <g><rect x="572.3" y="44.5" width="59.7" height="24" rx="12" fill="#ffffff" stroke="#1e2a9b" stroke-width="1.3"/><text x="602.0937600000001" y="59.956" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="650" fill="#454b78">winner</text></g>
  <g><rect x="232.0" y="75.5" width="71.8" height="24" rx="12" fill="#ffffff" stroke="#1e2a9b" stroke-width="1.3"/><text x="267.909184" y="90.956" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="650" fill="#454b78">liabilities</text></g>
  <g><rect x="311.8" y="75.5" width="57.6" height="24" rx="12" fill="#ffffff" stroke="#1e2a9b" stroke-width="1.3"/><text x="340.63192319999996" y="90.956" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="650" fill="#454b78">claims</text></g>
  <line x1="26" y1="129" x2="694" y2="129" stroke="#c8213f" stroke-width="1.6" stroke-dasharray="8 5"/>
  <rect x="120" y="120" width="480" height="18" rx="9" fill="#fcfcff"/>
  <text x="360" y="133" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.3" font-weight="750" fill="#c8213f">authority boundary · nothing below this line can settle assets or change raffle state</text>
  <rect x="26" y="148" width="668" height="76" rx="13" fill="#ffffff" stroke="#1f6fd0" stroke-width="1.2"/>
  <text x="44" y="174" text-anchor="start" font-family="Nunito,Inter,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="800" fill="#1f6fd0">Access layer</text>
  <text x="44" y="190" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.3" font-weight="550" fill="#676c94">helps users see and act</text>
  <g><rect x="232.0" y="174" width="64.8" height="24" rx="12" fill="#f4f4fb" stroke="#dcdded" stroke-width="1.3"/><text x="264.4127872" y="189.456" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="650" fill="#454b78">web app</text></g>
  <g><rect x="304.8" y="174" width="55.6" height="24" rx="12" fill="#f4f4fb" stroke="#dcdded" stroke-width="1.3"/><text x="332.6107776" y="189.456" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="650" fill="#454b78">wallet</text></g>
  <g><rect x="368.4" y="174" width="45.6" height="24" rx="12" fill="#f4f4fb" stroke="#dcdded" stroke-width="1.3"/><text x="391.1936768" y="189.456" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="650" fill="#454b78">RPC</text></g>
  <g><rect x="422.0" y="174" width="45.6" height="24" rx="12" fill="#f4f4fb" stroke="#dcdded" stroke-width="1.3"/><text x="444.7890688" y="189.456" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="650" fill="#454b78">SDK</text></g>
  <g><rect x="475.6" y="174" width="69.2" height="24" rx="12" fill="#f4f4fb" stroke="#dcdded" stroke-width="1.3"/><text x="510.2105088" y="189.456" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="650" fill="#454b78">subgraph</text></g>
  <g><rect x="552.8" y="174" width="85.2" height="24" rx="12" fill="#f4f4fb" stroke="#dcdded" stroke-width="1.3"/><text x="595.4277248000001" y="189.456" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="650" fill="#454b78">notifications</text></g>
  <rect x="26" y="238" width="668" height="76" rx="13" fill="#ffffff" stroke="#7b3fe4" stroke-width="1.2"/>
  <text x="44" y="264" text-anchor="start" font-family="Nunito,Inter,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="800" fill="#7b3fe4">External services</text>
  <text x="44" y="280" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.3" font-weight="550" fill="#676c94">independent operators</text>
  <g><rect x="232.0" y="248.5" width="138.7" height="24" rx="12" fill="#f4f4fb" stroke="#dcdded" stroke-width="1.3"/><text x="301.330624" y="263.956" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="650" fill="#454b78">Pyth provider + keeper</text></g>
  <g><rect x="378.7" y="248.5" width="102.2" height="24" rx="12" fill="#f4f4fb" stroke="#dcdded" stroke-width="1.3"/><text x="429.738624" y="263.956" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="650" fill="#454b78">Base sequencer</text></g>
  <g><rect x="488.8" y="248.5" width="87.8" height="24" rx="12" fill="#f4f4fb" stroke="#dcdded" stroke-width="1.3"/><text x="532.6949119999999" y="263.956" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="650" fill="#454b78">USDC issuer</text></g>
  <g><rect x="232.0" y="279.5" width="109.9" height="24" rx="12" fill="#f4f4fb" stroke="#dcdded" stroke-width="1.3"/><text x="286.933696" y="294.956" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="650" fill="#454b78">prize NFT issuer</text></g>
  <rect x="26" y="328" width="668" height="76" rx="13" fill="#ffffff" stroke="#d31d8b" stroke-width="1.2"/>
  <text x="44" y="354" text-anchor="start" font-family="Nunito,Inter,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="800" fill="#d31d8b">External meaning</text>
  <text x="44" y="370" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.3" font-weight="550" fill="#676c94">outside any contract</text>
  <g><rect x="232.0" y="354" width="95.7" height="24" rx="12" fill="#f4f4fb" stroke="#dcdded" stroke-width="1.3"/><text x="279.8380672" y="369.456" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="650" fill="#454b78">metadata + IP</text></g>
  <g><rect x="335.7" y="354" width="90.7" height="24" rx="12" fill="#f4f4fb" stroke="#dcdded" stroke-width="1.3"/><text x="381.0461568" y="369.456" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="650" fill="#454b78">gambling law</text></g>
  <g><rect x="434.4" y="354" width="38.9" height="24" rx="12" fill="#f4f4fb" stroke="#dcdded" stroke-width="1.3"/><text x="453.8717312" y="369.456" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="650" fill="#454b78">tax</text></g>
  <g><rect x="481.3" y="354" width="70.8" height="24" rx="12" fill="#f4f4fb" stroke="#dcdded" stroke-width="1.3"/><text x="516.7222912" y="369.456" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="650" fill="#454b78">sanctions</text></g>
  <g><rect x="560.1" y="354" width="70.3" height="24" rx="12" fill="#f4f4fb" stroke="#dcdded" stroke-width="1.3"/><text x="595.2552192" y="369.456" text-anchor="middle" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.6" font-weight="650" fill="#454b78">age rules</text></g>
  <text x="26" y="428" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="550" fill="#676c94">Layers below the boundary can censor their own service, present stale data, or disappear; they cannot move assets.</text>
</svg>
