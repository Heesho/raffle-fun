<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f18-title f18-desc" viewBox="0 0 720 430" font-family="Inter,'Helvetica Neue',Arial,sans-serif">
  <title id="f18-title">Factory owner: can and cannot</title>
  <desc id="f18-desc">Factory ownership only shapes future creation policy; it grants no emergency control over any deployed raffle.</desc>
  <defs></defs>
  <rect x="0.75" y="0.75" width="718.5" height="428.5" rx="17" fill="#fcfcff" stroke="#dcdded" stroke-width="1.5"/>
  <rect x="26" y="36" width="326" height="40" rx="12" fill="#22b573"/>
