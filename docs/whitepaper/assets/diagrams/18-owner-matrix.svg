<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 420">
  <title id="title">Factory owner: can and cannot</title>
  <desc id="desc">Factory ownership changes only future creation policy and cannot administer existing raffles.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e2a9b"/></marker>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e2a9b"/><stop offset="0.55" stop-color="#d31d8b"/><stop offset="1" stop-color="#ffd84d"/></linearGradient>
  </defs>
  <rect width="720" height="420" rx="22" fill="#fbfaff"/>
  <text x="24" y="36" text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#10143a"><tspan x="24" dy="0">Factory owner: can and cannot</tspan></text><g><rect x="24" y="70" width="327" height="143" rx="16" fill="#e3f7ee" stroke="#22b573" stroke-width="2"/><rect x="24" y="70" width="8" height="143" rx="4" fill="#22b573"/><text x="187.5" y="100" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="187.5" dy="0">Can</tspan></text><text x="187.5" y="125" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="187.5" dy="0">Pause or resume future creation; set</tspan><tspan x="187.5" dy="16">treasury for future raffles; begin</tspan><tspan x="187.5" dy="16">two-step ownership transfer</tspan></text></g><g><rect x="369" y="70" width="327" height="143" rx="16" fill="#fdeaee" stroke="#c8213f" stroke-width="2"/><rect x="369" y="70" width="8" height="143" rx="4" fill="#c8213f"/><text x="532.5" y="100" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="532.5" dy="0">Cannot</tspan></text><text x="532.5" y="125" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="532.5" dy="0">Change existing price, threshold,</tspan><tspan x="532.5" dy="16">dates, token, recipient, treasury,</tspan><tspan x="532.5" dy="16">winner, status, claim, or prize</tspan></text></g><g><rect x="24" y="231" width="327" height="143" rx="16" fill="#fdeaee" stroke="#c8213f" stroke-width="2"/><rect x="24" y="231" width="8" height="143" rx="4" fill="#c8213f"/><text x="187.5" y="261" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="187.5" dy="0">Cannot</tspan></text><text x="187.5" y="286" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="187.5" dy="0">Pause, upgrade, rescue, reroll,</tspan><tspan x="187.5" dy="16">settle, or refund an existing raffle</tspan></text></g><g><rect x="369" y="231" width="327" height="143" rx="16" fill="#e9eefc" stroke="#1e2a9b" stroke-width="2"/><rect x="369" y="231" width="8" height="143" rx="4" fill="#1e2a9b"/><text x="532.5" y="261" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="16" font-weight="800" fill="#10143a"><tspan x="532.5" dy="0">Incident response</tspan></text><text x="532.5" y="286" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#676c94"><tspan x="532.5" dy="0">Warn users, hide writes, pause new</tspan><tspan x="532.5" dy="16">creation, and deploy a new factory</tspan><tspan x="532.5" dy="16">after review</tspan></text></g>
  <text x="24" y="404" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#676c94">Solid arrows: calls or asset movement. Dashed arrows: reads, conditions, or external dependencies.</text>
</svg>
