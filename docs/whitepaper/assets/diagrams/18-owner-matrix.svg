  <text x="70" y="62" text-anchor="start" font-family="Nunito,Inter,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff">The factory owner can</text>
  <rect x="26" y="88" width="326" height="40" rx="10" fill="#e3f7ee" stroke="#22b573" stroke-width="1" opacity="0.95"/>
  <g transform="translate(40 99) scale(0.750)" stroke="#22b573" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#22b573"><path d="m5.4 12.6 4.3 4.3 8.9-9.6"/></g>
  <text x="68" y="111.8" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.3" font-weight="600" fill="#454b78"><tspan x="68" dy="0">pause or resume future raffle creation</tspan></text>
  <rect x="26" y="136" width="326" height="40" rx="10" fill="#e3f7ee" stroke="#22b573" stroke-width="1" opacity="0.95"/>
  <g transform="translate(40 147) scale(0.750)" stroke="#22b573" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#22b573"><path d="m5.4 12.6 4.3 4.3 8.9-9.6"/></g>
  <text x="68" y="159.8" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.3" font-weight="600" fill="#454b78"><tspan x="68" dy="0">set the treasury captured by future raffles</tspan></text>
  <rect x="26" y="184" width="326" height="40" rx="10" fill="#e3f7ee" stroke="#22b573" stroke-width="1" opacity="0.95"/>
  <g transform="translate(40 195) scale(0.750)" stroke="#22b573" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#22b573"><path d="m5.4 12.6 4.3 4.3 8.9-9.6"/></g>
  <text x="68" y="207.8" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.3" font-weight="600" fill="#454b78"><tspan x="68" dy="0">transfer ownership with a two-step handshake</tspan></text>
  <rect x="368" y="36" width="326" height="40" rx="12" fill="#c8213f"/>
  <g transform="translate(382 46) scale(0.833)" stroke="#ffffff" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#ffffff"><path d="m6.6 6.6 10.8 10.8M17.4 6.6 6.6 17.4"/></g>
  <text x="412" y="62" text-anchor="start" font-family="Nunito,Inter,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff">The owner cannot</text>
  <rect x="368" y="88" width="326" height="46" rx="10" fill="#fdeaee" stroke="#c8213f" stroke-width="1" opacity="0.95"/>
  <g transform="translate(382 102) scale(0.750)" stroke="#c8213f" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#c8213f"><path d="m6.6 6.6 10.8 10.8M17.4 6.6 6.6 17.4"/></g>
  <text x="410" y="107.8" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.3" font-weight="600" fill="#454b78"><tspan x="410" dy="0">change any existing raffle's price, dates, or</tspan><tspan x="410" dy="14">threshold</tspan></text>
  <rect x="368" y="142" width="326" height="46" rx="10" fill="#fdeaee" stroke="#c8213f" stroke-width="1" opacity="0.95"/>
  <g transform="translate(382 156) scale(0.750)" stroke="#c8213f" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#c8213f"><path d="m6.6 6.6 10.8 10.8M17.4 6.6 6.6 17.4"/></g>
