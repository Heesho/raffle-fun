  <text x="410" y="219.8" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.3" font-weight="600" fill="#454b78"><tspan x="410" dy="0">move the escrowed prize or the USDC pot</tspan></text>
  <rect x="368" y="244" width="326" height="40" rx="10" fill="#fdeaee" stroke="#c8213f" stroke-width="1" opacity="0.95"/>
  <g transform="translate(382 255) scale(0.750)" stroke="#c8213f" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#c8213f"><path d="m6.6 6.6 10.8 10.8M17.4 6.6 6.6 17.4"/></g>
  <text x="410" y="267.8" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.3" font-weight="600" fill="#454b78"><tspan x="410" dy="0">choose, reroll, or veto a winner</tspan></text>
  <rect x="368" y="292" width="326" height="40" rx="10" fill="#fdeaee" stroke="#c8213f" stroke-width="1" opacity="0.95"/>
  <g transform="translate(382 303) scale(0.750)" stroke="#c8213f" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#c8213f"><path d="m6.6 6.6 10.8 10.8M17.4 6.6 6.6 17.4"/></g>
  <text x="410" y="315.8" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.3" font-weight="600" fill="#454b78"><tspan x="410" dy="0">redirect anyone's claim or refund</tspan></text>
  <rect x="26" y="348" width="668" height="48" rx="11" fill="#e8f2ff" stroke="#1e2a9b" stroke-width="1.2"/>
  <g transform="translate(42 362) scale(0.792)" stroke="#1e2a9b" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#1e2a9b"><path d="M6.4 17h11.2c-1.4-1.2-1.9-2.7-1.9-4.6 0-3.2-1.5-5.5-3.7-5.5s-3.7 2.3-3.7 5.5c0 1.9-.5 3.4-1.9 4.6Z"/><path d="M10.4 19.4a1.7 1.7 0 0 0 3.2 0"/></g>
  <text x="70" y="369" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="750" fill="#1e2a9b">Incident response without an admin key:</text>
  <text x="70" y="385" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="550" fill="#454b78">warn users · hide writes in the frontend · pause new creation · deploy a reviewed replacement factory</text>
  <text x="26" y="414" text-anchor="start" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="550" fill="#676c94">Every deployed raffle runs to completion under its original fixed rules.</text>
</svg>
