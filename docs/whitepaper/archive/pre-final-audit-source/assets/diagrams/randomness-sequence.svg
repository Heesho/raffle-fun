<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Inter, sans-serif">
  <defs>
    <marker id="rs-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#454b78"/>
    </marker>
    <marker id="rs-arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7b3fe4"/>
    </marker>
  </defs>

  <!-- lifelines -->
  <g text-anchor="middle">
    <rect x="80" y="30" width="180" height="44" rx="10" fill="#fff7dc" stroke="#eab308" stroke-width="1.5"/>
    <text x="170" y="57" font-size="14" font-weight="700" fill="#7a4f00">Requester (anyone)</text>
    <line x1="170" y1="74" x2="170" y2="520" stroke="#9aa0c0" stroke-width="1.2" stroke-dasharray="4 4"/>

    <rect x="390" y="30" width="180" height="44" rx="10" fill="#e9eefc" stroke="#1e2a9b" stroke-width="1.5"/>
    <text x="480" y="57" font-size="14" font-weight="700" fill="#1e2a9b">Raffle contract</text>
    <line x1="480" y1="74" x2="480" y2="520" stroke="#9aa0c0" stroke-width="1.2" stroke-dasharray="4 4"/>

    <rect x="700" y="30" width="180" height="44" rx="10" fill="#f4f4fb" stroke="#7b3fe4" stroke-width="1.5"/>
    <text x="790" y="57" font-size="14" font-weight="700" fill="#7b3fe4">Pyth Entropy</text>
    <line x1="790" y1="74" x2="790" y2="520" stroke="#9aa0c0" stroke-width="1.2" stroke-dasharray="4 4"/>
  </g>

  <!-- transaction 1 -->
  <rect x="60" y="100" width="530" height="20" rx="4" fill="#fce9f5" opacity="0.55"/>
  <text x="70" y="94" font-size="11.5" font-weight="700" fill="#b81478">TRANSACTION 1: the request</text>

  <line x1="170" y1="132" x2="476" y2="132" stroke="#454b78" stroke-width="2" marker-end="url(#rs-arr)"/>
  <text x="323" y="125" text-anchor="middle" font-size="12.5" font-weight="600" fill="#454b78">requestDraw( ) + oracle fee in ETH</text>

  <g font-size="12" fill="#454b78">
    <rect x="497" y="146" width="330" height="66" rx="8" fill="#f4f4fb"/>
    <text x="510" y="166" font-weight="700" fill="#10143a">Checks, then state change first:</text>
    <text x="510" y="184">sale closed &#183; at least 1 ticket &#183; fee sufficient</text>
    <text x="510" y="202">state := DrawRequested (before any external call)</text>
  </g>

  <line x1="480" y1="232" x2="786" y2="232" stroke="#454b78" stroke-width="2" marker-end="url(#rs-arr)"/>
  <text x="633" y="225" text-anchor="middle" font-size="12.5" font-weight="600" fill="#454b78">requestV2(callbackGasLimit), pays fee</text>

  <line x1="786" y1="262" x2="484" y2="262" stroke="#7b3fe4" stroke-width="2" marker-end="url(#rs-arr-p)"/>
  <text x="633" y="255" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7b3fe4">sequence number (the raffle's one request ID)</text>

  <g font-size="12" fill="#454b78">
    <rect x="497" y="276" width="330" height="48" rx="8" fill="#f4f4fb"/>
    <text x="510" y="296">stores the sequence number; credits any</text>
    <text x="510" y="314">fee overpayment to the requester (pull refund)</text>
  </g>

  <!-- gap -->
  <g>
    <rect x="60" y="344" width="840" height="30" rx="6" fill="#fff7dc"/>
    <text x="480" y="364" text-anchor="middle" font-size="12.5" font-weight="650" fill="#7a4f00">delivery is not instant: the provider reveals its committed value offchain; if nothing arrives for 2 days, anyone may open the refund path instead</text>
  </g>

  <!-- transaction 2 -->
  <rect x="380" y="390" width="520" height="20" rx="4" fill="#e3f7ee" opacity="0.7"/>
  <text x="390" y="384" font-size="11.5" font-weight="700" fill="#0d6b45">TRANSACTION 2: the callback</text>

  <line x1="790" y1="422" x2="484" y2="422" stroke="#7b3fe4" stroke-width="2" marker-end="url(#rs-arr-p)"/>
  <text x="637" y="415" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7b3fe4">entropyCallback(sequence, randomNumber)</text>

  <g font-size="12" fill="#454b78">
    <rect x="120" y="436" width="440" height="84" rx="8" fill="#e3f7ee"/>
    <text x="134" y="456" font-weight="700" fill="#0d6b45">Storage-only resolution:</text>
    <text x="134" y="474">sender must be the configured Entropy contract; sequence must match</text>
    <text x="134" y="492">winning ticket = (random mod totalTickets) + 1; owner snapshotted</text>
    <text x="134" y="510">fee, winner, sponsor claims recorded; state := Resolved; no transfers</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#676c94">
    <line x1="60" y1="545" x2="90" y2="545" stroke="#454b78" stroke-width="2" marker-end="url(#rs-arr)"/>
    <text x="100" y="549">call made by the raffle or a user</text>
    <line x1="330" y1="545" x2="360" y2="545" stroke="#7b3fe4" stroke-width="2" marker-end="url(#rs-arr-p)"/>
    <text x="370" y="549">call or data from Pyth Entropy</text>
    <rect x="600" y="536" width="16" height="12" fill="#f4f4fb" stroke="#9aa0c0" stroke-width="1"/>
    <text x="624" y="547">what the contract does internally</text>
  </g>
</svg>
