<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="Inter, sans-serif">
  <defs>
    <marker id="ag-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#454b78"/>
    </marker>
    <marker id="ag-arr-pink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d31d8b"/>
    </marker>
  </defs>

  <!-- step band -->
  <g>
    <!-- Step 1 -->
    <g>
      <rect x="10" y="30" width="172" height="150" rx="12" fill="#fce9f5" stroke="#d31d8b" stroke-width="1.5"/>
      <circle cx="34" cy="54" r="13" fill="#d31d8b"/>
      <text x="34" y="59" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
      <text x="56" y="59" font-size="15" font-weight="700" fill="#10143a">Escrow the prize</text>
      <text x="26" y="86" font-size="13" fill="#454b78">A sponsor locks one NFT</text>
      <text x="26" y="104" font-size="13" fill="#454b78">into a fresh raffle</text>
      <text x="26" y="122" font-size="13" fill="#454b78">contract and fixes the</text>
      <text x="26" y="140" font-size="13" fill="#454b78">price, minimum, and</text>
      <text x="26" y="158" font-size="13" fill="#454b78">closing time forever.</text>
    </g>
    <line x1="184" y1="105" x2="200" y2="105" stroke="#454b78" stroke-width="2" marker-end="url(#ag-arr)"/>

    <!-- Step 2 -->
    <g>
      <rect x="204" y="30" width="172" height="150" rx="12" fill="#e8f2ff" stroke="#1f6fd0" stroke-width="1.5"/>
      <circle cx="228" cy="54" r="13" fill="#1f6fd0"/>
      <text x="228" y="59" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
      <text x="250" y="59" font-size="15" font-weight="700" fill="#10143a">Sell tickets</text>
      <text x="220" y="86" font-size="13" fill="#454b78">Anyone buys numbered</text>
      <text x="220" y="104" font-size="13" fill="#454b78">tickets at one fixed</text>
      <text x="220" y="122" font-size="13" fill="#454b78">price. Every ticket has</text>
      <text x="220" y="140" font-size="13" fill="#454b78">the same chance and is</text>
      <text x="220" y="158" font-size="13" fill="#454b78">an NFT you can transfer.</text>
    </g>
    <line x1="378" y1="105" x2="394" y2="105" stroke="#454b78" stroke-width="2" marker-end="url(#ag-arr)"/>

    <!-- Step 3 -->
    <g>
      <rect x="398" y="30" width="172" height="150" rx="12" fill="#fff7dc" stroke="#eab308" stroke-width="1.5"/>
      <circle cx="422" cy="54" r="13" fill="#eab308"/>
      <text x="422" y="59" text-anchor="middle" font-size="14" font-weight="700" fill="#10143a">3</text>
      <text x="444" y="59" font-size="15" font-weight="700" fill="#10143a">Sale closes</text>
      <text x="414" y="86" font-size="13" fill="#454b78">At the fixed closing</text>
      <text x="414" y="104" font-size="13" fill="#454b78">time, sales stop. The</text>
      <text x="414" y="122" font-size="13" fill="#454b78">ticket count decides</text>
      <text x="414" y="140" font-size="13" fill="#454b78">which payout branch</text>
      <text x="414" y="158" font-size="13" fill="#454b78">will apply.</text>
    </g>
    <line x1="572" y1="105" x2="588" y2="105" stroke="#454b78" stroke-width="2" marker-end="url(#ag-arr)"/>

    <!-- Step 4 -->
    <g>
      <rect x="592" y="30" width="172" height="150" rx="12" fill="#f4f4fb" stroke="#1e2a9b" stroke-width="1.5"/>
      <circle cx="616" cy="54" r="13" fill="#1e2a9b"/>
      <text x="616" y="59" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
      <text x="638" y="59" font-size="15" font-weight="700" fill="#10143a">Random draw</text>
      <text x="608" y="86" font-size="13" fill="#454b78">Anyone requests one</text>
      <text x="608" y="104" font-size="13" fill="#454b78">random number from</text>
      <text x="608" y="122" font-size="13" fill="#454b78">Pyth Entropy. It picks</text>
      <text x="608" y="140" font-size="13" fill="#454b78">exactly one winning</text>
      <text x="608" y="158" font-size="13" fill="#454b78">ticket.</text>
    </g>
    <line x1="766" y1="105" x2="782" y2="105" stroke="#454b78" stroke-width="2" marker-end="url(#ag-arr)"/>

    <!-- Step 5 -->
    <g>
      <rect x="786" y="30" width="164" height="150" rx="12" fill="#e3f7ee" stroke="#0d6b45" stroke-width="1.5"/>
      <circle cx="810" cy="54" r="13" fill="#0d6b45"/>
      <text x="810" y="59" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">5</text>
      <text x="832" y="59" font-size="15" font-weight="700" fill="#10143a">Claim</text>
      <text x="802" y="86" font-size="13" fill="#454b78">The contract records</text>
      <text x="802" y="104" font-size="13" fill="#454b78">who is owed what.</text>
      <text x="802" y="122" font-size="13" fill="#454b78">Winner, sponsor, and</text>
      <text x="802" y="140" font-size="13" fill="#454b78">treasury each withdraw</text>
      <text x="802" y="158" font-size="13" fill="#454b78">on their own schedule.</text>
    </g>
  </g>

  <!-- branch split -->
  <line x1="480" y1="196" x2="480" y2="238" stroke="#d31d8b" stroke-width="2" marker-end="url(#ag-arr-pink)"/>
  <text x="497" y="222" font-size="13.5" font-weight="600" fill="#b81478">the ticket count at closing picks one of two branches</text>

  <!-- Branch A -->
  <g>
    <rect x="60" y="250" width="400" height="130" rx="12" fill="#ffffff" stroke="#0d6b45" stroke-width="2"/>
    <rect x="60" y="250" width="400" height="34" rx="12" fill="#e3f7ee"/>
    <rect x="60" y="272" width="400" height="12" fill="#e3f7ee"/>
    <text x="80" y="273" font-size="14.5" font-weight="700" fill="#0d6b45">ENOUGH TICKETS SOLD (minimum reached)</text>
    <text x="80" y="310" font-size="13.5" fill="#10143a">The winning ticket's holder claims the <tspan font-weight="700">NFT prize</tspan>.</text>
    <text x="80" y="332" font-size="13.5" fill="#10143a">The sponsor claims <tspan font-weight="700">95%</tspan> of all ticket money.</text>
    <text x="80" y="354" font-size="13.5" fill="#10143a">The protocol treasury claims a <tspan font-weight="700">5%</tspan> fee.</text>
  </g>

  <!-- Branch B -->
  <g>
    <rect x="500" y="250" width="400" height="130" rx="12" fill="#ffffff" stroke="#1f6fd0" stroke-width="2"/>
    <rect x="500" y="250" width="400" height="34" rx="12" fill="#e8f2ff"/>
    <rect x="500" y="272" width="400" height="12" fill="#e8f2ff"/>
    <text x="520" y="273" font-size="14.5" font-weight="700" fill="#1b5aa8">TOO FEW TICKETS SOLD (below minimum)</text>
    <text x="520" y="310" font-size="13.5" fill="#10143a">The winning ticket's holder claims <tspan font-weight="700">76%</tspan> of ticket money.</text>
    <text x="520" y="332" font-size="13.5" fill="#10143a">The sponsor keeps the <tspan font-weight="700">NFT</tspan> and claims <tspan font-weight="700">19%</tspan>.</text>
    <text x="520" y="354" font-size="13.5" fill="#10143a">The protocol treasury claims a <tspan font-weight="700">5%</tspan> fee.</text>
  </g>

  <!-- edge cases strip -->
  <g>
    <rect x="60" y="400" width="840" height="94" rx="12" fill="#f4f4fb" stroke="#9aa0c0" stroke-width="1"/>
    <text x="80" y="428" font-size="13.5" font-weight="700" fill="#10143a">And if something goes wrong, the exits are already built in:</text>
    <text x="80" y="452" font-size="13" fill="#454b78">If nobody buys a ticket, the sponsor's recovery address simply takes the NFT back after closing time (or the sponsor</text>
    <text x="80" y="470" font-size="13" fill="#454b78">cancels before the first sale). If the random draw is never requested within 3 days, or requested but never answered</text>
    <text x="80" y="488" font-size="13" fill="#454b78">within 2 days, anyone can trigger full refunds: every ticket gets its exact price back and the NFT returns home.</text>
  </g>

  <!-- legend -->
  <g font-size="12.5" fill="#676c94">
    <line x1="70" y1="522" x2="100" y2="522" stroke="#454b78" stroke-width="2" marker-end="url(#ag-arr)"/>
    <text x="110" y="526">next step</text>
    <line x1="200" y1="522" x2="230" y2="522" stroke="#d31d8b" stroke-width="2" marker-end="url(#ag-arr-pink)"/>
    <text x="240" y="526">decision made automatically by the contract</text>
    <text x="70" y="548">Percentages: the 5% protocol fee comes off the whole pot first; in the too-few branch the winner then</text>
    <text x="70" y="565">gets 80% of the remaining 95% (76% of the pot) and the sponsor gets the rest (19%).</text>
  </g>
</svg>
