<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 428" font-family="Inter, sans-serif">
  <defs>
    <marker id="ts-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#10143a"/>
    </marker>
  </defs>

  <!-- axis -->
  <line x1="40" y1="150" x2="930" y2="150" stroke="#10143a" stroke-width="2.5" marker-end="url(#ts-arr)"/>

  <!-- phases -->
  <rect x="40" y="100" width="380" height="40" rx="8" fill="#e8f2ff" stroke="#1f6fd0" stroke-width="1.3"/>
  <text x="230" y="125" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1b5aa8">Transfers allowed (Active)</text>

  <rect x="420" y="100" width="260" height="40" rx="8" fill="#fdeaee" stroke="#c8213f" stroke-width="1.3"/>
  <text x="550" y="125" text-anchor="middle" font-size="13.5" font-weight="700" fill="#c8213f">Transfers frozen (DrawRequested)</text>

  <rect x="680" y="100" width="250" height="40" rx="8" fill="#e3f7ee" stroke="#0d6b45" stroke-width="1.3"/>
  <text x="805" y="125" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0d6b45">Transfers resume (souvenirs)</text>

  <!-- markers -->
  <g text-anchor="middle">
    <line x1="420" y1="90" x2="420" y2="170" stroke="#c8213f" stroke-width="2"/>
    <text x="420" y="190" font-size="12.5" font-weight="700" fill="#c8213f">requestDraw succeeds</text>
    <text x="420" y="207" font-size="11.5" fill="#676c94">last moment ownership can change odds</text>

    <line x1="680" y1="90" x2="680" y2="170" stroke="#0d6b45" stroke-width="2.5"/>
    <text x="680" y="190" font-size="12.5" font-weight="700" fill="#0d6b45">callback: winner snapshot</text>
    <text x="680" y="207" font-size="11.5" fill="#676c94">owner of the winning ticket is</text>
    <text x="680" y="223" font-size="11.5" fill="#676c94">recorded in storage forever</text>
  </g>

  <!-- Maya/Leo story row -->
  <g>
    <rect x="40" y="250" width="890" height="128" rx="10" fill="#f4f4fb"/>
    <text x="60" y="278" font-size="13" font-weight="700" fill="#10143a">Example with ticket #7:</text>
    <text x="60" y="302" font-size="12.5" fill="#454b78">&#8226; Maya sells ticket #7 to Leo during the sale window: allowed. If #7 later wins, Leo is the winner.</text>
    <text x="60" y="323" font-size="12.5" fill="#454b78">&#8226; Leo tries to sell ticket #7 while the draw is pending: the transfer transaction reverts. Nobody can trade during the freeze.</text>
    <text x="60" y="344" font-size="12.5" fill="#454b78">&#8226; After resolution Leo can transfer ticket #7 again, but the recorded winner and payouts never change. The ticket is a keepsake.</text>
    <text x="60" y="365" font-size="12.5" fill="#454b78">&#8226; If the draw fails instead, ticket #7 stays frozen until its refund is credited to Leo; only then can it move again.</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#676c94">
    <line x1="40" y1="406" x2="70" y2="406" stroke="#10143a" stroke-width="2.5"/>
    <text x="80" y="410">time</text>
    <rect x="140" y="397" width="16" height="12" fill="#ffffff" stroke="#0d6b45" stroke-width="2"/>
    <text x="164" y="408">vertical rule = event fixed by one transaction</text>
  </g>
</svg>
