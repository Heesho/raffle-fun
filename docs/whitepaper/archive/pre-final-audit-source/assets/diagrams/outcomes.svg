<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Inter, sans-serif">
  <!-- six outcome cards, 2 rows x 3 cols -->

  <!-- row 1: randomness-resolved -->
  <text x="20" y="30" font-size="12" font-weight="750" fill="#676c94" letter-spacing="1.5">RESOLVED BY THE RANDOM DRAW</text>

  <!-- NftAwarded -->
  <g>
    <rect x="20" y="44" width="296" height="230" rx="12" fill="#ffffff" stroke="#0d6b45" stroke-width="2"/>
    <rect x="20" y="44" width="296" height="42" rx="12" fill="#e3f7ee"/>
    <rect x="20" y="74" width="296" height="12" fill="#e3f7ee"/>
    <text x="38" y="71" font-size="14.5" font-weight="800" fill="#0d6b45" font-family="Nunito, Inter, sans-serif">NftAwarded</text>
    <g font-size="12" fill="#10143a">
      <text x="38" y="110" font-weight="700">When:</text>
      <text x="100" y="110">tickets &#8805; minimum</text>
      <text x="38" y="136" font-weight="700">NFT:</text>
      <text x="100" y="136">winner claims it</text>
      <text x="38" y="162" font-weight="700">Winner:</text>
      <text x="100" y="162">the NFT, no cash</text>
      <text x="38" y="188" font-weight="700">Sponsor:</text>
      <text x="100" y="188">95% of the pot</text>
      <text x="38" y="214" font-weight="700">Fee:</text>
      <text x="100" y="214">5% of the pot</text>
      <text x="38" y="240" font-weight="700">Refunds:</text>
      <text x="100" y="240">none</text>
      <text x="38" y="262" font-size="11" fill="#676c94">Finalized by the Entropy callback</text>
    </g>
  </g>

  <!-- CashFallback -->
  <g>
    <rect x="332" y="44" width="296" height="230" rx="12" fill="#ffffff" stroke="#1f6fd0" stroke-width="2"/>
    <rect x="332" y="44" width="296" height="42" rx="12" fill="#e8f2ff"/>
    <rect x="332" y="74" width="296" height="12" fill="#e8f2ff"/>
    <text x="350" y="71" font-size="14.5" font-weight="800" fill="#1b5aa8" font-family="Nunito, Inter, sans-serif">CashFallback</text>
    <g font-size="12" fill="#10143a">
      <text x="350" y="110" font-weight="700">When:</text>
      <text x="412" y="110">tickets &lt; minimum</text>
      <text x="350" y="136" font-weight="700">NFT:</text>
      <text x="412" y="136">recovery address reclaims</text>
      <text x="350" y="162" font-weight="700">Winner:</text>
      <text x="412" y="162">76% of the pot in cash</text>
      <text x="350" y="188" font-weight="700">Sponsor:</text>
      <text x="412" y="188">19% of the pot + rounding</text>
      <text x="350" y="214" font-weight="700">Fee:</text>
      <text x="412" y="214">5% of the pot</text>
      <text x="350" y="240" font-weight="700">Refunds:</text>
      <text x="412" y="240">none</text>
      <text x="350" y="262" font-size="11" fill="#676c94">Finalized by the Entropy callback</text>
    </g>
  </g>

  <!-- empty-slot explainer -->
  <g>
    <rect x="644" y="44" width="296" height="230" rx="12" fill="#f4f4fb"/>
    <text x="662" y="80" font-size="12.5" font-weight="700" fill="#454b78">How to read these cards</text>
    <text x="662" y="106" font-size="11.5" fill="#676c94">"Pot" is every ticket payment held by the</text>
    <text x="662" y="124" font-size="11.5" fill="#676c94">raffle. Percentages come from the fixed</text>
    <text x="662" y="142" font-size="11.5" fill="#676c94">constants: a 5% protocol fee, then in the</text>
    <text x="662" y="160" font-size="11.5" fill="#676c94">cash branch 80% of the remainder to the</text>
    <text x="662" y="178" font-size="11.5" fill="#676c94">winner (76% of the pot) and the rest to</text>
    <text x="662" y="196" font-size="11.5" fill="#676c94">the sponsor (19% plus rounding dust).</text>
    <text x="662" y="222" font-size="11.5" fill="#676c94">"Recovery address" is the prize-return</text>
    <text x="662" y="240" font-size="11.5" fill="#676c94">destination the sponsor fixed at creation</text>
    <text x="662" y="258" font-size="11.5" fill="#676c94">(by default, the sponsor itself).</text>
  </g>

  <!-- row 2 -->
  <text x="20" y="312" font-size="12" font-weight="750" fill="#676c94" letter-spacing="1.5">NO DRAW EVER HAPPENS</text>

  <!-- NoSales -->
  <g>
    <rect x="20" y="326" width="296" height="230" rx="12" fill="#ffffff" stroke="#eab308" stroke-width="2"/>
    <rect x="20" y="326" width="296" height="42" rx="12" fill="#fff7dc"/>
    <rect x="20" y="356" width="296" height="12" fill="#fff7dc"/>
    <text x="38" y="353" font-size="14.5" font-weight="800" fill="#7a4f00" font-family="Nunito, Inter, sans-serif">NoSales / CancelledBeforeSale</text>
    <g font-size="12" fill="#10143a">
      <text x="38" y="392" font-weight="700">When:</text>
      <text x="100" y="392">zero tickets ever sold</text>
      <text x="38" y="418" font-weight="700">NFT:</text>
      <text x="100" y="418">recovery address reclaims</text>
      <text x="38" y="444" font-weight="700">Money:</text>
      <text x="100" y="444">none ever existed</text>
      <text x="38" y="470" font-weight="700">Fee:</text>
      <text x="100" y="470">none</text>
      <text x="38" y="496" font-weight="700">Draw:</text>
      <text x="100" y="496">never requested</text>
      <text x="38" y="522" font-size="11" fill="#676c94">NoSales: anyone closes after endTime.</text>
      <text x="38" y="538" font-size="11" fill="#676c94">Cancelled: sponsor only, before sale 1.</text>
    </g>
  </g>

  <!-- DrawNotRequested -->
  <g>
    <rect x="332" y="326" width="296" height="230" rx="12" fill="#ffffff" stroke="#b81478" stroke-width="2"/>
    <rect x="332" y="326" width="296" height="42" rx="12" fill="#fce9f5"/>
    <rect x="332" y="356" width="296" height="12" fill="#fce9f5"/>
    <text x="350" y="353" font-size="14.5" font-weight="800" fill="#b81478" font-family="Nunito, Inter, sans-serif">DrawNotRequested</text>
    <g font-size="12" fill="#10143a">
      <text x="350" y="392" font-weight="700">When:</text>
      <text x="412" y="392">no draw request succeeds</text>
      <text x="412" y="410">within 3 days of closing</text>
      <text x="350" y="436" font-weight="700">NFT:</text>
      <text x="412" y="436">recovery address reclaims</text>
      <text x="350" y="462" font-weight="700">Tickets:</text>
      <text x="412" y="462">full price refunded, each</text>
      <text x="412" y="480">ticket exactly once</text>
      <text x="350" y="506" font-weight="700">Fee:</text>
      <text x="412" y="506">none</text>
      <text x="350" y="530" font-size="11" fill="#676c94">Anyone can finalize after the deadline</text>
      <text x="350" y="546" font-size="11" fill="#676c94">and credit refunds in batches</text>
    </g>
  </g>

  <!-- DrawTimedOut -->
  <g>
    <rect x="644" y="326" width="296" height="230" rx="12" fill="#ffffff" stroke="#b81478" stroke-width="2"/>
    <rect x="644" y="326" width="296" height="42" rx="12" fill="#fce9f5"/>
    <rect x="644" y="356" width="296" height="12" fill="#fce9f5"/>
    <text x="662" y="353" font-size="14.5" font-weight="800" fill="#b81478" font-family="Nunito, Inter, sans-serif">DrawTimedOut</text>
    <g font-size="12" fill="#10143a">
      <text x="662" y="392" font-weight="700">When:</text>
      <text x="724" y="392">a request was accepted but</text>
      <text x="724" y="410">no callback within 2 days</text>
      <text x="662" y="436" font-weight="700">NFT:</text>
      <text x="724" y="436">recovery address reclaims</text>
      <text x="662" y="462" font-weight="700">Tickets:</text>
      <text x="724" y="462">full price refunded, each</text>
      <text x="724" y="480">ticket exactly once</text>
      <text x="662" y="506" font-weight="700">Fee:</text>
      <text x="724" y="506">none</text>
      <text x="662" y="530" font-size="11" fill="#676c94">A late callback still wins if it lands</text>
      <text x="662" y="546" font-size="11" fill="#676c94">before the timeout transaction</text>
    </g>
  </g>

  <!-- footer -->
  <text x="480" y="596" text-anchor="middle" font-size="12" fill="#676c94">Every raffle ends in exactly one of these six recorded outcomes. All payouts and refunds are pull-based claims that never expire.</text>
</svg>
