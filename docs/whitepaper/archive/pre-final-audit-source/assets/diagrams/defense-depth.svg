<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Inter, sans-serif">
  <!-- concentric defense layers, drawn as nested rounded rects -->
  <rect x="20" y="20" width="920" height="430" rx="16" fill="#fdeaf6"/>
  <rect x="60" y="60" width="840" height="350" rx="14" fill="#fce9f5"/>
  <rect x="100" y="100" width="760" height="270" rx="12" fill="#e9eefc"/>
  <rect x="140" y="140" width="680" height="190" rx="10" fill="#e3f7ee"/>
  <rect x="180" y="180" width="600" height="110" rx="8" fill="#ffffff" stroke="#0d6b45" stroke-width="1.6"/>

  <!-- layer labels -->
  <text x="40" y="47" font-size="13" font-weight="800" fill="#b81478" font-family="Nunito, Inter, sans-serif">LAYER 5 &#183; PROCESS</text>
  <text x="285" y="47" font-size="12" fill="#7a2a66">immutable deployments &#183; two-step multisig ownership &#183; no admin path into live raffles &#183; open source for independent review</text>

  <text x="80" y="87" font-size="13" font-weight="800" fill="#b81478" font-family="Nunito, Inter, sans-serif">LAYER 4 &#183; VERIFICATION</text>
  <text x="360" y="87" font-size="12" fill="#7a2a66">unit + boundary tests &#183; fuzzing &#183; stateful invariants &#183; adversarial token mocks &#183; static analysis &#183; 100% production coverage</text>

  <text x="120" y="127" font-size="13" font-weight="800" fill="#1e2a9b" font-family="Nunito, Inter, sans-serif">LAYER 3 &#183; ISOLATION</text>
  <text x="380" y="127" font-size="12" fill="#3a4290">one clone per raffle &#183; no shared pot &#183; factory holds no assets &#183; lens is read-only and registry-gated</text>

  <text x="160" y="167" font-size="13" font-weight="800" fill="#0d6b45" font-family="Nunito, Inter, sans-serif">LAYER 2 &#183; DEFENSIVE CODE</text>
  <text x="440" y="167" font-size="12" fill="#28604a">reentrancy guards &#183; checks-effects-interactions &#183; exact balance deltas &#183; SafeERC20 &#183; bounded loops &#183; custom errors</text>

  <!-- core -->
  <text x="480" y="212" text-anchor="middle" font-size="14" font-weight="800" fill="#0d6b45" font-family="Nunito, Inter, sans-serif">LAYER 1 &#183; CORE STATE-MACHINE RULES</text>
  <text x="480" y="238" text-anchor="middle" font-size="12.5" fill="#10143a">monotonic states &#183; one stored randomness sequence &#183; winner snapshot &#183; exact prize binding</text>
  <text x="480" y="258" text-anchor="middle" font-size="12.5" fill="#10143a">pull claims &#183; storage-only callback &#183; transfer freezes &#183; deadline-bounded refund recovery</text>
  <text x="480" y="280" text-anchor="middle" font-size="11.5" fill="#676c94">the invariants every other layer exists to protect</text>

  <!-- caption -->
  <text x="480" y="475" text-anchor="middle" font-size="12.5" fill="#454b78">An attacker must defeat every layer from the outside in. Each layer assumes the ones outside it may fail. None of this equals an independent audit.</text>
</svg>
