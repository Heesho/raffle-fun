<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Inter, sans-serif">
  <defs>
    <marker id="ol-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#454b78"/>
    </marker>
    <marker id="ol-arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c8213f"/>
    </marker>
    <marker id="ol-arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0d6b45"/>
    </marker>
  </defs>

  <!-- start -->
  <g>
    <rect x="30" y="30" width="200" height="70" rx="12" fill="#e8f2ff" stroke="#1f6fd0" stroke-width="1.5"/>
    <text x="130" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#1b5aa8">Sale closed, tickets sold</text>
    <text x="130" y="80" text-anchor="middle" font-size="12" fill="#454b78">the draw is now everyone's job</text>
  </g>

  <!-- decision 1 -->
  <line x1="232" y1="65" x2="306" y2="65" stroke="#454b78" stroke-width="2" marker-end="url(#ol-arr)"/>
  <g>
    <rect x="310" y="30" width="250" height="70" rx="12" fill="#fff7dc" stroke="#eab308" stroke-width="1.5"/>
    <text x="435" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#7a4f00">Draw requested within 3 days?</text>
    <text x="435" y="80" text-anchor="middle" font-size="12" fill="#454b78">anyone may pay the fee and request</text>
  </g>

  <!-- yes: requested -->
  <line x1="562" y1="65" x2="636" y2="65" stroke="#0d6b45" stroke-width="2" marker-end="url(#ol-arr-g)"/>
  <text x="597" y="55" text-anchor="middle" font-size="12" font-weight="700" fill="#0d6b45">yes</text>
  <g>
    <rect x="640" y="30" width="290" height="70" rx="12" fill="#f4f4fb" stroke="#7b3fe4" stroke-width="1.5"/>
    <text x="785" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#7b3fe4">Waiting for the callback</text>
    <text x="785" y="80" text-anchor="middle" font-size="12" fill="#454b78">transfers frozen; a 2-day clock starts</text>
  </g>

  <!-- decision 2 -->
  <line x1="785" y1="102" x2="785" y2="146" stroke="#454b78" stroke-width="2" marker-end="url(#ol-arr)"/>
  <g>
    <rect x="650" y="150" width="270" height="66" rx="12" fill="#fff7dc" stroke="#eab308" stroke-width="1.5"/>
    <text x="785" y="177" text-anchor="middle" font-size="14" font-weight="700" fill="#7a4f00">Callback within 2 days?</text>
    <text x="785" y="198" text-anchor="middle" font-size="12" fill="#454b78">Pyth must deliver the stored sequence</text>
  </g>

  <!-- callback yes -> resolved -->
  <line x1="920" y1="216" x2="920" y2="256" stroke="#0d6b45" stroke-width="0" />
  <line x1="850" y1="218" x2="850" y2="258" stroke="#0d6b45" stroke-width="2" marker-end="url(#ol-arr-g)"/>
  <text x="862" y="242" font-size="12" font-weight="700" fill="#0d6b45">yes</text>
  <g>
    <rect x="740" y="262" width="190" height="66" rx="12" fill="#e3f7ee" stroke="#0d6b45" stroke-width="2"/>
    <text x="835" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#0d6b45">Resolved normally</text>
    <text x="835" y="311" text-anchor="middle" font-size="12" fill="#454b78">winner picked; claims open</text>
  </g>

  <!-- no request -> refunding -->
  <line x1="435" y1="102" x2="435" y2="256" stroke="#c8213f" stroke-width="2" marker-end="url(#ol-arr-r)"/>
  <text x="447" y="150" font-size="12" font-weight="700" fill="#c8213f">no: 3 days pass</text>
  <text x="447" y="167" font-size="11.5" fill="#c8213f">finalizeUnrequestedDraw</text>
  <text x="447" y="183" font-size="11.5" fill="#c8213f">(callable by anyone)</text>

  <!-- callback no -> refunding -->
  <line x1="700" y1="218" x2="560" y2="272" stroke="#c8213f" stroke-width="2" marker-end="url(#ol-arr-r)"/>
  <text x="560" y="230" font-size="12" font-weight="700" fill="#c8213f">no: 2 days pass</text>
  <text x="560" y="247" font-size="11.5" fill="#c8213f">finalizeTimedOutDraw (anyone)</text>

  <!-- refunding box -->
  <g>
    <rect x="280" y="262" width="280" height="120" rx="12" fill="#fce9f5" stroke="#b81478" stroke-width="2"/>
    <text x="420" y="290" text-anchor="middle" font-size="14.5" font-weight="800" fill="#b81478" font-family="Nunito, Inter, sans-serif">Refunding</text>
    <text x="420" y="313" text-anchor="middle" font-size="12" fill="#454b78">no winner, no fee, no sponsor proceeds;</text>
    <text x="420" y="331" text-anchor="middle" font-size="12" fill="#454b78">the whole pot becomes refund liability;</text>
    <text x="420" y="349" text-anchor="middle" font-size="12" fill="#454b78">the recovery address may reclaim the NFT;</text>
    <text x="420" y="367" text-anchor="middle" font-size="12" fill="#454b78">tickets stay frozen until each is credited</text>
  </g>

  <!-- refund crediting -->
  <line x1="420" y1="384" x2="420" y2="424" stroke="#454b78" stroke-width="2" marker-end="url(#ol-arr)"/>
  <g>
    <rect x="220" y="428" width="400" height="70" rx="12" fill="#ffffff" stroke="#b81478" stroke-width="1.5"/>
    <text x="420" y="454" text-anchor="middle" font-size="13" font-weight="700" fill="#b81478">creditTicketRefunds (anyone, batches of up to 100)</text>
    <text x="420" y="476" text-anchor="middle" font-size="12" fill="#454b78">each sold ticket credits its exact price, once, to its frozen owner;</text>
    <text x="420" y="492" text-anchor="middle" font-size="12" fill="#454b78">owners then withdraw with a normal pull claim</text>
  </g>

  <!-- late callback race note -->
  <g>
    <rect x="650" y="360" width="280" height="106" rx="12" fill="#f4f4fb" stroke="#9aa0c0" stroke-width="1.2"/>
    <text x="666" y="386" font-size="12" font-weight="700" fill="#454b78">The race at the deadline:</text>
    <text x="666" y="408" font-size="11.5" fill="#676c94">after day 2 both a late callback and the</text>
    <text x="666" y="425" font-size="11.5" fill="#676c94">timeout are valid. Whichever transaction</text>
    <text x="666" y="442" font-size="11.5" fill="#676c94">lands first wins; the loser is ignored</text>
    <text x="666" y="459" font-size="11.5" fill="#676c94">harmlessly. There is never a mixed result.</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#676c94">
    <line x1="30" y1="528" x2="60" y2="528" stroke="#0d6b45" stroke-width="2" marker-end="url(#ol-arr-g)"/>
    <text x="70" y="532">normal path</text>
    <line x1="180" y1="528" x2="210" y2="528" stroke="#c8213f" stroke-width="2" marker-end="url(#ol-arr-r)"/>
    <text x="220" y="532">deadline-triggered failure path (anyone can trigger; nothing is discretionary)</text>
  </g>
</svg>
