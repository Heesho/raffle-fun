<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 552" font-family="Inter, sans-serif">
  <defs>
    <marker id="pt-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#454b78"/>
    </marker>
    <marker id="pt-arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa0c0"/>
    </marker>
  </defs>

  <!-- central raffle contract -->
  <g>
    <rect x="360" y="195" width="240" height="130" rx="14" fill="#1e2a9b"/>
    <text x="480" y="232" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff" font-family="Nunito, Inter, sans-serif">Raffle contract</text>
    <text x="480" y="258" text-anchor="middle" font-size="12.5" fill="#c9d2ff">holds the prize NFT and</text>
    <text x="480" y="276" text-anchor="middle" font-size="12.5" fill="#c9d2ff">all ticket money in escrow;</text>
    <text x="480" y="294" text-anchor="middle" font-size="12.5" fill="#c9d2ff">enforces every rule below</text>
    <text x="480" y="315" text-anchor="middle" font-size="11.5" fill="#8fa0f5">one immutable clone per raffle</text>
  </g>

  <!-- sponsor -->
  <g>
    <rect x="40" y="40" width="215" height="92" rx="12" fill="#fce9f5" stroke="#d31d8b" stroke-width="1.5"/>
    <text x="60" y="68" font-size="15" font-weight="700" fill="#b81478">Sponsor</text>
    <text x="60" y="90" font-size="12.5" fill="#454b78">deposits the prize NFT, fixes the</text>
    <text x="60" y="107" font-size="12.5" fill="#454b78">rules and a prize-recovery address</text>
    <text x="60" y="124" font-size="12.5" fill="#454b78">once, receives sponsor settlement</text>
  </g>
  <line x1="200" y1="136" x2="384" y2="204" stroke="#454b78" stroke-width="1.8" marker-end="url(#pt-arr)"/>
  <text x="322" y="158" font-size="12" font-weight="600" fill="#676c94">escrows NFT, fixes rules</text>

  <!-- buyers -->
  <g>
    <rect x="40" y="220" width="215" height="92" rx="12" fill="#e8f2ff" stroke="#1f6fd0" stroke-width="1.5"/>
    <text x="60" y="248" font-size="15" font-weight="700" fill="#1b5aa8">Buyers &amp; ticket holders</text>
    <text x="60" y="270" font-size="12.5" fill="#454b78">pay the fixed price, receive</text>
    <text x="60" y="287" font-size="12.5" fill="#454b78">transferable ticket NFTs, hold</text>
    <text x="60" y="304" font-size="12.5" fill="#454b78">equal odds per ticket</text>
  </g>
  <line x1="258" y1="264" x2="356" y2="264" stroke="#454b78" stroke-width="1.8" marker-end="url(#pt-arr)"/>
  <text x="264" y="254" font-size="12" font-weight="600" fill="#676c94">pay, get tickets</text>

  <!-- draw requester -->
  <g>
    <rect x="40" y="400" width="215" height="92" rx="12" fill="#fff7dc" stroke="#eab308" stroke-width="1.5"/>
    <text x="60" y="428" font-size="15" font-weight="700" fill="#7a4f00">Draw requester (anyone)</text>
    <text x="60" y="450" font-size="12.5" fill="#454b78">within 3 days of closing, pays</text>
    <text x="60" y="467" font-size="12.5" fill="#454b78">the small oracle fee and triggers</text>
    <text x="60" y="484" font-size="12.5" fill="#454b78">the one random draw</text>
  </g>
  <line x1="210" y1="400" x2="390" y2="322" stroke="#454b78" stroke-width="1.8" marker-end="url(#pt-arr)"/>
  <text x="290" y="348" font-size="12" font-weight="600" fill="#676c94">requests the draw</text>

  <!-- pyth -->
  <g>
    <rect x="705" y="40" width="215" height="92" rx="12" fill="#f4f4fb" stroke="#7b3fe4" stroke-width="1.5"/>
    <text x="725" y="68" font-size="15" font-weight="700" fill="#7b3fe4">Pyth Entropy (oracle)</text>
    <text x="725" y="90" font-size="12.5" fill="#454b78">independent service that</text>
    <text x="725" y="107" font-size="12.5" fill="#454b78">delivers the one verified</text>
    <text x="725" y="124" font-size="12.5" fill="#454b78">random number</text>
  </g>
  <line x1="760" y1="136" x2="580" y2="200" stroke="#454b78" stroke-width="1.8" marker-end="url(#pt-arr)"/>
  <text x="618" y="162" font-size="12" font-weight="600" fill="#676c94">delivers randomness</text>

  <!-- winner -->
  <g>
    <rect x="705" y="220" width="215" height="92" rx="12" fill="#e3f7ee" stroke="#0d6b45" stroke-width="1.5"/>
    <text x="725" y="248" font-size="15" font-weight="700" fill="#0d6b45">Winner &amp; claimants</text>
    <text x="725" y="270" font-size="12.5" fill="#454b78">whoever holds the winning</text>
    <text x="725" y="287" font-size="12.5" fill="#454b78">ticket at the draw; pulls the</text>
    <text x="725" y="304" font-size="12.5" fill="#454b78">prize or cash themselves</text>
  </g>
  <line x1="604" y1="264" x2="701" y2="264" stroke="#454b78" stroke-width="1.8" marker-end="url(#pt-arr)"/>
  <text x="612" y="254" font-size="12" font-weight="600" fill="#676c94">records claims</text>

  <!-- treasury -->
  <g>
    <rect x="705" y="400" width="215" height="92" rx="12" fill="#e3f7ee" stroke="#0d6b45" stroke-width="1.5" stroke-dasharray="none"/>
    <text x="725" y="428" font-size="15" font-weight="700" fill="#0d6b45">Protocol treasury</text>
    <text x="725" y="450" font-size="12.5" fill="#454b78">fixed address that may claim</text>
    <text x="725" y="467" font-size="12.5" fill="#454b78">the 5% fee after the raffle</text>
    <text x="725" y="484" font-size="12.5" fill="#454b78">resolves</text>
  </g>
  <line x1="600" y1="322" x2="750" y2="398" stroke="#454b78" stroke-width="1.8" marker-end="url(#pt-arr)"/>
  <text x="682" y="345" font-size="12" font-weight="600" fill="#676c94">credits 5% fee</text>

  <!-- factory owner (outside, dashed = no power over live raffles) -->
  <g>
    <rect x="368" y="415" width="224" height="92" rx="12" fill="#ffffff" stroke="#9aa0c0" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="388" y="443" font-size="15" font-weight="700" fill="#676c94">Factory owner (admin)</text>
    <text x="388" y="465" font-size="12.5" fill="#676c94">admits payment tokens and can</text>
    <text x="388" y="482" font-size="12.5" fill="#676c94">pause new creation; has no</text>
    <text x="388" y="499" font-size="12.5" fill="#676c94">power inside this box at all</text>
  </g>
  <line x1="480" y1="413" x2="480" y2="330" stroke="#9aa0c0" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#pt-arr-g)"/>
  <text x="490" y="368" font-size="12" font-weight="600" fill="#9aa0c0">cannot reach in</text>

  <!-- legend -->
  <g font-size="12.5" fill="#676c94">
    <line x1="248" y1="536" x2="278" y2="536" stroke="#454b78" stroke-width="1.8" marker-end="url(#pt-arr)"/>
    <text x="288" y="540">onchain interaction</text>
    <line x1="452" y1="536" x2="482" y2="536" stroke="#9aa0c0" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#pt-arr-g)"/>
    <text x="492" y="540">no direct power over a live raffle</text>
  </g>
</svg>
