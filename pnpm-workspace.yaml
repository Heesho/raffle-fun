packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@biomejs/biome": true
  bufferutil: true
  esbuild: true
  keccak: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true

nodeVersion: 22.23.2
engineStrict: true
autoInstallPeers: true
strictPeerDependencies: true
minimumReleaseAge: 1440

overrides:
  "@emnapi/core": "2.0.0-alpha.3"
  "@emnapi/runtime": "2.0.0-alpha.3"
  "@actions/http-client>undici": "6.28.0"
  "@graphprotocol/graph-cli>undici": "7.29.0"
  "native-fetch>undici": "7.29.0"
  adm-zip: "0.6.0"
  axios: "0.33.0"
  cross-spawn: "7.0.6"
  decompress: "npm:@xhmikosr/decompress@11.1.3"
  ejs: "3.1.10"
  glob: "11.1.0"
  immutable: "5.1.9"
  fast-uri: "3.1.5"
  js-yaml: "4.3.1"
  lodash-es: "4.18.1"
  nanoid: "3.3.17"
  postcss: "8.5.25"
  semver: "7.8.5"
  sharp: "0.35.3"
  uuid: "11.1.1"
  yaml: "2.9.0"
