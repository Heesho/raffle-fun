# Out-of-tree test harness for the in-scope raffle contracts (nothing under packages/ is modified).
[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = []
solc_version = "0.8.36"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
offline = true
allow_paths = []
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@chainlink/contracts/=node_modules/@chainlink/contracts/",
  "raffle/=raffle-src/",
]
code_size_limit = 1_000_000
fuzz = { runs = 2_000, seed = "0x534543555245" }
invariant = { runs = 256, depth = 120, fail_on_revert = false }
