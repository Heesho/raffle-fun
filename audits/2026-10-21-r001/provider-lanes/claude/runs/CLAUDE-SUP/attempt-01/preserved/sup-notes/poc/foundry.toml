[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = []
solc_version = "0.8.36"
auto_detect_solc = false
offline = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
allow_paths = ["../../packages"]
fuzz = { runs = 512, seed = "0x5355505f52303031" }
remappings = [
  "@openzeppelin/contracts/=../../packages/contracts/node_modules/@openzeppelin/contracts/",
  "@chainlink/contracts/=../../packages/contracts/node_modules/@chainlink/contracts/",
  "raffle/=../../packages/contracts/src/",
]
