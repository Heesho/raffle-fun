# Lane-owned harness project (Anthropic lane, r001). Compiler profile mirrors frozen profile.default:
# solc 0.8.36, evm cancun, optimizer true/200, via_ir false. Production sources are byte-identical copies (hash-verified).
[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc_version = "0.8.36"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fuzz = { runs = 5000 }
invariant = { runs = 512, depth = 128, fail_on_revert = false, show_metrics = true }
