[profile.default]
src = "snapshot/target/packages/contracts/src"
test = "test"
out = "out"
cache_path = "cache"
solc_version = "0.8.36"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/=snapshot/target/packages/contracts/node_modules/@openzeppelin/", "@chainlink/=snapshot/target/packages/contracts/node_modules/@chainlink/"]
